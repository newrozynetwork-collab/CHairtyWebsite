  }
  // blackboard on a wooden frame, chalk ledge
  {
    const kids = [];

    kids.push(Box([BX, BY0 - 0.03, BZ], [BW / 2 + 0.06, 0.03, 0.025], fm));

  // ---------- volumetric beam through the window + dust motes ----------
  {
    const s = 0.25, sw = W * s, sh = H * s;
    const lay = newLayer(sw, sh), lc = lay.getContext('2d'), id = lc.createImageData(sw, sh), d = id.data;
    const D = [0, 0, 0];
    for (let y = 0; y < sh; y++) for (let x = 0; x < sw; x++) {
      const X = (x + 0.5) / s, Y = (y + 0.5) / s;
      const a = X - cam.cx, b = -(Y - cam.cy);
      let dx = cam.fw[0] * F + cam.rt[0] * a + cam.up[0] * b, dy = cam.fw[1] * F + cam.rt[1] * a + cam.up[1] * b, dz = cam.fw[2] * F + cam.rt[2] * a + cam.up[2] * b;
      const l = Math.hypot(dx, dy, dz); dx /= l; dy /= l; dz /= l;
      const j = Math.min(H - 1, Math.round(Y)) * W + Math.min(W - 1, Math.round(X));
      const tmax = Math.min(res.T[j], 14);
      let acc = 0; const NS = 64;
      for (let k = 0; k < NS; k++) {
        const t = (k + 0.5) / NS * tmax;
        const px = cam.pos[0] + dx * t, py = cam.pos[1] + dy * t, pz = cam.pos[2] + dz * t;
        acc += sunThroughWindow(px, py, pz) * (0.85 + 0.3 * nC(px * 3 + pz, py * 3));
      }
      acc *= tmax / NS;
      const v = clamp(acc * 0.16);
      d[(y * sw + x) * 4] = 255 * v; d[(y * sw + x) * 4 + 1] = 228 * v; d[(y * sw + x) * 4 + 2] = 182 * v; d[(y * sw + x) * 4 + 3] = 255;
    }
    lc.putImageData(id, 0, 0);
    ctx.save(); ctx.globalCompositeOperation = 'screen'; ctx.imageSmoothingQuality = 'high'; ctx.drawImage(blurCopy(lay, 2), 0, 0, W, H); ctx.restore();
    // motes in the beam
    const motes = newLayer(), mc = motes.getContext('2d');
    let placed = 0;
    for (let k = 0; k < 6000 && placed < 260; k++) {
      const p = [rand.range(-1.5, XW), rand.range(0.2, 2.2), rand.range(-6.5, -2.5)];
      if (sunThroughWindow(p[0], p[1], p[2]) < 0.5) continue;
      const sp = cam.proj(p); if (sp[2] < 0.5) continue;
      placed++;
      const coc = Math.abs(1 / sp[2] - 1 / 4.5) * 40;
      const r = 1.0 + coc + rand() * 0.8, br = Math.pow(rand(), 2) * (coc > 3 ? 0.25 : 0.7) + 0.06;
      const g = mc.createRadialGradient(sp[0], sp[1], 0, sp[0], sp[1], r * 1.6);
      g.addColorStop(0, `rgba(255,240,215,${br})`); g.addColorStop(1, 'rgba(255,235,205,0)');
      mc.fillStyle = g; mc.beginPath(); mc.arc(sp[0], sp[1], r * 1.6, 0, Math.PI * 2); mc.fill();
    }
    ctx.save(); ctx.globalCompositeOperation = 'screen'; ctx.drawImage(motes, 0, 0); ctx.restore();
  }
  addBloom(ctx, { threshold: 0.8, knee: 0.12, radii: [6, 22, 70], weights: [0.45, 0.4, 0.35], strength: 0.6, tint: [255, 238, 214] });
  finish(ctx, {
    grain: 0.03, seed: 41, vignette: 0.3, vcx: 0.55, vcy: 0.5, vr0: 0.3, vr1: 1.05,
    grade: (r, g, b) => {
      const l = 0.2126 * r + 0.7152 * g + 0.0722 * b;
      const s = 0.9; r = l + (r - l) * s; g = l + (g - l) * s; b = l + (b - l) * s;
      const c = 0.015 * (1 - smooth(0.0, 0.35, l)); b += c; r -= c * 0.4;
      return [r, g, b];
    },
  });
}

  try { await main(); } catch (e) { console.error('render failed: ' + (e && e.stack || e)); }
  window.__done = true;
}, 30));
