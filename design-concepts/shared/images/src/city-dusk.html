"use strict";
// ---------------------------------------------------------------- kit
const W = 2400, H = 1600;
const cvs = document.getElementById('c');
const ctx = cvs.getContext('2d', { willReadFrequently: true });

// seeded PRNG (mulberry32)
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function makeRand(seed) {
  const r = mulberry32(seed);
  const f = () => r();
  f.range = (a, b) => a + (b - a) * r();
  f.int = (a, b) => Math.floor(a + (b - a + 1) * r());
  f.gauss = () => { let u = 0; while (u === 0) u = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * r()); };
  f.pick = arr => arr[Math.floor(r() * arr.length)];
  return f;
}
// 2D value noise in [0,1] and fBm
function makeNoise(seed) {
  const r = mulberry32(seed), P = new Uint16Array(512), G = new Float32Array(256);
  for (let i = 0; i < 256; i++) { P[i] = i; G[i] = r(); }
  for (let i = 255; i > 0; i--) { const j = Math.floor(r() * (i + 1)); const t = P[i]; P[i] = P[j]; P[j] = t; }
  for (let i = 0; i < 256; i++) P[i + 256] = P[i];
  return function (x, y) {
    const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
    const X = xi & 255, Y = yi & 255;
    const a = G[P[P[X] + Y]], b = G[P[P[X + 1] + Y]], c = G[P[P[X] + Y + 1]], d = G[P[P[X + 1] + Y + 1]];
    const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  };
}
function fbm(n, x, y, oct = 5, lac = 2.0, gain = 0.5) {
  let s = 0, a = 0.5, f = 1, norm = 0;
  for (let i = 0; i < oct; i++) { s += a * n(x * f + i * 17.3, y * f - i * 9.1); norm += a; a *= gain; f *= lac; }
  return s / norm;
}
const clamp = (v, a = 0, b = 1) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };

const rgba = (c, a = 1) => `rgba(${Math.round(c[0])},${Math.round(c[1])},${Math.round(c[2])},${a})`;
const mixc = (c1, c2, t) => [lerp(c1[0], c2[0], t), lerp(c1[1], c2[1], t), lerp(c1[2], c2[2], t)];
// vectors
const v3 = {
  add: (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]],
  sub: (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]],
  mul: (a, s) => [a[0] * s, a[1] * s, a[2] * s],
  dot: (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2],
  cross: (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]],
  len: a => Math.hypot(a[0], a[1], a[2]),
  norm: a => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; },
  lerp: (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t],
};
// linear light -> display (soft filmic shoulder + sRGB-ish gamma)
const toneMap = (x, exposure = 1) => Math.pow(1 - Math.exp(-Math.max(0, x) * exposure), 1 / 2.2);
const toneRGB = (c, exposure = 1) => [toneMap(c[0], exposure) * 255, toneMap(c[1], exposure) * 255, toneMap(c[2], exposure) * 255];
// layers
function newLayer(w = W, h = H) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function blurCopy(src, px, scale = 1) {

  const sw = Math.max(1, Math.round(src.width * scale)), sh = Math.max(1, Math.round(src.height * scale));
  const a = newLayer(sw, sh), ac = a.getContext('2d');
  ac.filter = `blur(${px * scale}px)`; ac.drawImage(src, 0, 0, sw, sh); ac.filter = 'none';
  if (scale === 1) return a;
  const b = newLayer(src.width, src.height), bc = b.getContext('2d');
  bc.imageSmoothingEnabled = true; bc.imageSmoothingQuality = 'high'; bc.drawImage(a, 0, 0, src.width, src.height);
  return b;
}
function convexHull(pts) {
  const p = pts.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  const cr = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
  const lo = [], up = [];
  for (const q of p) { while (lo.length >= 2 && cr(lo[lo.length - 2], lo[lo.length - 1], q) <= 0) lo.pop(); lo.push(q); }
  for (let i = p.length - 1; i >= 0; i--) { const q = p[i]; while (up.length >= 2 && cr(up[up.length - 2], up[up.length - 1], q) <= 0) up.pop(); up.push(q); }
  up.pop(); lo.pop(); return lo.concat(up);
}
function poly(c, pts) { c.beginPath(); c.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) c.lineTo(pts[i][0], pts[i][1]); c.closePath(); }
// bloom: bright-pass at quarter res, multi-radius blur, screen back
function addBloom(target, { threshold = 0.75, knee = 0.15, radii = [8, 24, 64], weights = [0.5, 0.35, 0.25], strength = 0.5, tint = [255, 240, 220] } = {}) {
  const s = 0.25, sw = W * s, sh = H * s;
  const small = newLayer(sw, sh), sc = small.getContext('2d', { willReadFrequently: true });
  sc.drawImage(target.canvas, 0, 0, sw, sh);
  const id = sc.getImageData(0, 0, sw, sh), d = id.data;
  for (let i = 0; i < d.length; i += 4) {
    const l = (0.2126 * d[i] + 0.7152 * d[i + 1] + 0.0722 * d[i + 2]) / 255;
    const k = smooth(threshold - knee, threshold + knee, l) * (l - threshold * 0.5);
    d[i] = d[i] * k * tint[0] / 255; d[i + 1] = d[i + 1] * k * tint[1] / 255; d[i + 2] = d[i + 2] * k * tint[2] / 255;
  }
  sc.putImageData(id, 0, 0);
  target.save(); target.globalCompositeOperation = 'screen'; target.imageSmoothingQuality = 'high';
  radii.forEach((r, i) => { const b = blurCopy(small, r * s); target.globalAlpha = clamp(strength * weights[i]); target.drawImage(b, 0, 0, W, H); });
  target.restore();
}
// final pass: optional grade, vignette, two-scale luminance film grain
function finish(target, { grain = 0.03, seed = 1, vignette = 0.3, vcx = 0.5, vcy = 0.5, vr0 = 0.35, vr1 = 0.95, grade = null } = {}) {
  const id = target.getImageData(0, 0, W, H), d = id.data, r = mulberry32(seed);
  // coarse grain field (half res, bilinear) for clumpy film structure
  const cw = W / 2 + 2, ch = H / 2 + 2, coarse = new Float32Array(cw * ch);
  for (let i = 0; i < coarse.length; i++) coarse[i] = (r() + r() + r() - 1.5) * 2;
  const diag = Math.hypot(W, H) / 2;
  for (let y = 0; y < H; y++) {
    const gy = y / 2, y0 = Math.floor(gy), fy = gy - y0;
    for (let x = 0; x < W; x++) {
      const i = (y * W + x) * 4;
      let R = d[i] / 255, G = d[i + 1] / 255, B = d[i + 2] / 255;
      if (grade) { const o = grade(R, G, B, x, y); R = o[0]; G = o[1]; B = o[2]; }
      if (vignette) {
        const dx = (x - vcx * W) / (W / 2), dy = (y - vcy * H) / (H / 2);
        const dd = Math.sqrt(dx * dx * 0.8 + dy * dy * 1.0) / 1.25;
        const v = 1 - vignette * smooth(vr0, vr1, dd);
        R *= v; G *= v; B *= v;
      }
      const gx = x / 2, x0 = Math.floor(gx), fx = gx - x0, j = y0 * cw + x0;
      const c = (coarse[j] * (1 - fx) + coarse[j + 1] * fx) * (1 - fy) + (coarse[j + cw] * (1 - fx) + coarse[j + cw + 1] * fx) * fy;
      const L = 0.2126 * R + 0.7152 * G + 0.0722 * B;
      const n = ((r() + r() + r() - 1.5) * 2 * 0.65 + c * 0.75) * grain * (0.45 + 2.2 * L * (1 - L));
      d[i] = clamp(R + n) * 255; d[i + 1] = clamp(G + n) * 255; d[i + 2] = clamp(B + n) * 255;
    }

  target.putImageData(id, 0, 0);
}
// piecewise-linear colour ramp: stops = [[t,[r,g,b]],...]
function ramp(stops, t) {
  if (t <= stops[0][0]) return stops[0][1].slice();
  for (let i = 1; i < stops.length; i++) if (t <= stops[i][0]) {
    const a = stops[i - 1], b = stops[i], u = (t - a[0]) / (b[0] - a[0]);
    return mixc(a[1], b[1], u);
  }
  return stops[stops.length - 1][1].slice();
}
const v2norm = a => { const l = Math.hypot(a[0], a[1]) || 1; return [a[0] / l, a[1] / l]; };
// ---------------------------------------------------------------- scene
// ===================== CITY AT DUSK =====================
// Blue hour from a rooftop ~46 m above the street. Calm sky, afterglow low on the left (west),
// a floodlit generic civic hall on a plaza in the middle distance, a cluster of plain towers behind it.
const rand = makeRand(52731);
const nA = makeNoise(1301), nB = makeNoise(1302), nC = makeNoise(1303);
function hash2(a, b) {
  let h = Math.imul((a * 2654435761) | 0, 0x27d4eb2d) ^ Math.imul((b * 40503) | 0, 0x165667b1);
  h = Math.imul(h ^ (h >>> 15), 0x85ebca6b); h ^= h >>> 13; h = Math.imul(h, 0xc2b2ae35); h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
const add3 = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
const mul3 = (a, s) => [a[0] * s, a[1] * s, a[2] * s];

const CAM_H = 46, F = 2700, CX = 1200, CY = 905;
const proj = (x, y, z) => [CX + F * x / z, CY - F * (y - CAM_H) / z];

// ---------- 1. sky ----------
const SKY = [[0.00, [25, 35, 57]], [0.26, [36, 51, 82]], [0.50, [58, 77, 110]], [0.70, [95, 109, 137]], [0.84, [141, 141, 156]], [0.94, [186, 165, 158]], [1.00, [212, 180, 156]]];
function skyRGB(X, Y) {
  const t = clamp(Y / CY);
  let c = ramp(SKY, t);
  const dx = (X - 430) / 1500, dy = Math.max(0, CY - Y) / 400;
  const g = Math.exp(-dx * dx) * Math.exp(-dy * 1.5);
  c = mixc(c, [236, 176, 130], 0.48 * g);
  const e = smooth(0.5, 1.0, X / W) * smooth(0.45, 1.0, t) * 0.14;   // eastern side cooler
  return mixc(c, [112, 122, 150], e);
}
{
  const img = ctx.createImageData(W, H), d = img.data;
  for (let Y = 0; Y < H; Y++) {
    for (let X = 0; X < W; X++) {
      const i = (Y * W + X) * 4;
      let c;
      if (Y <= CY) c = skyRGB(X, Y);
      else c = mixc(skyRGB(X, CY - 20), [44, 46, 58], smooth(CY, CY + 240, Y));
      const n = (rand() - 0.5) * 1.8;
      d[i] = c[0] + n; d[i + 1] = c[1] + n; d[i + 2] = c[2] + n; d[i + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
}
// thin stratus low in the sky, lit from below near the afterglow
{
  const cl = newLayer(), c2 = cl.getContext('2d');
  for (let k = 0; k < 34; k++) {
    const y = rand.range(700, 870), x = rand.range(-300, W + 300), w = rand.range(160, 620), h = rand.range(3, 10);
    const glow = Math.exp(-Math.pow((x - 430) / 1200, 2));
    const col = mixc([132, 128, 150], [236, 168, 138], glow);
    c2.fillStyle = rgba(col, rand.range(0.10, 0.26) * (0.5 + 0.5 * glow));
    c2.beginPath(); c2.ellipse(x, y, w, h, rand.range(-0.01, 0.01), 0, Math.PI * 2); c2.fill();
  }
  ctx.drawImage(blurCopy(cl, 5), 0, 0);
}

// ---------- 2. city model ----------
const HZ = []; for (let X = 0; X <= W + 8; X += 8) HZ.push(mul3(skyRGB(X, CY - 50), 0.86));
const hazeAt = X => HZ[clamp(Math.round(X / 8), 0, HZ.length - 1)];

  const k = Math.max(0, nx * GLOW[0] + nz * GLOW[1]);
  return [0.20 + 0.44 * k * k, 0.24 + 0.32 * k * k, 0.34 + 0.20 * k * k];

const ROOF_L = [0.40, 0.45, 0.57];

const RES = { type: 'res', fh: 3.1, bay: 3.7, ww: 0.42, wh: 0.5, lit: 0.40, warm: 0.94, ground: 3.5 };
const RES2 = { type: 'res', fh: 3.3, bay: 4.4, ww: 0.55, wh: 0.55, lit: 0.34, warm: 0.88, ground: 4.0 };

const toW = (u, v) => [cT * u + sT * v, -sT * u + cT * v];

let BID = 0;
function mkBox(pts, y0, y1, st) { const b = Object.assign({ pts, y0, y1, id: ++BID }, st); boxes.push(b); return b; }

const CIVIC = { x0: -128, x1: 118, z0: 205, z1: 505 };
const hitsCivic = pts => {
  const xs = pts.map(p => p[0]), zs = pts.map(p => p[1]);
  return Math.max(...xs) > CIVIC.x0 && Math.min(...xs) < CIVIC.x1 && Math.max(...zs) > CIVIC.z0 && Math.min(...zs) < CIVIC.z1;

  return [Math.exp(-d1 * d1), Math.exp(-d2 * d2)];

for (let iv = 1; iv <= 72; iv++) {

    const U0 = iu * Pu + ST / 2, U1 = (iu + 1) * Pu - ST / 2, V0 = iv * Pv + ST / 2, V1 = (iv + 1) * Pv - ST / 2;
    const cc = toW((U0 + U1) / 2, (V0 + V1) / 2);

    items.push({ kind: 'street', p0: toW(iu * Pu, iv * Pv), p1: toW((iu + 1) * Pu, iv * Pv) });
    items.push({ kind: 'street', p0: toW(iu * Pu, iv * Pv), p1: toW(iu * Pu, (iv + 1) * Pv) });

{

// ---------- 4. the civic hall ----------

// ---------- 5. plaza: paving, trees, lamps ----------
function drawPlaza() {
  const S = proj;
  const zf = 232, zb = HALL.pz - 1;
  const pts = [S(CIVIC.x0, 0, zf), S(CIVIC.x1, 0, zf), S(CIVIC.x1, 0, zb), S(CIVIC.x0, 0, zb)];
  const g = ctx.createLinearGradient(0, pts[0][1], 0, pts[2][1]);
  g.addColorStop(0, 'rgb(58,58,66)'); g.addColorStop(0.7, 'rgb(84,76,74)'); g.addColorStop(1, 'rgb(128,106,90)');
  ctx.fillStyle = g; poly(ctx, pts); ctx.fill();
  // paving joints, faint
  ctx.strokeStyle = 'rgba(30,30,38,0.25)'; ctx.lineWidth = 1;
  for (let x = CIVIC.x0; x <= CIVIC.x1; x += 6) { const a = S(x, 0, zf), b = S(x, 0, zb); ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke(); }

  ctx.save(); ctx.globalCompositeOperation = 'screen';
  const lamps = [];
  for (let z = 252; z < 405; z += 19) for (const x of [-46, -14, 6, 38]) lamps.push([x + (z % 2) * 0.0, z]);
  for (const [x, z] of lamps) {
    const p = S(x, 0, z), rx = F * 7 / z, ry = rx * (46 / z);
    ctx.save(); ctx.translate(p[0], p[1]); ctx.scale(1, Math.max(0.12, ry / rx));
    glowBlob(0, 0, rx, [255, 196, 132], 0.28); ctx.restore();
  }
  ctx.restore();
  // trees along both sides (rounded canopies, lit from below by the lamps)
  const trees = [];
  for (let z = 262; z < 400; z += 21) { trees.push([-92 + (z % 3), z]); trees.push([86 - (z % 3), z]); }
  trees.sort((a, b) => b[1] - a[1]);
  for (const [x, z] of trees) {
    const base = S(x, 0, z), top = S(x, 9.5, z), r = F * 4.2 / z;
    ctx.strokeStyle = 'rgba(30,28,30,0.9)'; ctx.lineWidth = Math.max(1, F * 0.35 / z);
    ctx.beginPath(); ctx.moveTo(base[0], base[1]); ctx.lineTo(top[0], top[1] + r * 0.6); ctx.stroke();
    const tr = makeRand(Math.round(x * 31 + z * 7));
    for (let k = 0; k < 9; k++) {
      const ox = tr.range(-0.7, 0.7) * r, oy = tr.range(-0.5, 0.4) * r, rr = r * tr.range(0.45, 0.7);
      const gg = ctx.createRadialGradient(top[0] + ox, top[1] + oy + rr * 0.5, rr * 0.1, top[0] + ox, top[1] + oy, rr);
      gg.addColorStop(0, 'rgba(120,104,72,0.95)'); gg.addColorStop(0.55, 'rgba(46,52,48,0.95)'); gg.addColorStop(1, 'rgba(34,40,42,0.0)');
      ctx.fillStyle = gg; ctx.beginPath(); ctx.arc(top[0] + ox, top[1] + oy, rr, 0, Math.PI * 2); ctx.fill();
    }
  }
  // lamp heads
  ctx.save(); ctx.globalCompositeOperation = 'screen';
  for (const [x, z] of lamps) { const p = S(x, 4.2, z); glowBlob(p[0], p[1], F * 0.5 / z * 3, [255, 226, 180], 0.8); }
  ctx.restore();
  // the street in front of the plaza: warm road surface and a few car lights
  const rz0 = 212, rz1 = 230;
  const road = [S(-400, 0, rz0), S(400, 0, rz0), S(400, 0, rz1), S(-400, 0, rz1)];
  ctx.fillStyle = 'rgb(46,44,50)'; poly(ctx, road); ctx.fill();
  ctx.save(); ctx.globalCompositeOperation = 'screen';
  const cr = makeRand(991);
  for (let k = 0; k < 9; k++) {
    const x = cr.range(-120, 120), lane = cr() < 0.5;
    const z = lane ? 216 : 225, p = S(x, 0.7, z);
    const col = lane ? [255, 236, 210] : [255, 70, 50];
    glowBlob(p[0], p[1], 9, col, 0.7); glowBlob(p[0] + (lane ? -11 : 11), p[1], 9, col, 0.7);
  }
  for (let x = -110; x <= 110; x += 26) { const p = S(x, 8, rz0 - 1); glowBlob(p[0], p[1], 16, [255, 214, 160], 0.65); }
  ctx.restore();
}

// ---------- 6. render all, back to front ----------
for (const it of items) {
  if (it.kind === 'box') drawBox(it.b, it.d);
  else if (it.kind === 'street') drawStreet(it);
  else if (it.kind === 'hall') drawHall();
  else if (it.kind === 'plaza') drawPlaza();
}
// city glow in the low haze along the horizon
{
  const g = ctx.createLinearGradient(0, CY - 120, 0, CY + 60);
  g.addColorStop(0, 'rgba(255,190,140,0)'); g.addColorStop(0.75, 'rgba(255,186,132,0.10)'); g.addColorStop(1, 'rgba(255,186,132,0.0)');
  ctx.save(); ctx.globalCompositeOperation = 'screen'; ctx.fillStyle = g; ctx.fillRect(0, CY - 120, W, 180); ctx.restore();
}

// ---------- 7. foreground parapet ----------
{
  const pl = newLayer(), pc = pl.getContext('2d');
  const yL = 1478, yR = 1496;
  pc.fillStyle = 'rgb(28,29,36)';
  pc.beginPath(); pc.moveTo(0, yL + 16); pc.lineTo(W, yR + 16); pc.lineTo(W, H); pc.lineTo(0, H); pc.closePath(); pc.fill();
  const cg = pc.createLinearGradient(0, yL, 0, yL + 18);
  cg.addColorStop(0, 'rgb(104,110,128)'); cg.addColorStop(0.5, 'rgb(76,80,96)'); cg.addColorStop(1, 'rgb(46,47,58)');
  pc.fillStyle = cg;
  pc.beginPath(); pc.moveTo(0, yL); pc.lineTo(W, yR); pc.lineTo(W, yR + 17); pc.lineTo(0, yL + 17); pc.closePath(); pc.fill();
  // concrete texture
  const id = pc.getImageData(0, yL - 2, W, H - yL + 2), d = id.data;
  for (let y = 0; y < H - yL + 2; y++) for (let x = 0; x < W; x++) {
    const i = (y * W + x) * 4; if (!d[i + 3]) continue;
    const m = 0.88 + 0.2 * fbm(nC, x * 0.02, y * 0.05, 3) + 0.05 * nB(x * 0.4, y * 0.4);
    d[i] *= m; d[i + 1] *= m; d[i + 2] *= m;
  }
  pc.putImageData(id, 0, yL - 2);
  ctx.drawImage(blurCopy(pl, 1.6), 0, 0);
}

// ---------- 8. bloom + finish ----------
addBloom(ctx, { threshold: 0.66, knee: 0.14, radii: [4, 14, 48], weights: [0.5, 0.4, 0.3], strength: 0.75, tint: [255, 226, 196] });
finish(ctx, {
  grain: 0.03, seed: 31, vignette: 0.26, vcx: 0.5, vcy: 0.56, vr0: 0.35, vr1: 1.05,
  grade: (r, g, b) => {
    const l = 0.2126 * r + 0.7152 * g + 0.0722 * b;
