<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>road-dusk — original illustration</title>
<style>html,body{margin:0;padding:0;background:#000}canvas{display:block}</style>
</head>
<body>
<canvas id="c" width="2400" height="1600"></canvas>
<script>
// road-dusk: original procedural illustration created for this proposal (deterministic, seeded).
window.__done = false;
// ---------------------------------------------------------------------------
// Shared helpers (inlined into every source so each page is self-contained).
// Deterministic: all randomness comes from seeded PRNGs.
// ---------------------------------------------------------------------------
const W = 2400, H = 1600;
function mulberry32(a) { return function () { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
let R = mulberry32(12345);
const setSeed = s => { R = mulberry32(s); };
const rnd = (a = 0, b = 1) => a + (b - a) * R();
const pick = arr => arr[Math.floor(R() * arr.length)];
const gauss = () => { let u = 0; for (let i = 0; i < 6; i++) u += R(); return (u - 3) / 0.7071; };
const clamp = (v, a = 0, b = 1) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, v) => { const t = clamp((v - a) / (b - a)); return t * t * (3 - 2 * t); };
const tick = () => new Promise(r => setTimeout(r, 0));

function makeNoise(s) {
  const r = mulberry32(s); const perm = new Uint8Array(256); for (let i = 0; i < 256; i++) perm[i] = i;
  for (let i = 255; i > 0; i--) { const j = Math.floor(r() * (i + 1)); const t = perm[i]; perm[i] = perm[j]; perm[j] = t; }
  const p = new Uint8Array(512); for (let i = 0; i < 512; i++) p[i] = perm[i & 255];
  const gx = new Float32Array(256), gy = new Float32Array(256);
  for (let i = 0; i < 256; i++) { const a = r() * Math.PI * 2; gx[i] = Math.cos(a); gy[i] = Math.sin(a); }
  function n2(x, y) {
    let xi = Math.floor(x), yi = Math.floor(y); const xf = x - xi, yf = y - yi; xi &= 255; yi &= 255;
    const u = xf * xf * xf * (xf * (xf * 6 - 15) + 10), v = yf * yf * yf * (yf * (yf * 6 - 15) + 10);
    const a = p[p[xi] + yi], b = p[p[xi + 1] + yi], c = p[p[xi] + yi + 1], d = p[p[xi + 1] + yi + 1];
    const ga = gx[a] * xf + gy[a] * yf, gb = gx[b] * (xf - 1) + gy[b] * yf, gc = gx[c] * xf + gy[c] * (yf - 1), gd = gx[d] * (xf - 1) + gy[d] * (yf - 1);
    const x1 = ga + (gb - ga) * u, x2 = gc + (gd - gc) * u; return (x1 + (x2 - x1) * v) * 1.41;
  }
  function fbm(x, y, o = 5, g = 0.5, l = 2.0) { let s = 0, a = 1, n = 0; for (let i = 0; i < o; i++) { s += a * n2(x, y); n += a; a *= g; x = x * l + 17.31; y = y * l + 9.17; } return s / n; }
  function ridged(x, y, o = 5) { let s = 0, a = 1, n = 0, w = 1; for (let i = 0; i < o; i++) { let v = 1 - Math.abs(n2(x, y)); v *= v; s += v * a * w; n += a; w = clamp(v * 1.6, 0.25, 1); a *= 0.5; x = x * 2.03 + 5.1; y = y * 2.03 + 1.7; } return s / n; }
  return { n2, fbm, ridged };
}

function hx(h) { if (Array.isArray(h)) return h; h = h.replace('#', ''); return [parseInt(h.substr(0, 2), 16), parseInt(h.substr(2, 2), 16), parseInt(h.substr(4, 2), 16)]; }
function mix(a, b, t) { a = hx(a); b = hx(b); return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; }
function scl(a, k) { a = hx(a); return [a[0] * k, a[1] * k, a[2] * k]; }
function scr(a, b) { a = hx(a); b = hx(b); return [255 - (255 - a[0]) * (255 - b[0]) / 255, 255 - (255 - a[1]) * (255 - b[1]) / 255, 255 - (255 - a[2]) * (255 - b[2]) / 255]; }
function rgba(c, al = 1) { c = hx(c); return `rgba(${Math.round(clamp(c[0], 0, 255))},${Math.round(clamp(c[1], 0, 255))},${Math.round(clamp(c[2], 0, 255))},${al})`; }
function ramp(stops, t) {
  if (t <= stops[0][0]) return hx(stops[0][1]);
  for (let i = 1; i < stops.length; i++) if (t <= stops[i][0]) { const a = stops[i - 1], b = stops[i]; return mix(a[1], b[1], (t - a[0]) / (b[0] - a[0])); }
  return hx(stops[stops.length - 1][1]);
}
function mk(w = W, h = H) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c.getContext('2d'); }
function luma(r, g, b) { return (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255; }

// Soft bloom: bright parts bleed light, like a lens.
function bloom(ctx, { thr = 0.72, str = 0.5, rad = 60, scale = 0.25, tint = [255, 244, 228] } = {}) {
  const w = Math.round(W * scale), h = Math.round(H * scale);
  const s = mk(w, h); s.imageSmoothingQuality = 'high'; s.drawImage(ctx.canvas, 0, 0, w, h);
  const id = s.getImageData(0, 0, w, h), d = id.data;
  for (let i = 0; i < d.length; i += 4) {
    const l = luma(d[i], d[i + 1], d[i + 2]); const k = clamp((l - thr) / (1 - thr)); const m = k * k;
    d[i] = d[i] * m * tint[0] / 255; d[i + 1] = d[i + 1] * m * tint[1] / 255; d[i + 2] = d[i + 2] * m * tint[2] / 255; d[i + 3] = 255;
  }
  s.putImageData(id, 0, 0);
  const b = mk(w, h); b.filter = `blur(${rad * scale}px)`; b.drawImage(s.canvas, 0, 0);
  ctx.save(); ctx.globalCompositeOperation = 'screen'; ctx.globalAlpha = str; ctx.imageSmoothingQuality = 'high'; ctx.drawImage(b.canvas, 0, 0, W, H); ctx.restore();
}

// Final pass: gentle tone curve, vignette and luminance film grain (midtone weighted).
function finish(ctx, { grain = 0.03, vig = 0.2, seed = 99, lift = 0.012, contrast = 0.0, sat = 1.0, cx = 0.5, cy = 0.5 } = {}) {
  const id = ctx.getImageData(0, 0, W, H), d = id.data;
  const gw = (W >> 1) + 1, gh = (H >> 1) + 1, g2 = new Float32Array(gw * gh); const r = mulberry32(seed);
  for (let i = 0; i < g2.length; i++) g2[i] = (r() + r() + r() - 1.5) * 1.6;
  const ccx = W * cx, ccy = H * cy;
  let hs = seed * 2654435761 >>> 0;
  for (let y = 0; y < H; y++) {
    const dy = (y - ccy) / (H * 0.5);
    for (let x = 0; x < W; x++) {
      const i = (y * W + x) * 4;
      let rr = d[i] / 255, gg = d[i + 1] / 255, bb = d[i + 2] / 255;
      if (contrast) { rr = rr + contrast * rr * (1 - rr) * (rr - 0.5) * 4; gg = gg + contrast * gg * (1 - gg) * (gg - 0.5) * 4; bb = bb + contrast * bb * (1 - bb) * (bb - 0.5) * 4; }
      if (sat !== 1) { const l = 0.2126 * rr + 0.7152 * gg + 0.0722 * bb; rr = l + (rr - l) * sat; gg = l + (gg - l) * sat; bb = l + (bb - l) * sat; }
      const dx = (x - ccx) / (W * 0.5); const rad = Math.sqrt(dx * dx * 0.85 + dy * dy * 1.0);
      const v = 1 - vig * sstep(0.35, 1.35, rad);
      rr *= v; gg *= v; bb *= v;
      rr = lift + rr * (1 - lift); gg = lift + gg * (1 - lift); bb = lift + bb * (1 - lift);
      hs = (Math.imul(hs ^ (hs >>> 15), 2246822519) + 0x9E3779B9) >>> 0; const f1 = (hs & 0xffff) / 65535; const f2 = (hs >>> 16) / 65535;
      const fine = (f1 + f2 - 1) * 1.7;
      const coarse = g2[(y >> 1) * gw + (x >> 1)];
      const l = 0.2126 * rr + 0.7152 * gg + 0.0722 * bb;
      const wgt = 0.45 + 2.2 * l * (1 - l);
      const n = (fine * 0.55 + coarse * 0.7) * grain * wgt;
      d[i] = clamp(rr + n) * 255; d[i + 1] = clamp(gg + n) * 255; d[i + 2] = clamp(bb + n) * 255;
    }
  }
  ctx.putImageData(id, 0, 0);
}

// Light wrap: bright background bleeds softly over the edges of a dark silhouette layer (photographic, not an outline).
function lightWrap(layer, bg, { rad = 3, str = 0.55, x0 = 0, y0 = 0, w = W, h = H } = {}) {
  const id = layer.getImageData(x0, y0, w, h), d = id.data;
  const bl = mk(w, h); bl.filter = `blur(${rad}px)`; bl.drawImage(layer.canvas, x0, y0, w, h, 0, 0, w, h);
  const bd = bl.getImageData(0, 0, w, h).data;
  const bb = mk(w, h); bb.filter = `blur(${rad * 1.5}px)`; bb.drawImage(bg.canvas, x0, y0, w, h, 0, 0, w, h);
  const gd = bb.getImageData(0, 0, w, h).data;
  for (let i = 0; i < d.length; i += 4) {
    if (!d[i + 3]) continue;
    const k = str * clamp((1 - bd[i + 3] / 255) * 2.0);
    d[i] += (gd[i] - d[i]) * k; d[i + 1] += (gd[i + 1] - d[i + 1]) * k; d[i + 2] += (gd[i + 2] - d[i + 2]) * k;
  }
  layer.putImageData(id, x0, y0);
}

// Filled chain of overlapping discs along a polyline: [[x, y, width], ...] in screen px. Gives soft round joints.
function limb(c, pts) {
  for (let i = 0; i < pts.length - 1; i++) {
    const a = pts[i], b = pts[i + 1];
    const n = Math.ceil(Math.hypot(b[0] - a[0], b[1] - a[1]) / Math.max(0.4, Math.min(a[2], b[2]) * 0.15)) + 1;
    for (let k = 0; k <= n; k++) {
      const t = k / n; const x = lerp(a[0], b[0], t), y = lerp(a[1], b[1], t), r = lerp(a[2], b[2], t) / 2;
      c.moveTo(x + r, y); c.arc(x, y, r, 0, Math.PI * 2);
    }
  }
}

// ---------------------------------------------------------------------------
// road-dusk — a long rural road running straight to the horizon after sunset. An adult and a
// small child, hand in hand, walk away from camera carrying a bag and a backpack. Power poles
// on the right; a wide sky fades from deep blue to a warm afterglow (calm area upper-left).
(async function main() {
  const ctx = document.getElementById('c').getContext('2d');
  setSeed(5150);
  const NA = makeNoise(11), NB = makeNoise(23), NC = makeNoise(37), ND = makeNoise(41), NE = makeNoise(59);

  // ---------- camera ----------
  const YH = 992, VX = 1200, FL = 2800, HC = 1.6;
  const SUN = { x: 0.578 * W, y: YH + 34 };

  // ---------- sky ----------
  const SKY = [[0, '#25324d'], [0.22, '#344262'], [0.45, '#525b7c'], [0.62, '#77738d'], [0.75, '#9c8392'], [0.85, '#be9590'], [0.93, '#d9a98b'], [1.0, '#e9bd8d']];
  const skyRow = []; for (let y = 0; y < H; y++) skyRow.push(ramp(SKY, clamp(y / YH)));
  const GLOW = [255, 228, 184];
  function glowAt(x, y) {
    const dx = (x - SUN.x) / H, dy = (y - SUN.y) / H; const d2 = dx * dx * 0.32 + dy * dy * 2.4;
    return clamp(0.8 * Math.exp(-d2 / 0.0011) + 0.38 * Math.exp(-d2 / 0.007) + 0.22 * Math.exp(-d2 / 0.04) + 0.1 * Math.exp(-d2 / 0.25));
  }
  function skyBase(x, y) {
    const c = skyRow[clamp(Math.round(y), 0, H - 1)]; const g = glowAt(x, y);
    return [255 - (255 - c[0]) * (1 - g * GLOW[0] / 255), 255 - (255 - c[1]) * (1 - g * GLOW[1] / 255), 255 - (255 - c[2]) * (1 - g * GLOW[2] / 255)];
  }
  // thin stratus streaks near the horizon, lit from below by the set sun
  function cloud(x, y) {
    let dens = 0;
    const bands = [[0.775, 22, 0.55, 0.0021], [0.845, 13, 0.6, -0.0015], [0.905, 8, 0.45, 0.0008]];
    for (const [yc, th, a, tilt] of bands) {
      const c = yc * YH + (x - W / 2) * tilt + 10 * NB.n2(x / 900, yc * 9);
      const env = Math.exp(-Math.pow((y - c) / th, 2));
      const n = NB.fbm(x / 520 + yc * 13, (y - c) / (th * 1.6) + yc * 7, 4) + 0.35 * NC.n2(x / 140, y / 9);
      dens = Math.max(dens, clamp((n + 0.05) * 1.8) * env * a);
    }
    // keep the upper-left calm and fade the streaks away from the glow
    return dens * (0.35 + 0.65 * clamp(1 - Math.abs(x - SUN.x) / (0.62 * W)));
  }
  function sky(x, y) {
    let c = skyBase(x, y);
    const d = cloud(x, y);
    if (d > 0.001) {
      const g = glowAt(x, y + 30);
      const under = mix(mix('#8d7c8f', '#e7a888', clamp(g * 1.6)), [255, 214, 170], clamp(g * 0.8));
      c = mix(c, under, d);
    }
    return c;
  }

  // distant hills hugging the horizon
  const hill = new Float32Array(W + 2);
  for (let x = 0; x <= W + 1; x++) {
    const t = x / W;
    const env = 0.95 * sstep(0.47, 0.30, t) + 0.75 * sstep(0.62, 0.80, t);
    hill[x] = YH - env * (16 + 22 * NA.fbm(t * 6.5, 2.7, 4) + 10 * NA.ridged(t * 14, 1.1, 3));
  }

  // ---------- ground ----------
  const hz = []; for (let x = 0; x <= W + 1; x++) hz[x] = skyBase(Math.min(x, W - 1), YH - 3);
  const haze = Z => 1 - Math.exp(-Z / 1300);
  const ASPH = hx('#2f2e2e'), PATCH = hx('#262526'), GRAVEL = hx('#5a5249');
  const FIELD1 = hx('#3a372b'), FIELD2 = hx('#574c35'), FIELD3 = hx('#433f2f');

  const img = ctx.createImageData(W, H); const D = img.data;
  for (let y = 0; y < H; y++) {
    if (y <= YH) {
      for (let x = 0; x < W; x++) {
        let c = sky(x, y);
        const hc = clamp(y - hill[x]);
        if (hc > 0) {
          const k = (y - hill[x]) / Math.max(1, YH - hill[x]);
          const hcol = mix(mix(hz[x], '#5d5c72', 0.42), hz[x], 0.25 + 0.55 * k * k);
          c = mix(c, hcol, hc);
        }
        const i = (y * W + x) * 4; D[i] = c[0]; D[i + 1] = c[1]; D[i + 2] = c[2]; D[i + 3] = 255;
      }
      if ((y & 127) === 0) await tick();
      continue;
    }
    const dyp = y - YH;
    const Z = FL * HC / dyp; const fp = Z / FL; const hzk = haze(Z);
    const cosI = dyp / Math.hypot(dyp, FL);
    const fres = 0.03 + 0.97 * Math.pow(1 - cosI, 5);
    for (let x = 0; x < W; x++) {
      const X = (x - VX) * Z / FL;
      const ax = Math.abs(X);
      // road edges crumble a little
      const rw = 1.9 + 0.07 * NA.n2(Z / 2.6, 1.3) + 0.04 * NA.n2(Z / 0.6, X > 0 ? 5.1 : 8.4);
      const sw = rw + 0.55 + 0.18 * NB.n2(Z / 3.1, X > 0 ? 2.2 : 6.6);
      const covRoad = clamp((rw - ax) / fp + 0.5), covShoulder = clamp((sw - ax) / fp + 0.5);
      // field
      const pt = clamp(0.5 + 0.9 * NB.fbm(X / 22, Z / 40, 3));
      let f = mix(mix(FIELD1, FIELD2, pt), FIELD3, clamp(0.5 + NC.fbm(X / 6, Z / 9, 3)) * 0.5);
      const det = clamp(0.03 / fp);
      const streak = NC.n2(x / 2.4, y / 15) * 0.6 + NC.n2(x / 6, y / 30) * 0.4;
      const tex = 1 + 0.16 * streak * det + 0.08 * ND.n2(X / 0.9, Z / 1.6) * clamp(0.1 / fp);
      const gl = glowAt(x, YH - 2);
      let r = f[0] * tex * 0.78, g = f[1] * tex * 0.78, b = f[2] * tex * 0.78;
      // grass tips catch the afterglow (stronger toward the bright horizon)
      const tip = clamp(streak * 1.4) * det * (0.12 + 0.5 * gl);
      r += 70 * tip; g += 50 * tip; b += 30 * tip;
      // gravel shoulder
      if (covShoulder > 0) {
        const gv = 1 + 0.18 * ND.n2(X / 0.12, Z / 0.2) * clamp(0.01 / fp) + 0.1 * NA.n2(X / 0.8, Z / 1.5);
        const sh = scl(GRAVEL, gv * 0.82);
        r += (sh[0] - r) * covShoulder; g += (sh[1] - g) * covShoulder; b += (sh[2] - b) * covShoulder;
      }
      // asphalt with tar patches, worn wheel tracks and a sky sheen at grazing angles
      if (covRoad > 0) {
        const pat = clamp((NB.fbm(X / 1.4, Z / 5, 3) - 0.28) / 0.05);
        const track = Math.exp(-Math.pow((ax - 0.95) / 0.32, 2));
        let a = mix(ASPH, PATCH, pat * 0.8);
        const grit = 1 + 0.1 * ND.n2(X / 0.05, Z / 0.09) * clamp(0.004 / fp) + 0.05 * NA.n2(X / 0.5, Z / 2);
        a = scl(a, grit * (1 + 0.08 * track));
        const my = YH - dyp * 0.75 - 4;
        const sk = skyBase(x, my);
        const rf = clamp(fres * (0.55 + 0.25 * track - 0.25 * pat));
        const rr2 = a[0] + (sk[0] - a[0]) * rf, gg2 = a[1] + (sk[1] - a[1]) * rf, bb2 = a[2] + (sk[2] - a[2]) * rf;
        r += (rr2 - r) * covRoad; g += (gg2 - g) * covRoad; b += (bb2 - b) * covRoad;
      }
      // aerial perspective
      const hc = hz[x];
      r += (hc[0] - r) * hzk; g += (hc[1] - g) * hzk; b += (hc[2] - b) * hzk;
      const i = (y * W + x) * 4; D[i] = r; D[i + 1] = g; D[i + 2] = b; D[i + 3] = 255;
    }
    if ((y & 63) === 0) await tick();
  }
  ctx.putImageData(img, 0, 0);
  await tick();

  const proj = (X, Y, Z) => [VX + FL * X / Z, YH + FL * (HC - Y) / Z];

  // ---------- trees on the plain ----------
  function drawTree(X, Z, h, kind) {
    const s = FL / Z; const [x, yb] = proj(X, 0, Z); const hp = h * s;
    const hk = haze(Z);
    const base = mix('#221f22', hz[clamp(Math.round(x), 0, W)], hk * 0.98);
    ctx.fillStyle = rgba(base);
    if (hp < 3) { ctx.beginPath(); ctx.ellipse(x, yb - hp * 0.45, Math.max(0.7, hp * 0.5), Math.max(0.6, hp * 0.45), 0, 0, Math.PI * 2); ctx.fill(); return; }
    ctx.beginPath();
    if (kind === 0) { // umbrella crown
      const cw = hp * rnd(0.9, 1.25), ch = hp * 0.32, cy = yb - hp + ch * 0.6;
      ctx.moveTo(x - hp * 0.03, yb); ctx.lineTo(x - hp * 0.025, cy); ctx.lineTo(x + hp * 0.025, cy); ctx.lineTo(x + hp * 0.03, yb);
      const n = 7 + Math.floor(hp / 6);
      for (let i = 0; i < n; i++) { const t = (i / (n - 1)) * 2 - 1; const bx = x + t * cw * 0.5, by = cy - ch * 0.25 * (1 - t * t) + rnd(-0.1, 0.1) * ch; const rr = ch * rnd(0.45, 0.7) * (1 - 0.3 * Math.abs(t)); ctx.moveTo(bx + rr, by); ctx.ellipse(bx, by, rr * 1.4, rr, 0, 0, Math.PI * 2); }
    } else { // rounded crown
      const cw = hp * rnd(0.55, 0.75), ch = hp * 0.7, cy = yb - hp + ch * 0.5;
      ctx.moveTo(x - hp * 0.03, yb); ctx.lineTo(x - hp * 0.03, cy); ctx.lineTo(x + hp * 0.03, cy); ctx.lineTo(x + hp * 0.03, yb);
      const n = 6 + Math.floor(hp / 5);
      for (let i = 0; i < n; i++) { const a = rnd(0, Math.PI * 2), rr0 = Math.sqrt(R()) * 0.75; const bx = x + Math.cos(a) * cw * 0.5 * rr0, by = cy + Math.sin(a) * ch * 0.45 * rr0; const rr = (cw + ch) * 0.2 * rnd(0.55, 0.85); ctx.moveTo(bx + rr, by); ctx.arc(bx, by, rr, 0, Math.PI * 2); }
    }
    ctx.fill();
  }
  setSeed(777);
  const trees = [];
  for (let i = 0; i < 70; i++) { const Z = Math.exp(rnd(Math.log(500), Math.log(5000))); const X = rnd(-1, 1) * Z * 0.62; if (Math.abs(X) < 25 + Z * 0.02) continue; if (Math.abs((VX + FL * X / Z) - SUN.x) < 60) continue; trees.push([X, Z, rnd(5, 11), R() < 0.6 ? 0 : 1]); }
  trees.push([-46, 150, 8.5, 0], [-58, 175, 6.5, 1], [-31, 240, 7, 0], [62, 330, 7.5, 0], [-110, 420, 9, 1]);
  trees.sort((a, b) => b[1] - a[1]);
  for (const t of trees) drawTree(...t);
  await tick();

  // ---------- power poles and wires (right side of the road) ----------
  const POLE_X = 4.3, SPAN = 56, PH = 9.0, ARM = 8.55;
  const poleZ = []; for (let Z = 24; Z < 3200; Z += SPAN) poleZ.push(Z);
  const wireOffs = [[-1.0, ARM + 0.12], [1.0, ARM + 0.12], [0, PH + 0.08]];
  const wireCol = (Z) => mix('#1d1b1f', hz[Math.round(clamp(VX + FL * POLE_X / Z, 0, W))], haze(Z) * 0.95);
  // wires first (behind poles is fine at this scale), drawn as short segments with depth-scaled width
  for (const [ox, hy] of wireOffs) {
    for (let k = -1; k < poleZ.length - 1; k++) {
      const z0 = k < 0 ? -32 : poleZ[k], z1 = poleZ[k + 1];
      const N = 90;
      let prev = null;
      for (let j = 0; j <= N; j++) {
        const t = j / N; const Z = lerp(z0, z1, t); if (Z < 1.2) { prev = null; continue; }
        const sag = 1.25 * 4 * t * (1 - t);
        const p = proj(POLE_X + ox, hy - sag, Z);
        if (prev) {
          const lw = clamp(0.022 * FL / Z, 0.5, 3.2);
          ctx.strokeStyle = rgba(wireCol(Z), lw < 1 ? 0.55 + 0.45 * lw : 0.95); ctx.lineWidth = Math.max(0.8, lw);
          ctx.beginPath(); ctx.moveTo(prev[0], prev[1]); ctx.lineTo(p[0], p[1]); ctx.stroke();
        }
        prev = p;
      }
    }
  }
  for (let k = poleZ.length - 1; k >= 0; k--) {
    const Z = poleZ[k]; const s = FL / Z;
    const [x0, yb] = proj(POLE_X, 0, Z); const [, yt] = proj(POLE_X, PH, Z);
    const col = wireCol(Z); ctx.fillStyle = rgba(col);
    const wb = Math.max(0.9, 0.26 * s), wt = Math.max(0.8, 0.19 * s);
    ctx.beginPath(); ctx.moveTo(x0 - wb / 2, yb + 0.05 * s); ctx.lineTo(x0 - wt / 2, yt); ctx.lineTo(x0 + wt / 2, yt); ctx.lineTo(x0 + wb / 2, yb + 0.05 * s); ctx.closePath(); ctx.fill();
    const [, ya] = proj(POLE_X, ARM, Z); const ah = Math.max(0.8, 0.13 * s);
    ctx.fillRect(x0 - 1.2 * s, ya - ah / 2, 2.4 * s, ah);
    // braces and insulators
    if (s > 6) {
      ctx.strokeStyle = rgba(col); ctx.lineWidth = Math.max(0.6, 0.05 * s);
      ctx.beginPath(); ctx.moveTo(x0 - 0.7 * s, ya); ctx.lineTo(x0, ya + 0.55 * s); ctx.lineTo(x0 + 0.7 * s, ya); ctx.stroke();
      for (const ox of [-1.0, 1.0]) { ctx.beginPath(); ctx.ellipse(x0 + ox * s, ya - 0.1 * s, 0.06 * s, 0.11 * s, 0, 0, Math.PI * 2); ctx.fill(); }
      ctx.beginPath(); ctx.ellipse(x0, yt - 0.06 * s, 0.06 * s, 0.1 * s, 0, 0, Math.PI * 2); ctx.fill();
    }
  }
  await tick();

  // ---------- the walkers (silhouettes, seen from behind) ----------
  const ZF = 21.5;
  const SPX = FL / ZF; // px per metre
  const ax0 = VX + FL * (-0.42) / ZF, gy0 = YH + FL * HC / ZF;
  const fig = mk();
  fig.fillStyle = '#17151a';
  { // adult: knee-length coat, holdall in the left hand, right hand holding the child's hand
    const hh = 1.72 / 7.5 * SPX; // head-height unit in px
    const P = (u, v) => [ax0 + u * hh, gy0 - v * hh];
    const c = fig; c.beginPath();
    const mv = (u, v) => { const p = P(u, v); c.moveTo(p[0], p[1]); };
    const bz = (a, b, d) => { const p1 = P(...a), p2 = P(...b), p3 = P(...d); c.bezierCurveTo(p1[0], p1[1], p2[0], p2[1], p3[0], p3[1]); };
    const ln = (u, v) => { const p = P(u, v); c.lineTo(p[0], p[1]); };
    // coat / torso
    mv(-0.22, 6.32);
    bz([-0.45, 6.24], [-0.78, 6.12], [-0.9, 5.9]);
    bz([-0.99, 5.7], [-0.9, 5.25], [-0.86, 5.0]);
    bz([-0.82, 4.72], [-0.79, 4.5], [-0.82, 4.2]);
    bz([-0.9, 3.6], [-0.98, 2.8], [-1.01, 2.22]);
    ln(-0.55, 2.16); ln(0.0, 2.22); ln(0.55, 2.27); ln(1.0, 2.3);
    bz([0.97, 2.8], [0.9, 3.6], [0.82, 4.2]);
    bz([0.79, 4.5], [0.82, 4.72], [0.86, 5.0]);
    bz([0.9, 5.25], [0.99, 5.7], [0.9, 5.9]);
    bz([0.78, 6.12], [0.45, 6.24], [0.22, 6.32]);
    c.closePath();
    // neck, head, hair gathered at the nape
    { const p = P(-0.2, 6.62); c.rect(p[0], p[1], 0.4 * hh, 0.36 * hh); }
    { const p = P(0, 6.98); c.moveTo(p[0] + 0.41 * hh, p[1]); c.ellipse(p[0], p[1], 0.41 * hh, 0.52 * hh, 0, 0, Math.PI * 2); }
    { const p = P(0.02, 6.55); c.moveTo(p[0] + 0.24 * hh, p[1]); c.ellipse(p[0], p[1], 0.24 * hh, 0.2 * hh, 0, 0, Math.PI * 2); }
    // arms (sleeves taper to the wrist)
    const L = pts => pts.map(([u, v, w]) => { const p = P(u, v); return [p[0], p[1], w * hh]; });
    limb(c, L([[-0.8, 5.78, 0.44], [-0.97, 4.62, 0.37], [-1.05, 3.66, 0.27]]));
    limb(c, L([[0.8, 5.78, 0.44], [1.09, 4.62, 0.37], [1.38, 3.66, 0.27]]));
    { const p = P(-1.06, 3.44); c.moveTo(p[0] + 0.15 * hh, p[1]); c.ellipse(p[0], p[1], 0.15 * hh, 0.22 * hh, 0.05, 0, Math.PI * 2); }
    { const p = P(1.46, 3.47); c.moveTo(p[0] + 0.16 * hh, p[1]); c.ellipse(p[0], p[1], 0.16 * hh, 0.2 * hh, -0.4, 0, Math.PI * 2); }
    // legs: left planted, right trailing with the heel lifted
    limb(c, L([[-0.33, 2.3, 0.5], [-0.31, 1.6, 0.44], [-0.29, 0.9, 0.33], [-0.28, 0.36, 0.23]]));
    { const p = P(-0.28, 0.16); c.moveTo(p[0] + 0.19 * hh, p[1]); c.ellipse(p[0], p[1], 0.19 * hh, 0.17 * hh, 0, 0, Math.PI * 2); }
    limb(c, L([[0.33, 2.3, 0.5], [0.33, 1.65, 0.43], [0.35, 1.08, 0.34], [0.36, 0.64, 0.23]]));
    { const p = P(0.36, 0.32); c.moveTo(p[0] + 0.16 * hh, p[1]); c.ellipse(p[0], p[1], 0.16 * hh, 0.3 * hh, 0.04, 0, Math.PI * 2); }
    c.fill();
    // holdall hanging from the left hand
    c.beginPath();
    c.lineWidth = 0.08 * hh; c.strokeStyle = '#17151a';
    { const a = P(-1.06, 3.36), b = P(-1.42, 2.86), d = P(-0.72, 2.86), m = P(-1.06, 3.0);
      c.moveTo(b[0], b[1]); c.quadraticCurveTo(m[0] - 0.15 * hh, a[1] - 0.05 * hh, a[0], a[1]); c.quadraticCurveTo(m[0] + 0.15 * hh, a[1] - 0.05 * hh, d[0], d[1]); c.stroke(); }
    c.beginPath();
    { const tl = P(-1.66, 2.92), br = P(-0.46, 1.5); const rr = 0.3 * hh;
      const x1 = tl[0], y1 = tl[1], x2 = br[0], y2 = br[1];
      c.moveTo(x1 + rr, y1); c.quadraticCurveTo((x1 + x2) / 2, y1 - 0.12 * hh, x2 - rr, y1); c.quadraticCurveTo(x2, y1, x2 + 0.02 * hh, y1 + rr);
      c.lineTo(x2 + 0.06 * hh, y2 - rr); c.quadraticCurveTo(x2 + 0.06 * hh, y2, x2 - rr, y2); c.lineTo(x1 + rr, y2); c.quadraticCurveTo(x1 - 0.06 * hh, y2, x1 - 0.06 * hh, y2 - rr);
      c.lineTo(x1, y1 + rr); c.quadraticCurveTo(x1, y1, x1 + rr, y1); }
    c.fill();
  }
  { // child (about 1 m tall, head ≈ 1/5 of height), small backpack, left hand held up to the adult's hand
    const ch = 1.0 / 5 * SPX;
    const cx0 = ax0 + 0.8 * SPX;
    const P = (u, v) => [cx0 + u * ch, gy0 - 0.05 * SPX * 0 - v * ch];
    const c = fig; c.beginPath();
    const mv = (u, v) => { const p = P(u, v); c.moveTo(p[0], p[1]); };
    const bz = (a, b, d) => { const p1 = P(...a), p2 = P(...b), p3 = P(...d); c.bezierCurveTo(p1[0], p1[1], p2[0], p2[1], p3[0], p3[1]); };
    const ln = (u, v) => { const p = P(u, v); c.lineTo(p[0], p[1]); };
    const L = pts => pts.map(([u, v, w]) => { const p = P(u, v); return [p[0], p[1], w * ch]; });
    // jacket / torso
    mv(-0.18, 3.98);
    bz([-0.36, 3.95], [-0.56, 3.88], [-0.63, 3.72]);
    bz([-0.7, 3.5], [-0.62, 3.2], [-0.6, 2.95]);
    bz([-0.6, 2.75], [-0.64, 2.55], [-0.62, 2.35]);
    ln(0.62, 2.38);
    bz([0.64, 2.55], [0.6, 2.75], [0.6, 2.95]);
    bz([0.62, 3.2], [0.7, 3.5], [0.63, 3.72]);
    bz([0.56, 3.88], [0.36, 3.95], [0.18, 3.98]);
    c.closePath();
    { const p = P(-0.17, 4.18); c.rect(p[0], p[1], 0.34 * ch, 0.26 * ch); }
    { const p = P(0, 4.5); c.moveTo(p[0] + 0.43 * ch, p[1]); c.ellipse(p[0], p[1], 0.43 * ch, 0.5 * ch, 0, 0, Math.PI * 2); }
    // backpack
    { const tl = P(-0.55, 3.86), br = P(0.55, 2.72); const rr = 0.22 * ch; c.moveTo(tl[0] + rr, tl[1]); c.arcTo(br[0], tl[1], br[0], br[1], rr); c.arcTo(br[0], br[1], tl[0], br[1], rr); c.arcTo(tl[0], br[1], tl[0], tl[1], rr); c.arcTo(tl[0], tl[1], br[0], tl[1], rr); c.closePath(); }
    // arms
    limb(c, L([[-0.6, 3.66, 0.36], [-1.32, 3.5, 0.3], [-2.05, 3.82, 0.25]]));
    { const p = P(-2.18, 3.86); c.moveTo(p[0] + 0.16 * ch, p[1]); c.ellipse(p[0], p[1], 0.16 * ch, 0.19 * ch, 0.6, 0, Math.PI * 2); }
    limb(c, L([[0.6, 3.66, 0.36], [0.74, 3.0, 0.3], [0.79, 2.42, 0.25]]));
    { const p = P(0.8, 2.25); c.moveTo(p[0] + 0.14 * ch, p[1]); c.ellipse(p[0], p[1], 0.14 * ch, 0.19 * ch, 0, 0, Math.PI * 2); }
    // legs: right planted, left trailing
    limb(c, L([[0.27, 2.4, 0.46], [0.26, 1.45, 0.38], [0.25, 0.4, 0.28]]));
    { const p = P(0.25, 0.17); c.moveTo(p[0] + 0.2 * ch, p[1]); c.ellipse(p[0], p[1], 0.2 * ch, 0.18 * ch, 0, 0, Math.PI * 2); }
    limb(c, L([[-0.27, 2.4, 0.46], [-0.28, 1.55, 0.38], [-0.3, 0.75, 0.28]]));
    { const p = P(-0.3, 0.48); c.moveTo(p[0] + 0.18 * ch, p[1]); c.ellipse(p[0], p[1], 0.18 * ch, 0.32 * ch, 0, 0, Math.PI * 2); }
    c.fill();
  }
  // contact shadows
  const shd = mk();
  shd.fillStyle = 'rgba(12,10,14,0.55)';
  for (const [x, w] of [[ax0 - 0.07 * SPX, 0.5 * SPX], [ax0 + 0.8 * SPX, 0.32 * SPX]]) { shd.beginPath(); shd.ellipse(x, gy0 + 2, w, 0.035 * SPX, 0, 0, Math.PI * 2); shd.fill(); }
  ctx.save(); ctx.filter = 'blur(3px)'; ctx.drawImage(shd.canvas, 0, 0); ctx.restore();
  // light wrap from the bright horizon and road sheen, then a touch of softness
  const bgCopy = mk(); bgCopy.drawImage(ctx.canvas, 0, 0);
  lightWrap(fig, bgCopy, { rad: 2.5, str: 0.6, x0: Math.round(ax0 - 200), y0: Math.round(gy0 - 360), w: 520, h: 420 });
  ctx.save(); ctx.filter = 'blur(0.7px)'; ctx.drawImage(fig.canvas, 0, 0); ctx.restore();
  await tick();

  // ---------- foreground grass (out of focus) ----------
  const fg = mk(); setSeed(4040);
  for (let i = 0; i < 900; i++) {
    const side = R() < 0.5 ? -1 : 1;
    const xb = side < 0 ? rnd(-40, 560) : rnd(1880, 2440);
    const edgeT = side < 0 ? clamp(1 - xb / 560) : clamp((xb - 1880) / 560);
    const yb = H + 10 + rnd(0, 30);
    const h = rnd(40, 190) * (0.4 + 0.8 * edgeT);
    const lean = rnd(-0.35, 0.35) + side * 0.12;
    const w = rnd(3, 7);
    const col = mix('#1a1915', '#3a3426', R() * 0.6);
    fg.fillStyle = rgba(col, 0.95);
    fg.beginPath(); fg.moveTo(xb - w / 2, yb); fg.quadraticCurveTo(xb + lean * h * 0.4, yb - h * 0.6, xb + lean * h, yb - h); fg.quadraticCurveTo(xb + lean * h * 0.4 + w * 0.3, yb - h * 0.6, xb + w / 2, yb); fg.fill();
  }
  ctx.save(); ctx.filter = 'blur(3.5px)'; ctx.drawImage(fg.canvas, 0, 0); ctx.restore();
  await tick();

  // ---------- light: afterglow veil and bloom ----------
  const veil = ctx.createRadialGradient(SUN.x, SUN.y, 0, SUN.x, SUN.y, 0.6 * W);
  veil.addColorStop(0, 'rgba(255,214,160,0.20)'); veil.addColorStop(0.3, 'rgba(255,205,150,0.06)'); veil.addColorStop(1, 'rgba(255,200,150,0)');
  ctx.save(); ctx.globalCompositeOperation = 'screen'; ctx.fillStyle = veil; ctx.fillRect(0, 0, W, H); ctx.restore();
  bloom(ctx, { thr: 0.7, str: 0.42, rad: 90, tint: [255, 236, 210] });
  await tick();
  finish(ctx, { grain: 0.028, vig: 0.26, seed: 5150, lift: 0.016, contrast: 0.06, sat: 0.92, cy: 0.55 });
  window.__done = true;
})();
</script>
