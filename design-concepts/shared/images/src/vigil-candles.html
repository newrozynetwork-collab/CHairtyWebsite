</head><body><canvas id="c" width="2400" height="1600"></canvas>
<script>
/* vigil-candles — original illustration created for this proposal (documentary-illustration series).
   Self-contained and deterministic: all randomness comes from a seeded PRNG. */
"use strict";
// ---------------------------------------------------------------- kit
const W = 2400, H = 1600;
const cvs = document.getElementById('c');
const ctx = cvs.getContext('2d', { willReadFrequently: true });

// seeded PRNG (mulberry32)
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function makeRand(seed) {
  const r = mulberry32(seed);
  const f = () => r();
  f.range = (a, b) => a + (b - a) * r();
  f.int = (a, b) => Math.floor(a + (b - a + 1) * r());
  f.gauss = () => { let u = 0; while (u === 0) u = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * r()); };
  f.pick = arr => arr[Math.floor(r() * arr.length)];
  return f;
}
// 2D value noise in [0,1] and fBm
function makeNoise(seed) {
  const r = mulberry32(seed), P = new Uint16Array(512), G = new Float32Array(256);
  for (let i = 0; i < 256; i++) { P[i] = i; G[i] = r(); }
  for (let i = 255; i > 0; i--) { const j = Math.floor(r() * (i + 1)); const t = P[i]; P[i] = P[j]; P[j] = t; }
  for (let i = 0; i < 256; i++) P[i + 256] = P[i];
  return function (x, y) {
    const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
    const X = xi & 255, Y = yi & 255;
    const a = G[P[P[X] + Y]], b = G[P[P[X + 1] + Y]], c = G[P[P[X] + Y + 1]], d = G[P[P[X + 1] + Y + 1]];
    const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  };
}
function fbm(n, x, y, oct = 5, lac = 2.0, gain = 0.5) {
  let s = 0, a = 0.5, f = 1, norm = 0;
  for (let i = 0; i < oct; i++) { s += a * n(x * f + i * 17.3, y * f - i * 9.1); norm += a; a *= gain; f *= lac; }
  return s / norm;
}
const clamp = (v, a = 0, b = 1) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const hexRGB = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const rgba = (c, a = 1) => `rgba(${Math.round(c[0])},${Math.round(c[1])},${Math.round(c[2])},${a})`;
const mixc = (c1, c2, t) => [lerp(c1[0], c2[0], t), lerp(c1[1], c2[1], t), lerp(c1[2], c2[2], t)];
// vectors
const v3 = {
  add: (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]],
  sub: (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]],
  mul: (a, s) => [a[0] * s, a[1] * s, a[2] * s],
  dot: (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2],
  cross: (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]],
  len: a => Math.hypot(a[0], a[1], a[2]),
  norm: a => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; },
  lerp: (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t],
};
// linear light -> display (soft filmic shoulder + sRGB-ish gamma)
const toneMap = (x, exposure = 1) => Math.pow(1 - Math.exp(-Math.max(0, x) * exposure), 1 / 2.2);
const toneRGB = (c, exposure = 1) => [toneMap(c[0], exposure) * 255, toneMap(c[1], exposure) * 255, toneMap(c[2], exposure) * 255];
// layers
function newLayer(w = W, h = H) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function blurCopy(src, px, scale = 1) {
  // blurred copy of a canvas; scale<1 blurs at reduced resolution (fast, for big radii)
  const sw = Math.max(1, Math.round(src.width * scale)), sh = Math.max(1, Math.round(src.height * scale));
  const a = newLayer(sw, sh), ac = a.getContext('2d');
  ac.filter = `blur(${px * scale}px)`; ac.drawImage(src, 0, 0, sw, sh); ac.filter = 'none';
  if (scale === 1) return a;
  const b = newLayer(src.width, src.height), bc = b.getContext('2d');
  bc.imageSmoothingEnabled = true; bc.imageSmoothingQuality = 'high'; bc.drawImage(a, 0, 0, src.width, src.height);
  return b;
}
function convexHull(pts) {
  const p = pts.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  const cr = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
  const lo = [], up = [];
  for (const q of p) { while (lo.length >= 2 && cr(lo[lo.length - 2], lo[lo.length - 1], q) <= 0) lo.pop(); lo.push(q); }
  for (let i = p.length - 1; i >= 0; i--) { const q = p[i]; while (up.length >= 2 && cr(up[up.length - 2], up[up.length - 1], q) <= 0) up.pop(); up.push(q); }
  up.pop(); lo.pop(); return lo.concat(up);
}
function poly(c, pts) { c.beginPath(); c.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) c.lineTo(pts[i][0], pts[i][1]); c.closePath(); }
// bloom: bright-pass at quarter res, multi-radius blur, screen back
function addBloom(target, { threshold = 0.75, knee = 0.15, radii = [8, 24, 64], weights = [0.5, 0.35, 0.25], strength = 0.5, tint = [255, 240, 220] } = {}) {
  const s = 0.25, sw = W * s, sh = H * s;
  const small = newLayer(sw, sh), sc = small.getContext('2d', { willReadFrequently: true });
  sc.drawImage(target.canvas, 0, 0, sw, sh);
  const id = sc.getImageData(0, 0, sw, sh), d = id.data;
  for (let i = 0; i < d.length; i += 4) {
    const l = (0.2126 * d[i] + 0.7152 * d[i + 1] + 0.0722 * d[i + 2]) / 255;
    const k = smooth(threshold - knee, threshold + knee, l) * (l - threshold * 0.5);
    d[i] = d[i] * k * tint[0] / 255; d[i + 1] = d[i + 1] * k * tint[1] / 255; d[i + 2] = d[i + 2] * k * tint[2] / 255;
  }
  sc.putImageData(id, 0, 0);
  target.save(); target.globalCompositeOperation = 'screen'; target.imageSmoothingQuality = 'high';
  radii.forEach((r, i) => { const b = blurCopy(small, r * s); target.globalAlpha = clamp(strength * weights[i]); target.drawImage(b, 0, 0, W, H); });
  target.restore();
}
// final pass: optional grade, vignette, two-scale luminance film grain
function finish(target, { grain = 0.03, seed = 1, vignette = 0.3, vcx = 0.5, vcy = 0.5, vr0 = 0.35, vr1 = 0.95, grade = null } = {}) {
  const id = target.getImageData(0, 0, W, H), d = id.data, r = mulberry32(seed);
  // coarse grain field (half res, bilinear) for clumpy film structure
  const cw = W / 2 + 2, ch = H / 2 + 2, coarse = new Float32Array(cw * ch);
  for (let i = 0; i < coarse.length; i++) coarse[i] = (r() + r() + r() - 1.5) * 2;
  const diag = Math.hypot(W, H) / 2;
  for (let y = 0; y < H; y++) {
    const gy = y / 2, y0 = Math.floor(gy), fy = gy - y0;
    for (let x = 0; x < W; x++) {
      const i = (y * W + x) * 4;
      let R = d[i] / 255, G = d[i + 1] / 255, B = d[i + 2] / 255;
      if (grade) { const o = grade(R, G, B, x, y); R = o[0]; G = o[1]; B = o[2]; }
      if (vignette) {
        const dx = (x - vcx * W) / (W / 2), dy = (y - vcy * H) / (H / 2);
        const dd = Math.sqrt(dx * dx * 0.8 + dy * dy * 1.0) / 1.25;
        const v = 1 - vignette * smooth(vr0, vr1, dd);
        R *= v; G *= v; B *= v;
      }
      const gx = x / 2, x0 = Math.floor(gx), fx = gx - x0, j = y0 * cw + x0;
      const c = (coarse[j] * (1 - fx) + coarse[j + 1] * fx) * (1 - fy) + (coarse[j + cw] * (1 - fx) + coarse[j + cw + 1] * fx) * fy;
      const L = 0.2126 * R + 0.7152 * G + 0.0722 * B;
      const n = ((r() + r() + r() - 1.5) * 2 * 0.65 + c * 0.75) * grain * (0.45 + 2.2 * L * (1 - L));
      d[i] = clamp(R + n) * 255; d[i + 1] = clamp(G + n) * 255; d[i + 2] = clamp(B + n) * 255;
    }
  }
  target.putImageData(id, 0, 0);
}
// piecewise-linear colour ramp: stops = [[t,[r,g,b]],...]
function ramp(stops, t) {
  if (t <= stops[0][0]) return stops[0][1].slice();
  for (let i = 1; i < stops.length; i++) if (t <= stops[i][0]) {
    const a = stops[i - 1], b = stops[i], u = (t - a[0]) / (b[0] - a[0]);
    return mixc(a[1], b[1], u);
  }
  return stops[stops.length - 1][1].slice();
}
const v2norm = a => { const l = Math.hypot(a[0], a[1]) || 1; return [a[0] / l, a[1] / l]; };
// ---------------------------------------------------------------- scene
// ===================== VIGIL CANDLES =====================
// Night. Dozens of candles in glass jars on wide stone steps, shot low with a shallow depth of field:
// focus on the second step, people standing on the landing behind as soft, warm-lit silhouettes.
const rand = makeRand(31337);
const nA = makeNoise(901), nB = makeNoise(902), nC = makeNoise(903), nD = makeNoise(904);
function hash1(n) { let h = Math.imul((n | 0) ^ 0x9e3779b9, 0x85ebca6b); h ^= h >>> 13; h = Math.imul(h, 0xc2b2ae35); h ^= h >>> 16; return (h >>> 0) / 4294967296; }

// ---------- camera, steps (metres) ----------
const F = 2400, CX = 1200, CY = 600, CAMY = 1.05;
const RISE = 0.15, RUN = 0.42, Z0 = 1.5, NR = 5;          // risers k = 0..4; landing at y = 0.75 from z = 3.18
const LAND_Y = NR * RISE, LAND_Z = Z0 + (NR - 1) * RUN;
const P = (x, y, z) => [CX + F * x / z, CY - F * (y - CAMY) / z];
const ZF = 2.56, KCOC = 100;
const coc = z => KCOC * Math.abs(1 / z - 1 / ZF);
const LCOL = [1.0, 0.58, 0.27];                              // candle light (linear)
const EXPO = 1.0;

// ---------- candles ----------
const candles = [];
function overlaps(x, z, R) { for (const c of candles) if (Math.hypot(c.x - x, c.z - z) < c.R + R + 0.012) return true; return false; }
function addCandle(x, z, yb, o = {}) {
  const t = o.type || (rand() < 0.55 ? 'tall' : rand() < 0.6 ? 'votive' : 'wide');
  let R, Hj; if (t === 'tall') { R = rand.range(0.031, 0.037); Hj = rand.range(0.11, 0.15); }
  else if (t === 'votive') { R = rand.range(0.027, 0.031); Hj = rand.range(0.06, 0.075); }
  else { R = rand.range(0.042, 0.048); Hj = rand.range(0.085, 0.10); }
  if (overlaps(x, z, R)) return null;
  const wax = Hj * rand.range(0.18, 0.62);
  const lit = o.lit !== undefined ? o.lit : rand() > 0.04;
  const c = { x, z, yb, R, Hj, wax, wy: yb + wax, fy: yb + wax + 0.019, I: lit ? 0.016 * rand.range(0.75, 1.25) : 0, lit, tint: rand() < 0.22 ? 'amber' : (rand() < 0.15 ? 'frost' : 'clear'), fl: rand.range(-0.15, 0.15), fh: rand.range(0.024, 0.032) };
  candles.push(c); return c;
}
// groups along each tread: little clusters with gaps, like candles left by many hands
function populate(k, n, xr, zr, yb, centre = 0.0) {
  let placed = 0, guard = 0;
  while (placed < n && guard++ < 4000) {
    const gx = centre + rand.gauss() * xr * 0.42;
    if (Math.abs(gx) > xr) continue;
    const gs = rand.int(1, 5);
    for (let j = 0; j < gs && placed < n; j++) {
      const x = gx + j * rand.range(0.075, 0.11) * (rand() < 0.5 ? 1 : -1) + rand.range(-0.02, 0.02);
      const z = rand.range(zr[0], zr[1]);
      if (addCandle(x, z, yb)) placed++;
    }
  }
}
populate(1, 7, 1.05, [1.98, 2.24], 2 * RISE, 0.1);
populate(2, 24, 1.30, [2.41, 2.69], 3 * RISE, 0.0);
populate(3, 19, 1.55, [2.83, 3.10], 4 * RISE, -0.05);
populate(4, 12, 1.85, [3.26, 3.70], LAND_Y, 0.0);
// a few at the feet of the people on the landing (become bokeh)
for (const [x, z] of [[-1.15, 7.2], [-0.35, 7.0], [0.55, 7.3], [1.2, 7.1], [-2.3, 8.6], [2.1, 8.4], [0.05, 9.4], [-1.7, 9.8], [1.65, 9.9]]) addCandle(x, z, LAND_Y, { type: 'votive', lit: true });
// one near, very out of focus candle at the lower left (foreground bokeh)
addCandle(-0.62, 2.02, 2 * RISE, { type: 'tall', lit: true });
candles.forEach(c => { c.sx = P(c.x, c.fy, c.z); });

// ---------- 1. stairs: per-pixel geometry, lighting, depth ----------
function hitStairs(X, Y) {
  const dx = (X + 0.5 - CX) / F, dy = -(Y + 0.5 - CY) / F;
  for (let k = 0; k < NR; k++) {
    const zr = Z0 + k * RUN, yAt = CAMY + dy * zr, yTop = (k + 1) * RISE;
    if (yAt <= yTop) return [0, k, dx * zr, yAt, zr];          // riser
    if (dy < 0) {
      const zt = (yTop - CAMY) / dy, zEnd = k === NR - 1 ? 1e9 : zr + RUN;
      if (zt <= zEnd) return [1, k, dx * zt, yTop, zt];         // tread / landing
    } else if (k === NR - 1) return null;
  }
  return null;
}
function blocked(px, py, pz, c) {
  // ray from the surface point to the flame crossing a riser plane below the step top -> occluded by the step
  const z0 = Math.min(pz, c.z), z1 = Math.max(pz, c.z);
  for (let j = 1; j < NR; j++) {
    const zj = Z0 + j * RUN;
    if (zj <= z0 + 1e-4 || zj >= z1 - 1e-4) continue;
    const t = (zj - pz) / (c.z - pz), yc = py + (c.fy - py) * t;
    if (yc < (j + 1) * RISE - 0.002) return true;
  }
  return false;
}
const AMB = [0.010, 0.012, 0.019];
const stair = ctx.createImageData(W, H), SD = stair.data;
const depth = new Float32Array(W * H).fill(1e9);
const lit = candles.filter(c => c.lit);
for (let Y = 0; Y < H; Y++) {
  for (let X = 0; X < W; X++) {
    const i = Y * W + X, h = hitStairs(X, Y);
    if (!h) continue;
    const [kind, k, x, y, z] = h;
    depth[i] = z;
    // normal (with rounded nosing) + slight bump
    let nx = 0, ny, nz, rn = 0.014, phi;
    if (kind === 0) { const dt = (k + 1) * RISE - y; phi = dt < rn ? (1 - dt / rn) * Math.PI / 4 : 0; }
    else { const dt = z - (Z0 + k * RUN); phi = dt < rn && k < NR ? Math.PI / 2 - (1 - dt / rn) * Math.PI / 4 : Math.PI / 2; }
    ny = Math.sin(phi); nz = -Math.cos(phi);
    const bx = kind ? x * 38 : x * 30, by = kind ? z * 38 : y * 30;
    const b1 = nB(bx, by) - 0.5, b2 = nB(bx + 31.7, by + 12.3) - 0.5;
    nx += 0.07 * b1; if (kind) nz += 0.07 * b2; else ny += 0.07 * b2;
    const nl = Math.hypot(nx, ny, nz); nx /= nl; ny /= nl; nz /= nl;
    // albedo: warm limestone, slabs with joints, worn treads, a few wax drips
    const slabW = 0.9 + 0.5 * hash1(k * 17 + kind * 3), off = hash1(k * 29 + kind * 7) * slabW;
    const su = (x + off) / slabW, si = Math.floor(su), sf = su - si;
    const jd = Math.min(sf, 1 - sf) * slabW, jpx = z / F;
    const joint = 1 - 0.5 * clamp(1 - (jd - 0.002) / Math.max(jpx * 1.2, 1e-4));
    const tone = 0.86 + 0.2 * hash1(si * 13 + k * 101 + kind * 7);
    const mott = 0.84 + 0.22 * fbm(nA, x * 2.2 + k * 3.1, (kind ? z : y) * 2.2, 4) + 0.07 * (nC(x * 60, (kind ? z : y) * 60) - 0.5);
    let alb = [0.40 * tone * mott, 0.365 * tone * mott, 0.325 * tone * mott];
    if (kind && k < NR - 1) {   // worn, slightly darker band along the middle of each tread
      const wv = Math.exp(-Math.pow(((z - (Z0 + k * RUN)) / RUN - 0.55) / 0.3, 2)) * 0.08 * fbm(nD, x * 0.8, k, 2);
      alb = alb.map(v => v * (1 - wv));

    alb = alb.map(v => v * joint);
    // wax drips near candles
    if (kind) for (const c of candles) {
      const d = Math.hypot(x - c.x, z - c.z);
      if (d < c.R + 0.06 && Math.abs(c.yb - y) < 0.01) {
        const w = nD((x - c.x) * 90 + c.x * 7, (z - c.z) * 90) * smooth(c.R + 0.06, c.R + 0.01, d);
        if (w > 0.42) alb = mixc(alb, [0.62, 0.57, 0.48], smooth(0.42, 0.5, w) * 0.85);
      }
    }
    // irradiance from all candles
    let E = 0;
    for (const c of lit) {
      const lx = c.x - x, ly = c.fy - y, lz = c.z - z;
      const ndl = nx * lx + ny * ly + nz * lz; if (ndl <= 0) continue;
      const d2 = lx * lx + ly * ly + lz * lz;
      let vis = 1;
      const dh = Math.sqrt(lx * lx + lz * lz);
      if (ly > 0) {
        if (dh < c.R * 1.03) vis = 0;
        else { const yExit = c.fy - ly * (c.R / dh); vis = 0.06 + 0.94 * smooth(c.wy - 0.006, c.wy + 0.004, yExit); }
      }
      if (vis > 0 && Math.abs(lz) > 0.05 && blocked(x, y, z, c)) vis = 0;
      E += c.I * ndl / (d2 * Math.sqrt(d2)) * vis;
    }
    const o = i * 4;
    for (let ch = 0; ch < 3; ch++) SD[o + ch] = toneMap(alb[ch] * (E * LCOL[ch] + AMB[ch]), EXPO) * 255;
    SD[o + 3] = 255;

// ---------- 2. background: dark plaza edge, a building, trees, distant lights (all far out of focus) ----------
const bg = newLayer(), bgc = bg.getContext('2d');
{
  const g = bgc.createLinearGradient(0, 0, 0, CY + 60);
  g.addColorStop(0, '#07090f'); g.addColorStop(0.45, '#0e1018'); g.addColorStop(0.85, '#1c1719'); g.addColorStop(1, '#2a1f1c');
  bgc.fillStyle = g; bgc.fillRect(0, 0, W, H);
  // building mass behind, slightly lighter than the sky, with a few warm windows
  bgc.fillStyle = '#121219'; bgc.fillRect(-50, 150, 1150, 520); bgc.fillRect(1500, 80, 1000, 600);
  for (let k = 0; k < 14; k++) {
    const x = rand() < 0.5 ? rand.range(40, 1050) : rand.range(1560, 2380), y = rand.range(180, 520);
    bgc.fillStyle = rgba([255, 196, 130], rand.range(0.18, 0.4)); bgc.fillRect(x, y, rand.range(40, 70), rand.range(60, 90));
  }
  // tree masses
  for (let k = 0; k < 16; k++) { bgc.fillStyle = 'rgba(6,8,10,0.8)'; bgc.beginPath(); bgc.arc(rand.range(900, 1700), rand.range(120, 420), rand.range(80, 170), 0, Math.PI * 2); bgc.fill(); }
}
const bgBlur = blurCopy(bg, 26, 0.25);
ctx.drawImage(bgBlur, 0, 0);
// distant bokeh: street lights and windows
{
  const bl = newLayer(), b2 = bl.getContext('2d'); b2.globalCompositeOperation = 'lighter';
  for (let k = 0; k < 34; k++) {
    const x = rand.range(-50, W + 50), y = rand.range(250, 640), r = rand.range(26, 54);
    const warm = rand() < 0.75, col = warm ? [255, 186, 110] : [200, 214, 236], a = rand.range(0.05, 0.17) * (y > 400 ? 1 : 0.6);
    const g = b2.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, rgba(col, a * 0.8)); g.addColorStop(0.82, rgba(col, a)); g.addColorStop(0.92, rgba(col, a * 0.7)); g.addColorStop(1, rgba(col, 0));
    b2.fillStyle = g; b2.beginPath(); b2.arc(x, y, r, 0, Math.PI * 2); b2.fill();
  }
  ctx.save(); ctx.globalCompositeOperation = 'screen'; ctx.drawImage(blurCopy(bl, 1.5), 0, 0); ctx.restore();
}

// ---------- 3. stairs with depth of field ----------
{
  const sl = newLayer(), slc = sl.getContext('2d'); slc.putImageData(stair, 0, 0);
  const levels = [0, 1.5, 3, 5, 8, 12, 17];
  const datas = levels.map(s => (s ? blurCopy(sl, s, s > 6 ? 0.5 : 1) : sl).getContext('2d').getImageData(0, 0, W, H).data);
