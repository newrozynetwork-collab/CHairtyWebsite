<script>
/* empty-chair — original illustration created for this proposal (documentary-illustration series).
   Self-contained and deterministic: all randomness comes from a seeded PRNG. */
"use strict";
// ---------------------------------------------------------------- kit
const W = 2400, H = 1600;
const cvs = document.getElementById('c');
const ctx = cvs.getContext('2d', { willReadFrequently: true });

// seeded PRNG (mulberry32)
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function makeRand(seed) {
  const r = mulberry32(seed);
  const f = () => r();
  f.range = (a, b) => a + (b - a) * r();
  f.int = (a, b) => Math.floor(a + (b - a + 1) * r());
  f.gauss = () => { let u = 0; while (u === 0) u = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * r()); };
  f.pick = arr => arr[Math.floor(r() * arr.length)];
  return f;
}
// 2D value noise in [0,1] and fBm
function makeNoise(seed) {
  const r = mulberry32(seed), P = new Uint16Array(512), G = new Float32Array(256);
  for (let i = 0; i < 256; i++) { P[i] = i; G[i] = r(); }
  for (let i = 255; i > 0; i--) { const j = Math.floor(r() * (i + 1)); const t = P[i]; P[i] = P[j]; P[j] = t; }
  for (let i = 0; i < 256; i++) P[i + 256] = P[i];
  return function (x, y) {
    const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
    const X = xi & 255, Y = yi & 255;
    const a = G[P[P[X] + Y]], b = G[P[P[X + 1] + Y]], c = G[P[P[X] + Y + 1]], d = G[P[P[X + 1] + Y + 1]];
    const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  };
}
function fbm(n, x, y, oct = 5, lac = 2.0, gain = 0.5) {
  let s = 0, a = 0.5, f = 1, norm = 0;
  for (let i = 0; i < oct; i++) { s += a * n(x * f + i * 17.3, y * f - i * 9.1); norm += a; a *= gain; f *= lac; }
  return s / norm;
}
const clamp = (v, a = 0, b = 1) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const hexRGB = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const rgba = (c, a = 1) => `rgba(${Math.round(c[0])},${Math.round(c[1])},${Math.round(c[2])},${a})`;
const mixc = (c1, c2, t) => [lerp(c1[0], c2[0], t), lerp(c1[1], c2[1], t), lerp(c1[2], c2[2], t)];
// vectors
const v3 = {
  add: (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]],
  sub: (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]],
  mul: (a, s) => [a[0] * s, a[1] * s, a[2] * s],
  dot: (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2],
  cross: (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]],
  len: a => Math.hypot(a[0], a[1], a[2]),
  norm: a => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; },
  lerp: (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t],
};
// linear light -> display (soft filmic shoulder + sRGB-ish gamma)
const toneMap = (x, exposure = 1) => Math.pow(1 - Math.exp(-Math.max(0, x) * exposure), 1 / 2.2);
const toneRGB = (c, exposure = 1) => [toneMap(c[0], exposure) * 255, toneMap(c[1], exposure) * 255, toneMap(c[2], exposure) * 255];
// layers
function newLayer(w = W, h = H) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function blurCopy(src, px, scale = 1) {
  // blurred copy of a canvas; scale<1 blurs at reduced resolution (fast, for big radii)
  const sw = Math.max(1, Math.round(src.width * scale)), sh = Math.max(1, Math.round(src.height * scale));
  const a = newLayer(sw, sh), ac = a.getContext('2d');
  ac.filter = `blur(${px * scale}px)`; ac.drawImage(src, 0, 0, sw, sh); ac.filter = 'none';
  if (scale === 1) return a;
  const b = newLayer(src.width, src.height), bc = b.getContext('2d');
  bc.imageSmoothingEnabled = true; bc.imageSmoothingQuality = 'high'; bc.drawImage(a, 0, 0, src.width, src.height);
  return b;
}
function convexHull(pts) {
  const p = pts.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  const cr = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
  const lo = [], up = [];
  for (const q of p) { while (lo.length >= 2 && cr(lo[lo.length - 2], lo[lo.length - 1], q) <= 0) lo.pop(); lo.push(q); }
  for (let i = p.length - 1; i >= 0; i--) { const q = p[i]; while (up.length >= 2 && cr(up[up.length - 2], up[up.length - 1], q) <= 0) up.pop(); up.push(q); }
  up.pop(); lo.pop(); return lo.concat(up);
}
function poly(c, pts) { c.beginPath(); c.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) c.lineTo(pts[i][0], pts[i][1]); c.closePath(); }
// bloom: bright-pass at quarter res, multi-radius blur, screen back
function addBloom(target, { threshold = 0.75, knee = 0.15, radii = [8, 24, 64], weights = [0.5, 0.35, 0.25], strength = 0.5, tint = [255, 240, 220] } = {}) {
  const s = 0.25, sw = W * s, sh = H * s;
  const small = newLayer(sw, sh), sc = small.getContext('2d', { willReadFrequently: true });
  sc.drawImage(target.canvas, 0, 0, sw, sh);
  const id = sc.getImageData(0, 0, sw, sh), d = id.data;
  for (let i = 0; i < d.length; i += 4) {
    const l = (0.2126 * d[i] + 0.7152 * d[i + 1] + 0.0722 * d[i + 2]) / 255;
    const k = smooth(threshold - knee, threshold + knee, l) * (l - threshold * 0.5);
    d[i] = d[i] * k * tint[0] / 255; d[i + 1] = d[i + 1] * k * tint[1] / 255; d[i + 2] = d[i + 2] * k * tint[2] / 255;
  }
  sc.putImageData(id, 0, 0);
  target.save(); target.globalCompositeOperation = 'screen'; target.imageSmoothingQuality = 'high';
  radii.forEach((r, i) => { const b = blurCopy(small, r * s); target.globalAlpha = clamp(strength * weights[i]); target.drawImage(b, 0, 0, W, H); });
  target.restore();
}
// final pass: optional grade, vignette, two-scale luminance film grain
function finish(target, { grain = 0.03, seed = 1, vignette = 0.3, vcx = 0.5, vcy = 0.5, vr0 = 0.35, vr1 = 0.95, grade = null } = {}) {
  const id = target.getImageData(0, 0, W, H), d = id.data, r = mulberry32(seed);
  // coarse grain field (half res, bilinear) for clumpy film structure
  const cw = W / 2 + 2, ch = H / 2 + 2, coarse = new Float32Array(cw * ch);
  for (let i = 0; i < coarse.length; i++) coarse[i] = (r() + r() + r() - 1.5) * 2;
  const diag = Math.hypot(W, H) / 2;
  for (let y = 0; y < H; y++) {
    const gy = y / 2, y0 = Math.floor(gy), fy = gy - y0;
    for (let x = 0; x < W; x++) {
      const i = (y * W + x) * 4;
      let R = d[i] / 255, G = d[i + 1] / 255, B = d[i + 2] / 255;
      if (grade) { const o = grade(R, G, B, x, y); R = o[0]; G = o[1]; B = o[2]; }
      if (vignette) {
        const dx = (x - vcx * W) / (W / 2), dy = (y - vcy * H) / (H / 2);
        const dd = Math.sqrt(dx * dx * 0.8 + dy * dy * 1.0) / 1.25;
        const v = 1 - vignette * smooth(vr0, vr1, dd);
        R *= v; G *= v; B *= v;
      }
      const gx = x / 2, x0 = Math.floor(gx), fx = gx - x0, j = y0 * cw + x0;
      const c = (coarse[j] * (1 - fx) + coarse[j + 1] * fx) * (1 - fy) + (coarse[j + cw] * (1 - fx) + coarse[j + cw + 1] * fx) * fy;
      const L = 0.2126 * R + 0.7152 * G + 0.0722 * B;
      const n = ((r() + r() + r() - 1.5) * 2 * 0.65 + c * 0.75) * grain * (0.45 + 2.2 * L * (1 - L));
      d[i] = clamp(R + n) * 255; d[i + 1] = clamp(G + n) * 255; d[i + 2] = clamp(B + n) * 255;
    }
  }
  target.putImageData(id, 0, 0);
}
// ---------------------------------------------------------------- scene
// ===================== EMPTY CHAIR =====================
// Quiet interior, tall window in the back wall (right), low morning sun entering towards the camera.
// A plain wooden chair turned towards the window, a small side table with a picture frame seen from behind.
const rand = makeRand(40211);
const nA = makeNoise(101), nB = makeNoise(202), nC = makeNoise(303), nD = makeNoise(404);
const { add, sub, mul, dot, cross, norm, len } = v3;
function hash1(n) { let h = Math.imul((n | 0) ^ 0x9e3779b9, 0x85ebca6b); h ^= h >>> 13; h = Math.imul(h, 0xc2b2ae35); h ^= h >>> 16; return (h >>> 0) / 4294967296; }

// ---------- camera & room (metres) ----------
const CAMP = [0, 1.18, 0], F = 2050, CX = 1080, CY = 560, WALLZ = 4.6;
const P = (x, y, z) => [CX + F * x / z, CY - F * (y - CAMP[1]) / z, z];
const Pv = p => P(p[0], p[1], p[2]);
const Y0 = CY + F * CAMP[1] / WALLZ;                 // floor / wall line on screen
const L = norm([-0.50, -0.60, -0.62]), TS = mul(L, -1); // sunlight travel dir, towards-sun dir
const EXPO = 1.8, SUN = 6.0;
const SUNC = [1.0, 0.85, 0.66], SKYC = [0.84, 0.9, 1.0], BNC = [1.0, 0.74, 0.52], AMBC = [0.92, 0.88, 0.84];
const WIN = { x0: 0.85, x1: 1.85, y0: 0.42, y1: 2.9, gz: WALLZ + 0.22, fw: 0.055, mx: 1.35, mw: 0.045,
  bars: [[1.0, 0.032], [1.58, 0.06], [2.2, 0.032]] };
const JX = TS[0] * (WIN.gz - WALLZ) / TS[2], JY = TS[1] * (WIN.gz - WALLZ) / TS[2];

function glassOpen(xg, yg) {
  if (xg < WIN.x0 + WIN.fw || xg > WIN.x1 - WIN.fw || yg < WIN.y0 + WIN.fw || yg > WIN.y1 - WIN.fw) return false;
  if (Math.abs(xg - WIN.mx) < WIN.mw / 2) return false;
  for (const [b, w] of WIN.bars) if (Math.abs(yg - b) < w / 2) return false;
  return true;
}
// window panes (glass coords) clipped by the reveal, for the sun patch
const cols = [[WIN.x0 + WIN.fw, WIN.mx - WIN.mw / 2], [WIN.mx + WIN.mw / 2, WIN.x1 - WIN.fw]];
const rowEdges = [WIN.y0 + WIN.fw]; for (const [b, w] of WIN.bars) rowEdges.push(b - w / 2, b + w / 2); rowEdges.push(WIN.y1 - WIN.fw);
const rows = []; for (let i = 0; i < rowEdges.length; i += 2) rows.push([rowEdges[i], rowEdges[i + 1]]);
const panes = [];
for (const c of cols) for (const r of rows) {
  const x0 = Math.max(c[0], WIN.x0 + JX), y0 = Math.max(r[0], WIN.y0 + JY);
  if (x0 < c[1] && y0 < r[1]) panes.push([x0, c[1], y0, r[1]]);
}
const toFloor = (xg, yg) => { const s = yg / -L[1]; return [xg + L[0] * s, 0, WIN.gz + L[2] * s]; };
const floorProj = p => { const s = p[1] / -L[1]; return [p[0] + L[0] * s, 0, p[2] + L[2] * s]; };

// ---------- simple 3D primitives ----------
const parts = [], occluders = [];
function makeXf(origin, yaw) { const c = Math.cos(yaw), s = Math.sin(yaw); return p => [origin[0] + c * p[0] + s * p[2], origin[1] + p[1], origin[2] - s * p[0] + c * p[2]]; }
function localRot(p, tilt, yaw) {
  if (tilt) { const c = Math.cos(tilt), s = Math.sin(tilt); p = [p[0], c * p[1] - s * p[2], s * p[1] + c * p[2]]; }
  if (yaw) { const c = Math.cos(yaw), s = Math.sin(yaw); p = [c * p[0] + s * p[2], p[1], -s * p[0] + c * p[2]]; }
  return p;
}
function addBox(xf, c, h, mat, o = {}) {
  const corners = [];
  for (const sx of [-1, 1]) for (const sy of [-1, 1]) for (const sz of [-1, 1]) {
    const q = localRot([sx * h[0], sy * h[1], sz * h[2]], o.tilt, o.yaw);
    corners.push(xf([c[0] + q[0], c[1] + q[1], c[2] + q[2]]));
  }
  const b = { kind: 'box', corners, centre: xf(c), h, mat, faceMat: o.faceMat || {}, id: parts.length };
  b.ax = [norm(sub(corners[4], corners[0])), norm(sub(corners[2], corners[0])), norm(sub(corners[1], corners[0]))];
  parts.push(b); if (o.occl) occluders.push(b); return b;
}
function addCyl(xf, a, b, r0, r1, mat) { const c = { kind: 'cyl', a: xf(a), b: xf(b), r0, r1, mat, id: parts.length }; parts.push(c); return c; }
function hitBox(o, d, b) {
  const p = sub(b.centre, o); let tmin = -Infinity, tmax = Infinity;
  for (let i = 0; i < 3; i++) {
    const e = dot(b.ax[i], p), f = dot(b.ax[i], d);
    if (Math.abs(f) > 1e-9) {
      let t1 = (e + b.h[i]) / f, t2 = (e - b.h[i]) / f; if (t1 > t2) { const t = t1; t1 = t2; t2 = t; }
      if (t1 > tmin) tmin = t1; if (t2 < tmax) tmax = t2; if (tmin > tmax || tmax < 0) return -1;
    } else if (-e - b.h[i] > 0 || -e + b.h[i] < 0) return -1;
  }
  return tmin > 1e-4 ? tmin : -1;
}
function sunVis(p, selfId = -1) {
  if (p[2] > WALLZ) return 0;
  const s = (WIN.gz - p[2]) / TS[2];
  if (!glassOpen(p[0] + TS[0] * s, p[1] + TS[1] * s)) return 0;
  const sw = (WALLZ - p[2]) / TS[2], xw = p[0] + TS[0] * sw, yw = p[1] + TS[1] * sw;
  if (xw < WIN.x0 || xw > WIN.x1 || yw < WIN.y0 || yw > WIN.y1) return 0;
  for (const b of occluders) if (b.id !== selfId && hitBox(p, TS, b) > 0) return 0;
  return 1;
}

// materials (linear albedo)
const OAK = { c: [0.30, 0.17, 0.085], spec: 0.10, shiny: 26 };
const OAK2 = { c: [0.24, 0.14, 0.075], spec: 0.08, shiny: 22 };
const FRAME = { c: [0.05, 0.04, 0.032], spec: 0.10, shiny: 30 };
const CARD = { c: [0.20, 0.13, 0.075], spec: 0.02, shiny: 8 };

// chair: origin on the floor under the seat, turned towards the window
{
  const xf = makeXf([0.95, 0, 3.86], 0.62);
  addBox(xf, [0, 0.445, 0.005], [0.215, 0.018, 0.205], OAK, { occl: true });                // seat
  for (const sx of [-1, 1]) {
    addCyl(xf, [sx * 0.185, 0, 0.172], [sx * 0.185, 0.428, 0.175], 0.013, 0.017, OAK);        // front legs
    addCyl(xf, [sx * 0.180, 0, -0.182], [sx * 0.185, 0.428, -0.176], 0.014, 0.018, OAK);      // back legs
    addCyl(xf, [sx * 0.185, 0.46, -0.177], [sx * 0.192, 0.905, -0.236], 0.017, 0.0145, OAK);  // back posts (raked)
    addCyl(xf, [sx * 0.186, 0.165, 0.168], [sx * 0.183, 0.165, -0.175], 0.0095, 0.0095, OAK); // side stretchers
  }
  addCyl(xf, [-0.185, 0.215, 0.172], [0.185, 0.215, 0.172], 0.0095, 0.0095, OAK);            // front stretcher
  addBox(xf, [0, 0.842, -0.226], [0.205, 0.042, 0.012], OAK, { tilt: -0.13, occl: true });    // crest rail
  addBox(xf, [0, 0.655, -0.205], [0.19, 0.019, 0.010], OAK, { tilt: -0.13 });                // mid rail
}
// side table with a picture frame (frame faces the window: we only see its back)
{
  const xf = makeXf([1.58, 0, 4.30], -0.12);
  addBox(xf, [0, 0.548, 0], [0.205, 0.013, 0.195], OAK2, { occl: true });                    // top
  addBox(xf, [0, 0.50, 0], [0.175, 0.036, 0.165], OAK2);                                     // apron
  for (const sx of [-1, 1]) for (const sz of [-1, 1])
    addCyl(xf, [sx * 0.162, 0, sz * 0.152], [sx * 0.165, 0.465, sz * 0.155], 0.010, 0.016, OAK2);
  const fx = p => { const q = localRot(p, 0, 0.55); return xf([q[0] - 0.03, q[1], q[2] - 0.02]); };
  addBox(fx, [0, 0.561 + 0.122, -0.026], [0.092, 0.124, 0.009], FRAME, { tilt: -0.2, occl: true, faceMat: { '-z': CARD } });
  addBox(fx, [0, 0.628, -0.088], [0.012, 0.078, 0.0035], FRAME, { tilt: 0.47 });             // easel strut
}

// sunlit-floor emitter samples (bounce light)
const patchS = [];
for (const p of panes) for (let i = 0; i < 4; i++) for (let j = 0; j < 6; j++) {
  const q = toFloor(lerp(p[0], p[1], (i + 0.5) / 4), lerp(p[2], p[3], (j + 0.5) / 6));
  if (sunVis([q[0], 0.002, q[2]]) > 0) patchS.push([q[0], q[2], ((p[1] - p[0]) / 4) * ((p[3] - p[2]) / 6) * 1.03]);
}
const FLOOR_LUM = 0.20, PATCH_B = FLOOR_LUM * SUN * TS[1] / Math.PI;
function bounceAt(p, n) {
  let e = 0;
  for (const s of patchS) {
    const dx = s[0] - p[0], dy = -p[1], dz = s[1] - p[2], d2 = dx * dx + dy * dy + dz * dz, d = Math.sqrt(d2);
    const cr = (n[0] * dx + n[1] * dy + n[2] * dz) / d; if (cr <= 0) continue;
    e += (p[1] / d) * cr * s[2] / d2;
  }
  return e * PATCH_B;
}
// window skylight samples
const skyS = [];
for (let i = 0; i < 5; i++) for (let j = 0; j < 9; j++) skyS.push([lerp(WIN.x0 + 0.1, WIN.x1 - 0.1, (i + 0.5) / 5), lerp(WIN.y0 + 0.1, 2.7, (j + 0.5) / 9), (0.8 / 5) * (2.18 / 9)]);
const SKY_L = 1.1;
function skyAt(p, n) {
  let e = 0;
  for (const s of skyS) {
    const dx = s[0] - p[0], dy = s[1] - p[1], dz = WIN.gz - p[2], d2 = dx * dx + dy * dy + dz * dz, d = Math.sqrt(d2);
    const cr = (n[0] * dx + n[1] * dy + n[2] * dz) / d; if (cr <= 0) continue;
    e += (dz / d) * cr * s[2] / d2;
  }
  return e * SKY_L;
}
function shadePoint(mat, p, n, sv) {
  const ndl = Math.max(0, (dot(n, TS) + 0.18) / 1.18);
  const sun = SUN * ndl * sv, sky = skyAt(p, n), bn = bounceAt(p, n), amb = 0.07 + 0.05 * Math.max(0, n[1]);
  const v = norm(sub(CAMP, p)), h = norm(add(TS, v));
  const spec = mat.spec * Math.pow(Math.max(0, dot(n, h)), mat.shiny) * SUN * sv;
  const out = [];
  for (let k = 0; k < 3; k++) out.push(mat.c[k] * (SUNC[k] * sun + SKYC[k] * sky + BNC[k] * bn + AMBC[k] * amb) + spec * SUNC[k]);
  return out;
}

// ---------- 1. sun patch mask (with object shadows) ----------
const mask = newLayer(), mc = mask.getContext('2d', { willReadFrequently: true });
mc.fillStyle = '#fff';
for (const p of panes) { poly(mc, [toFloor(p[0], p[2]), toFloor(p[1], p[2]), toFloor(p[1], p[3]), toFloor(p[0], p[3])].map(Pv)); mc.fill(); }
const shadowL = newLayer(), sc = shadowL.getContext('2d');
sc.fillStyle = '#000';
for (const pt of parts) {
  let pts3 = [];
  if (pt.kind === 'box') pts3 = pt.corners.slice();
  else {
    const ax = norm(sub(pt.b, pt.a)), u = norm(cross(ax, Math.abs(ax[1]) > 0.9 ? [1, 0, 0] : [0, 1, 0])), w = cross(ax, u);
    for (let k = 0; k < 8; k++) { const a = k / 8 * Math.PI * 2, off = add(mul(u, Math.cos(a)), mul(w, Math.sin(a)));
      pts3.push(add(pt.a, mul(off, pt.r0)), add(pt.b, mul(off, pt.r1))); }
  }
  const hgt = pts3.reduce((m, q) => Math.max(m, q[1]), 0);

// ---------- 4. sheer curtain (right of the window), per pixel over what is behind it ----------

// ---------- 6. objects (painter's algorithm) ----------
function faceList(b) {

  return [[0, 1, 3, 2, '-x'], [4, 6, 7, 5, '+x'], [0, 4, 5, 1, '-y'], [2, 3, 7, 6, '+y'], [0, 2, 6, 4, '-z'], [1, 5, 7, 3, '+z']];

const items = [];
for (const pt of parts) {
  if (pt.kind === 'box') {
    const fl = faceList(pt);
    const fdata = fl.map(f => {
      const cs = f.slice(0, 4).map(k => pt.corners[k]);
      const c = mul(cs.reduce((a, q) => add(a, q), [0, 0, 0]), 0.25);
      const n = norm(sub(c, pt.centre));

}
items.sort((a, b) => b.depth - a.depth);
function drawFace(b, f, fdata) {

  for (const q of samp) sv += sunVis(add(q, mul(f.n, 0.002)), b.id); sv /= samp.length;
