    g.addColorStop(0, '#efe9dd'); g.addColorStop(0.62, '#e4ddcf'); g.addColorStop(0.8, '#d5cdbd'); g.addColorStop(0.9, '#ece6da'); g.addColorStop(1, '#bdb4a3');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, 228, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(cx, cy, 222, Math.PI * 0.75, Math.PI * 1.45); ctx.stroke();
    ctx.strokeStyle = 'rgba(120,105,85,0.25)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(cx, cy, 168, 0, Math.PI * 2); ctx.stroke();
    // teaspoon resting on the saucer
    ctx.save(); ctx.translate(cx + 120, cy + 120); ctx.rotate(-0.75);
    const sp = ctx.createLinearGradient(0, -12, 0, 12); sp.addColorStop(0, '#f3f4f5'); sp.addColorStop(0.5, '#a9adb1'); sp.addColorStop(1, '#6a6e72');
    ctx.fillStyle = sp; ctx.beginPath(); ctx.ellipse(-40, 0, 34, 22, 0, 0, Math.PI * 2); ctx.fill();
    rr(ctx, -10, -5, 150, 10, 5); ctx.fill(); ctx.restore();
    // cup shadow onto the saucer/table
    shadowOf(c => { c.beginPath(); c.arc(cx, cy, 150, 0, Math.PI * 2); c.fill(); c.lineWidth = 26; c.beginPath(); c.arc(cx + 182, cy + 52, 40, -1.6, 2.2); c.stroke(); }, 6.5, 0.42, 0.55);
    // handle (seen from above: a short loop on the right)
    ctx.save(); ctx.translate(cx + 168, cy + 46); ctx.rotate(0.28);
    const hg = ctx.createLinearGradient(0, -30, 0, 30); hg.addColorStop(0, '#f6f2ea'); hg.addColorStop(0.6, '#d8d0c2'); hg.addColorStop(1, '#a89f8f');
    ctx.strokeStyle = hg; ctx.lineWidth = 22; ctx.beginPath(); ctx.ellipse(10, 0, 34, 28, 0, -1.5, 1.5); ctx.stroke(); ctx.restore();
    // cup rim and inner wall (lit on the right inside, since the light comes from the left)
    g = ctx.createRadialGradient(cx - 20, cy - 10, 100, cx, cy, 152);
    g.addColorStop(0, '#f2eee6'); g.addColorStop(0.85, '#e9e3d8'); g.addColorStop(1, '#bfb6a6');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, 150, 0, Math.PI * 2); ctx.fill();
    const iw = ctx.createLinearGradient(cx - 135, cy, cx + 135, cy);
    iw.addColorStop(0, '#a99f8f'); iw.addColorStop(0.45, '#cfc7b8'); iw.addColorStop(1, '#f4f0e8');
    ctx.fillStyle = iw; ctx.beginPath(); ctx.arc(cx, cy, 136, 0, Math.PI * 2); ctx.fill();
    // tea surface
    const tg = ctx.createRadialGradient(cx + 20, cy + 10, 10, cx, cy, 122);
    tg.addColorStop(0, '#8a5a2e'); tg.addColorStop(0.7, '#6f4422'); tg.addColorStop(1, '#4b2c15');
    ctx.fillStyle = tg; ctx.beginPath(); ctx.arc(cx + 6, cy + 4, 120, 0, Math.PI * 2); ctx.fill();
    // meniscus ring and soft window reflection
    ctx.strokeStyle = 'rgba(210,160,100,0.45)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(cx + 6, cy + 4, 118, 0, Math.PI * 2); ctx.stroke();
    ctx.save(); ctx.beginPath(); ctx.arc(cx + 6, cy + 4, 118, 0, Math.PI * 2); ctx.clip();
    const rf = ctx.createRadialGradient(cx - 55, cy - 30, 5, cx - 55, cy - 30, 75);
    rf.addColorStop(0, 'rgba(255,248,232,0.55)'); rf.addColorStop(0.5, 'rgba(255,240,215,0.18)'); rf.addColorStop(1, 'rgba(255,240,215,0)');
    ctx.fillStyle = rf; ctx.fillRect(cx - 140, cy - 120, 200, 200);
    ctx.restore();
    ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(cx, cy, 148, Math.PI * 0.8, Math.PI * 1.4); ctx.stroke();
  }

  // ---------- 8. light: soft window light from the left with faint mullion shadows ----------
  {
    const lay = newLayer(), lc = lay.getContext('2d');
    const g = lc.createLinearGradient(0, 0, W, H * 0.3);
    g.addColorStop(0, 'rgba(255,248,236,0.20)'); g.addColorStop(0.45, 'rgba(255,248,236,0.04)'); g.addColorStop(1, 'rgba(0,0,0,0)');
    lc.fillStyle = g; lc.fillRect(0, 0, W, H);
    ctx.save(); ctx.globalCompositeOperation = 'screen'; ctx.drawImage(lay, 0, 0); ctx.restore();
    const sh = newLayer(), sc = sh.getContext('2d');
    sc.fillStyle = '#fff'; sc.fillRect(0, 0, W, H);
    const fall = sc.createLinearGradient(0, 0, W, 0);
    fall.addColorStop(0, 'rgba(255,255,255,0)'); fall.addColorStop(0.55, 'rgba(120,100,80,0.10)'); fall.addColorStop(1, 'rgba(70,55,40,0.32)');
    sc.fillStyle = fall; sc.fillRect(0, 0, W, H);
    // two very soft window-bar shadows crossing the table diagonally
    sc.filter = 'blur(70px)'; sc.fillStyle = 'rgba(90,75,60,0.16)';
    sc.save(); sc.translate(W * 0.36, H * 0.5); sc.rotate(-0.32); sc.fillRect(-60, -1200, 120, 2400); sc.restore();
    sc.save(); sc.translate(W * 0.5, H * 0.08); sc.rotate(-0.32); sc.fillRect(-2000, -50, 4000, 100); sc.restore();
    sc.filter = 'none';
    ctx.save(); ctx.globalCompositeOperation = 'multiply'; ctx.drawImage(sh, 0, 0); ctx.restore();
  }
  addBloom(ctx, { threshold: 0.86, knee: 0.08, radii: [6, 20], weights: [0.3, 0.25], strength: 0.35, tint: [255, 244, 228] });
  finish(ctx, {
    grain: 0.03, seed: 83, vignette: 0.32, vcx: 0.47, vcy: 0.5, vr0: 0.32, vr1: 1.1,
    grade: (r, g, b) => {
      const l = 0.2126 * r + 0.7152 * g + 0.0722 * b;
      const s = 0.9; r = l + (r - l) * s; g = l + (g - l) * s; b = l + (b - l) * s;
      return [r, g, b];
    },
  });
}

  try { await main(); } catch (e) { console.error('render failed: ' + (e && e.stack || e)); }
  window.__done = true;
}, 30));
