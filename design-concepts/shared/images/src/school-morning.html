// school-morning: original procedural illustration created for this proposal (deterministic, seeded).
window.__done = false;
// ---------------------------------------------------------------------------
// Shared helpers (inlined into every source so each page is self-contained).
// Deterministic: all randomness comes from seeded PRNGs.
// ---------------------------------------------------------------------------
const W = 2400, H = 1600;
function mulberry32(a) { return function () { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

const gauss = () => { let u = 0; for (let i = 0; i < 6; i++) u += R(); return (u - 3) / 0.7071; };

const lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, v) => { const t = clamp((v - a) / (b - a)); return t * t * (3 - 2 * t); };

    const u = xf * xf * xf * (xf * (xf * 6 - 15) + 10), v = yf * yf * yf * (yf * (yf * 6 - 15) + 10);
    const a = p[p[xi] + yi], b = p[p[xi + 1] + yi], c = p[p[xi] + yi + 1], d = p[p[xi + 1] + yi + 1];
    const ga = gx[a] * xf + gy[a] * yf, gb = gx[b] * (xf - 1) + gy[b] * yf, gc = gx[c] * xf + gy[c] * (yf - 1), gd = gx[d] * (xf - 1) + gy[d] * (yf - 1);
    const x1 = ga + (gb - ga) * u, x2 = gc + (gd - gc) * u; return (x1 + (x2 - x1) * v) * 1.41;
  }
  function fbm(x, y, o = 5, g = 0.5, l = 2.0) { let s = 0, a = 1, n = 0; for (let i = 0; i < o; i++) { s += a * n2(x, y); n += a; a *= g; x = x * l + 17.31; y = y * l + 9.17; } return s / n; }
  function ridged(x, y, o = 5) { let s = 0, a = 1, n = 0, w = 1; for (let i = 0; i < o; i++) { let v = 1 - Math.abs(n2(x, y)); v *= v; s += v * a * w; n += a; w = clamp(v * 1.6, 0.25, 1); a *= 0.5; x = x * 2.03 + 5.1; y = y * 2.03 + 1.7; } return s / n; }
  return { n2, fbm, ridged };
}

function hx(h) { if (Array.isArray(h)) return h; h = h.replace('#', ''); return [parseInt(h.substr(0, 2), 16), parseInt(h.substr(2, 2), 16), parseInt(h.substr(4, 2), 16)]; }
function mix(a, b, t) { a = hx(a); b = hx(b); return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; }
function scl(a, k) { a = hx(a); return [a[0] * k, a[1] * k, a[2] * k]; }
function mul(a, b) { a = hx(a); b = hx(b); return [a[0] * b[0] / 255, a[1] * b[1] / 255, a[2] * b[2] / 255]; }
function rgba(c, al = 1) { c = hx(c); return `rgba(${Math.round(clamp(c[0], 0, 255))},${Math.round(clamp(c[1], 0, 255))},${Math.round(clamp(c[2], 0, 255))},${al})`; }
function ramp(stops, t) {
  if (t <= stops[0][0]) return hx(stops[0][1]);
  for (let i = 1; i < stops.length; i++) if (t <= stops[i][0]) { const a = stops[i - 1], b = stops[i]; return mix(a[1], b[1], (t - a[0]) / (b[0] - a[0])); }
  return hx(stops[stops.length - 1][1]);
}
function mk(w = W, h = H) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c.getContext('2d'); }
function luma(r, g, b) { return (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255; }

function bloom(ctx, { thr = 0.72, str = 0.5, rad = 60, scale = 0.25, tint = [255, 244, 228] } = {}) {
  const w = Math.round(W * scale), h = Math.round(H * scale);
  const s = mk(w, h); s.imageSmoothingQuality = 'high'; s.drawImage(ctx.canvas, 0, 0, w, h);
  const id = s.getImageData(0, 0, w, h), d = id.data;
  for (let i = 0; i < d.length; i += 4) {
    const l = luma(d[i], d[i + 1], d[i + 2]); const k = clamp((l - thr) / (1 - thr)); const m = k * k;
    d[i] = d[i] * m * tint[0] / 255; d[i + 1] = d[i + 1] * m * tint[1] / 255; d[i + 2] = d[i + 2] * m * tint[2] / 255; d[i + 3] = 255;
  }
  s.putImageData(id, 0, 0);
  const b = mk(w, h); b.filter = `blur(${rad * scale}px)`; b.drawImage(s.canvas, 0, 0);
  ctx.save(); ctx.globalCompositeOperation = 'screen'; ctx.globalAlpha = str; ctx.imageSmoothingQuality = 'high'; ctx.drawImage(b.canvas, 0, 0, W, H); ctx.restore();
}

function finish(ctx, { grain = 0.03, vig = 0.2, seed = 99, lift = 0.012, contrast = 0.0, sat = 1.0, cx = 0.5, cy = 0.5 } = {}) {
  const id = ctx.getImageData(0, 0, W, H), d = id.data;
  const gw = (W >> 1) + 1, gh = (H >> 1) + 1, g2 = new Float32Array(gw * gh); const r = mulberry32(seed);
  for (let i = 0; i < g2.length; i++) g2[i] = (r() + r() + r() - 1.5) * 1.6;
  const ccx = W * cx, ccy = H * cy;
  let hs = seed * 2654435761 >>> 0;
  for (let y = 0; y < H; y++) {
    const dy = (y - ccy) / (H * 0.5);
    for (let x = 0; x < W; x++) {
      const i = (y * W + x) * 4;
      let rr = d[i] / 255, gg = d[i + 1] / 255, bb = d[i + 2] / 255;
      if (contrast) { rr = rr + contrast * rr * (1 - rr) * (rr - 0.5) * 4; gg = gg + contrast * gg * (1 - gg) * (gg - 0.5) * 4; bb = bb + contrast * bb * (1 - bb) * (bb - 0.5) * 4; }
      if (sat !== 1) { const l = 0.2126 * rr + 0.7152 * gg + 0.0722 * bb; rr = l + (rr - l) * sat; gg = l + (gg - l) * sat; bb = l + (bb - l) * sat; }
      const dx = (x - ccx) / (W * 0.5); const rad = Math.sqrt(dx * dx * 0.85 + dy * dy * 1.0);
      const v = 1 - vig * sstep(0.35, 1.35, rad);
      rr *= v; gg *= v; bb *= v;
      rr = lift + rr * (1 - lift); gg = lift + gg * (1 - lift); bb = lift + bb * (1 - lift);
      hs = (Math.imul(hs ^ (hs >>> 15), 2246822519) + 0x9E3779B9) >>> 0; const f1 = (hs & 0xffff) / 65535; const f2 = (hs >>> 16) / 65535;
      const fine = (f1 + f2 - 1) * 1.7;
      const coarse = g2[(y >> 1) * gw + (x >> 1)];
      const l = 0.2126 * rr + 0.7152 * gg + 0.0722 * bb;
      const wgt = 0.45 + 2.2 * l * (1 - l);
      const n = (fine * 0.55 + coarse * 0.7) * grain * wgt;
      d[i] = clamp(rr + n) * 255; d[i + 1] = clamp(gg + n) * 255; d[i + 2] = clamp(bb + n) * 255;
    }
  }

}

// Filled chain of overlapping discs along a polyline: [[x, y, width], ...] in screen px. Gives soft round joints.
function limb(c, pts) {
  for (let i = 0; i < pts.length - 1; i++) {
    const a = pts[i], b = pts[i + 1];
    const n = Math.ceil(Math.hypot(b[0] - a[0], b[1] - a[1]) / Math.max(0.4, Math.min(a[2], b[2]) * 0.15)) + 1;
    for (let k = 0; k <= n; k++) {
      const t = k / n; const x = lerp(a[0], b[0], t), y = lerp(a[1], b[1], t), r = Math.max(0.3, lerp(a[2], b[2], t) / 2);
      c.moveTo(x + r, y); c.arc(x, y, r, 0, Math.PI * 2);
    }
  }
}
// Smooth closed curve through points (uniform Catmull-Rom converted to Bezier segments).
function smoothClosed(c, P, k = 1) {
  const n = P.length; c.moveTo(P[0][0], P[0][1]);
  for (let i = 0; i < n; i++) {
    const p0 = P[(i - 1 + n) % n], p1 = P[i], p2 = P[(i + 1) % n], p3 = P[(i + 2) % n];
    c.bezierCurveTo(p1[0] + (p2[0] - p0[0]) / 6 * k, p1[1] + (p2[1] - p0[1]) / 6 * k, p2[0] - (p3[0] - p1[0]) / 6 * k, p2[1] - (p3[1] - p1[1]) / 6 * k, p2[0], p2[1]);
  }

}
// Draw a list of figure shapes (metres, u to the right, v up) through a mapping to screen space.
// map(u, v) -> [x, y]; sc(u, v) -> px per metre (for limb widths). Each shape is filled on its own.
function drawShapes(c, shapes, map, sc) {
  for (const s of shapes) {
    c.beginPath();
    if (s.t === 'poly') smoothClosed(c, s.p.map(q => map(q[0], q[1])), s.k ?? 1);
    else if (s.t === 'ell') {
      const n = 36, cr = Math.cos(s.rot || 0), sr = Math.sin(s.rot || 0);
      for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2; const du = s.rx * Math.cos(a), dv = s.ry * Math.sin(a); const p = map(s.c[0] + du * cr - dv * sr, s.c[1] + du * sr + dv * cr); i ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1]); }
      c.closePath();
    } else if (s.t === 'limb') limb(c, s.p.map(q => { const m = map(q[0], q[1]); return [m[0], m[1], q[2] * sc(q[0], q[1])]; }));
    c.fill();
  }
}
// A school-age child seen from behind, walking. Everything in head units then scaled to metres.
function childShapes(o) {
  const hu = o.h / o.hr, T = o.hr, S = [];
  const M = (u, v) => [u * hu, v * hu];
  const poly = pts => S.push({ t: 'poly', p: pts.map(q => M(q[0], q[1])) });
  const ell = (u, v, rx, ry, rot = 0) => S.push({ t: 'ell', c: M(u, v), rx: rx * hu, ry: ry * hu, rot });
  const lmb = pts => S.push({ t: 'limb', p: pts.map(q => [q[0] * hu, q[1] * hu, q[2] * hu]) });
  const crotch = T * 0.465;
  // legs: one planted, one trailing with the heel lifted (sole toward camera)
  for (const side of [-1, 1]) {
    const trailing = (side === 1) === (o.step > 0);
    const x = side * 0.26;
    if (!trailing) {
      lmb([[x, crotch + 0.1, 0.52], [x * 0.98, crotch * 0.55, 0.42], [x * 0.95, crotch * 0.22, 0.31], [x * 0.95, 0.32, 0.23]]);
      ell(x * 0.95, 0.14, 0.2, 0.15);
    } else {
      lmb([[x, crotch + 0.1, 0.52], [x * 1.02, crotch * 0.58, 0.42], [x * 1.04, crotch * 0.33, 0.31], [x * 1.05, 0.62, 0.23]]);
      ell(x * 1.06, 0.36, 0.17, 0.3, side * 0.06);
    }
  }
  // shorts / skirt
  if (o.skirt) poly([[-0.6, T - 2.55], [-0.7, crotch + 0.4], [-0.86, crotch - 0.55], [0, crotch - 0.6], [0.86, crotch - 0.55], [0.7, crotch + 0.4], [0.6, T - 2.55]]);
  else poly([[-0.6, T - 2.55], [-0.66, crotch + 0.2], [-0.62, crotch - 0.3], [-0.02, crotch - 0.25], [0.62, crotch - 0.3], [0.66, crotch + 0.2], [0.6, T - 2.55]]);
  // torso
  poly([[-0.16, T - 1.12], [-0.46, T - 1.27], [-0.74, T - 1.4], [-0.75, T - 1.85], [-0.62, T - 2.45], [-0.62, T - 2.75], [0, T - 2.8], [0.62, T - 2.75], [0.62, T - 2.45], [0.75, T - 1.85], [0.74, T - 1.4], [0.46, T - 1.27], [0.16, T - 1.12]]);
  // arms (slight swing): the arm on the side of the trailing leg swings forward and looks shorter
  for (const side of [-1, 1]) {
    const fwd = (side === 1) === (o.step > 0) ? -1 : 1; // -1: swinging forward (away), +1: back (toward camera)
    const sw = o.swing ?? 0.6;
    const el = [side * (0.84 + 0.04 * fwd * sw), T - 2.5 + (fwd < 0 ? 0.08 : 0)];
    const wr = [side * (0.86 + 0.08 * fwd * sw), T - 3.35 + (fwd < 0 ? 0.25 * sw : 0)];
    lmb([[side * 0.68, T - 1.45, 0.34], [el[0], el[1], 0.28], [wr[0], wr[1], 0.22]]);
    ell(wr[0] + side * 0.01, wr[1] - 0.22, 0.13, 0.19);
  }
  // neck, head and hair
  lmb([[0, T - 0.85, 0.36], [0, T - 1.25, 0.38]]);
  ell(0, T - 0.5, 0.41, 0.5);
  if (o.hair === 'puffs') { ell(-0.3, T - 0.18, 0.21, 0.19); ell(0.3, T - 0.18, 0.21, 0.19); }
  if (o.hair === 'braids') { lmb([[-0.2, T - 0.75, 0.13], [-0.25, T - 1.25, 0.11], [-0.27, T - 1.55, 0.09]]); lmb([[0.2, T - 0.75, 0.13], [0.25, T - 1.25, 0.11], [0.27, T - 1.55, 0.09]]); }
  if (o.hair === 'pony') lmb([[0.02, T - 0.3, 0.2], [0.06, T - 0.75, 0.16], [0.08, T - 1.2, 0.1]]);
  if (o.hair === 'short') ell(0, T - 0.46, 0.43, 0.53);

  S.push({ t: 'poly', pack: true, p: [[-pw / 2 + r, top], [pw / 2 - r, top], [pw / 2, top - r], [pw / 2 + 0.03, bot + r], [pw / 2 - r, bot], [-pw / 2 + r, bot], [-pw / 2 - 0.03, bot + r], [-pw / 2, top - r]].map(q => M(q[0], q[1])) });

}

// ---------------------------------------------------------------------------
// school-morning — a small single-storey school with painted walls, early morning. The low sun
// shines through a big tree at the left; children with backpacks walk up the dirt path toward
// the door, their long shadows stretching back toward us. Calm sky upper right.
(async function main() {
  const ctx = document.getElementById('c').getContext('2d');
  setSeed(3131);
  const NA = makeNoise(71), NB = makeNoise(72), NC = makeNoise(73), ND = makeNoise(74), NE = makeNoise(75);

  // ---------- camera and sun ----------
  const YH = 912, VX = 1200, FL = 1900, HC = 1.45;
  const proj = (X, Y, Z) => [VX + FL * X / Z, YH + FL * (HC - Y) / Z];
  const SUNP = { x: 640, y: 432 };
  const sv = (() => { const v = [(SUNP.x - VX) / FL, (YH - SUNP.y) / FL, 1]; const l = Math.hypot(...v); return v.map(a => a / l); })();
  const SDX = -sv[0], SDZ = -sv[2]; const SDL = Math.hypot(SDX, SDZ);
  const SHX = SDX / SDL, SHZ = SDZ / SDL, SHL = Math.hypot(sv[0], sv[2]) / sv[1]; // ground shadow direction and length per metre of height

  // ---------- sky ----------
  const SKY = [[0, '#a7b6c2'], [0.3, '#bcc6cb'], [0.62, '#d6d6cf'], [0.85, '#e8dfcd'], [1, '#efe2c9']];
  const skyRow = []; for (let y = 0; y < H; y++) skyRow.push(ramp(SKY, clamp(y / YH)));
  const GLOW = [255, 240, 205];
  function glowAt(x, y) {
    const dx = (x - SUNP.x) / H, dy = (y - SUNP.y) / H; const d2 = dx * dx + dy * dy;
    return clamp(1.0 * Math.exp(-d2 / 0.00018) + 0.5 * Math.exp(-d2 / 0.0035) + 0.32 * Math.exp(-d2 / 0.03) + 0.16 * Math.exp(-d2 / 0.2));
  }
  function sky(x, y) {
    const c = skyRow[clamp(Math.round(y), 0, H - 1)]; const g = glowAt(x, y);
    const hzg = Math.exp(-Math.pow((y - YH) / 150, 2)) * 0.18;
    const gg = clamp(g + hzg);
    return [255 - (255 - c[0]) * (1 - gg * GLOW[0] / 255), 255 - (255 - c[1]) * (1 - gg * GLOW[1] / 255), 255 - (255 - c[2]) * (1 - gg * GLOW[2] / 255)];
  }
  const hz = []; for (let x = 0; x <= W; x++) hz[x] = sky(Math.min(x, W - 1), YH - 4);

  // ---------- scene solids for shadow rays ----------
  const B = { x0: -0.5, x1: 10.5, z0: 22, z1: 28.5, wh: 3.1, rx0: -1.0, rx1: 11.0, rz0: 21.5, rz1: 29.0, ridge: 4.55, eave: 2.95, rzc: 25.25 };
  const roofY = Z => B.ridge - (B.ridge - B.eave) * Math.abs(Z - B.rzc) / (B.rzc - B.rz0);
  const TREE = { x: -11.2, z: 24.5, r: 0.42, th: 4.6, cx: -10.8, cy: 7.5, cz: 24.5, ax: 6.8, ay: 3.9, az: 5.6 };
  function slab(o, d, lo, hi) { let t0 = 0, t1 = 1e9; for (let k = 0; k < 3; k++) { if (Math.abs(d[k]) < 1e-9) { if (o[k] < lo[k] || o[k] > hi[k]) return null; continue; } let a = (lo[k] - o[k]) / d[k], b = (hi[k] - o[k]) / d[k]; if (a > b) { const t = a; a = b; b = t; } t0 = Math.max(t0, a); t1 = Math.min(t1, b); if (t0 > t1) return null; } return [t0, t1]; }
  function sunVis(X, Y, Z) {
    const o = [X, Y, Z];
    // building
    const bi = slab(o, sv, [B.rx0, 0, B.rz0], [B.rx1, B.ridge, B.rz1]);
    if (bi) {
      for (let k = 0; k <= 10; k++) {
        const t = lerp(bi[0], bi[1], k / 10); const px = X + sv[0] * t, py = Y + sv[1] * t, pz = Z + sv[2] * t;
        if (px > B.x0 && px < B.x1 && pz > B.z0 && pz < B.z1 && py < B.wh) return 0;
        if (px > B.rx0 && px < B.rx1 && pz > B.rz0 && pz < B.rz1 && py > B.eave - 0.12 && py < roofY(pz)) return 0;
      }
    }
    // trunk
    const ts = ((TREE.x - X) * sv[0] + (TREE.z - Z) * sv[2]) / (sv[0] * sv[0] + sv[2] * sv[2]);
    if (ts > 0 && Y + ts * sv[1] < TREE.th) { const dx = X + sv[0] * ts - TREE.x, dz = Z + sv[2] * ts - TREE.z; if (dx * dx + dz * dz < TREE.r * TREE.r) return 0; }
    // canopy (noisy ellipsoid, partially transparent)
    const ox = (X - TREE.cx) / TREE.ax, oy = (Y - TREE.cy) / TREE.ay, oz = (Z - TREE.cz) / TREE.az;
    const dx = sv[0] / TREE.ax, dy = sv[1] / TREE.ay, dz = sv[2] / TREE.az;
    const a = dx * dx + dy * dy + dz * dz, b = 2 * (ox * dx + oy * dy + oz * dz), c = ox * ox + oy * oy + oz * oz - 1;
    const disc = b * b - 4 * a * c;
    if (disc > 0) {
      const sq = Math.sqrt(disc); let t0 = (-b - sq) / (2 * a), t1 = (-b + sq) / (2 * a);
      if (t1 > 0) {
        t0 = Math.max(0, t0); let acc = 0; const N = 9, dt = (t1 - t0) / N;
        for (let k = 0; k < N; k++) {
          const t = t0 + (k + 0.5) * dt; const px = X + sv[0] * t, py = Y + sv[1] * t, pz = Z + sv[2] * t;
          const q = Math.pow((px - TREE.cx) / TREE.ax, 2) + Math.pow((py - TREE.cy) / TREE.ay, 2) + Math.pow((pz - TREE.cz) / TREE.az, 2);
          const n = 0.55 * NA.n2(px / 1.3 + pz * 0.21, py / 1.3) + 0.45 * NB.n2(pz / 1.3 - px * 0.17, py / 1.1 + 3.3);
          acc += clamp((n + 0.12) * 3.2) * (1 - q * 0.6) * dt;
        }
        return Math.exp(-acc * 1.15);
      }
    }
    return 1;
  }

    const clumps = [];
    for (let i = 0; i < 2600; i++) {
      let ux, uy, uz; do { ux = rnd(-1, 1); uy = rnd(-1, 1); uz = rnd(-1, 1); } while (ux * ux + uy * uy + uz * uz > 1);
      const surf = Math.sqrt(ux * ux + uy * uy + uz * uz);
      if (surf < 0.55 && R() < 0.7) continue;
      const X = TREE.cx + ux * TREE.ax, Y = TREE.cy + uy * TREE.ay * (uy < 0 ? 0.75 : 1), Z = TREE.cz + uz * TREE.az;
      const n = NA.n2(X / 2.2, Y / 2.0);
      if (n < -0.32 && surf > 0.7) continue; // gaps where the sky shows through
      clumps.push({ X, Y, Z, r: rnd(0.45, 0.95) * (1.1 - 0.3 * surf) });
    }
    clumps.sort((a, b) => b.Z - a.Z);
    for (const c of clumps) {
      const [x, y] = proj(c.X, c.Y, c.Z); const rp = c.r * FL / c.Z;
      tr.fillStyle = rgba(mix('#2a3123', '#3a4230', R()));
      tr.beginPath();
      const k = 5 + Math.floor(R() * 4);
      for (let j = 0; j < k; j++) { const a = rnd(0, Math.PI * 2), d = rnd(0, 0.65) * rp; const rr = rp * rnd(0.32, 0.55); tr.moveTo(x + Math.cos(a) * d + rr, y + Math.sin(a) * d); tr.arc(x + Math.cos(a) * d, y + Math.sin(a) * d * 0.8, rr, 0, Math.PI * 2); }
      tr.fill();
    }
    // fine leaf fringe on the outer edge
    for (let i = 0; i < 4200; i++) {
      const a = rnd(0, Math.PI * 2); const ex = Math.cos(a), ey = Math.sin(a);
      if (ey > 0.55) continue;
      const X = TREE.cx + ex * TREE.ax * rnd(0.86, 1.04), Y = TREE.cy - ey * TREE.ay * rnd(0.86, 1.06), Z = TREE.cz + rnd(-0.5, 0.5) * TREE.az;
      const [x, y] = proj(X, Y, Z); const rp = rnd(0.07, 0.16) * FL / Z;
      tr.fillStyle = rgba(mix('#2a3123', '#3a4230', R()));
      tr.beginPath(); tr.ellipse(x, y, rp * 1.3, rp, rnd(0, 3), 0, Math.PI * 2); tr.fill();
    }
  }
  // translucent glow in the leaves nearest the sun; rim light on sun-facing edges
  {
    const g = tr.createRadialGradient(SUNP.x, SUNP.y, 0, SUNP.x, SUNP.y, 520);
    g.addColorStop(0, 'rgba(196,190,110,0.85)'); g.addColorStop(0.35, 'rgba(120,128,70,0.45)'); g.addColorStop(1, 'rgba(90,100,60,0)');
    tr.save(); tr.globalCompositeOperation = 'source-atop'; tr.fillStyle = g; tr.fillRect(0, 0, W, H); tr.restore();
    const rim = mk(); rim.drawImage(tr.canvas, 0, 0);
    rim.globalCompositeOperation = 'destination-out';
    for (const [ox, oy] of [[3, 2], [5, 3]]) rim.drawImage(tr.canvas, ox, oy);
    rim.globalCompositeOperation = 'source-in'; rim.fillStyle = 'rgba(232,214,150,0.9)'; rim.fillRect(0, 0, W, H);
    tr.save(); tr.globalCompositeOperation = 'source-atop'; tr.globalAlpha = 0.55; tr.filter = 'blur(1px)'; tr.drawImage(rim.canvas, 0, 0); tr.restore();
  }
  ctx.save(); ctx.filter = 'blur(0.8px)'; ctx.drawImage(tr.canvas, 0, 0); ctx.restore();
  await tick();

  // ---------- children (silhouettes with rim light from the low sun) ----------
  const kidsL = mk();
  for (const k of [...KIDS].sort((a, b) => b.Z - a.Z)) {
    const one = mk();
    const map = (u, v) => proj(k.X + u, v, k.Z), sc = () => FL / k.Z;
    one.fillStyle = '#2a2420';
    drawShapes(one, k.shapes.filter(s => !s.pack), map, sc);
    one.fillStyle = k.packCol;
    drawShapes(one, k.shapes.filter(s => s.pack), map, sc);
    // rim light: the part of the silhouette within a few px of the sun-facing edge
    const rim = mk(); rim.drawImage(one.canvas, 0, 0);
    const rw = Math.max(1.6, 0.022 * FL / k.Z);
    const dir = [SUNP.x - proj(k.X, k.h * 0.6, k.Z)[0], SUNP.y - proj(k.X, k.h * 0.6, k.Z)[1]]; const dl = Math.hypot(...dir);
    rim.globalCompositeOperation = 'destination-out'; rim.drawImage(one.canvas, -dir[0] / dl * rw, -dir[1] / dl * rw);
    rim.globalCompositeOperation = 'source-in'; rim.fillStyle = 'rgba(255,214,150,1)'; rim.fillRect(0, 0, W, H);
    one.save(); one.globalCompositeOperation = 'source-atop'; one.globalAlpha = 0.75; one.filter = 'blur(0.8px)'; one.drawImage(rim.canvas, 0, 0); one.restore();
    kidsL.drawImage(one.canvas, 0, 0);
  }
  ctx.save(); ctx.filter = 'blur(0.6px)'; ctx.drawImage(kidsL.canvas, 0, 0); ctx.restore();
  await tick();

  // ---------- light: sun disc veiled by leaves, shafts through the canopy, haze, bloom ----------
  {
    const sd = mk(); const g = sd.createRadialGradient(SUNP.x, SUNP.y, 0, SUNP.x, SUNP.y, 60);
    g.addColorStop(0, 'rgba(255,252,240,1)'); g.addColorStop(0.3, 'rgba(255,248,226,0.95)'); g.addColorStop(1, 'rgba(255,240,210,0)');
    sd.fillStyle = g; sd.fillRect(SUNP.x - 80, SUNP.y - 80, 160, 160);
    // only where the canopy lets the sky through
    sd.globalCompositeOperation = 'destination-out'; sd.drawImage(tr.canvas, 0, 0);
    ctx.save(); ctx.globalCompositeOperation = 'screen'; ctx.drawImage(sd.canvas, 0, 0); ctx.restore();
  }
  {
    const q = 4, rw4 = W / q, rh4 = H / q;
    const rays = mk(rw4, rh4); rays.drawImage(ctx.canvas, 0, 0, rw4, rh4);
    const rd = rays.getImageData(0, 0, rw4, rh4), rdd = rd.data;
    for (let i = 0; i < rdd.length; i += 4) { const y = Math.floor(i / 4 / rw4) * q; const l = luma(rdd[i], rdd[i + 1], rdd[i + 2]); const k = clamp((l - 0.86) / 0.14) * (y < YH ? 1 : 0); rdd[i] *= k; rdd[i + 1] *= k * 0.95; rdd[i + 2] *= k * 0.82; }
    rays.putImageData(rd, 0, 0);
    const acc = mk(rw4, rh4); acc.globalCompositeOperation = 'lighter';
    const sx = SUNP.x / q, sy = SUNP.y / q;
    for (let k = 0; k < 40; k++) { const s = 1 + k * 0.045; acc.globalAlpha = 0.05 * (1 - k / 40); acc.drawImage(rays.canvas, sx - sx * s, sy - sy * s, rw4 * s, rh4 * s); }
    ctx.save(); ctx.globalCompositeOperation = 'screen'; ctx.globalAlpha = 0.55; ctx.filter = 'blur(2px)'; ctx.drawImage(acc.canvas, 0, 0, W, H); ctx.restore();
  }
  const veil = ctx.createRadialGradient(SUNP.x, SUNP.y, 0, SUNP.x, SUNP.y, 0.75 * W);
  veil.addColorStop(0, 'rgba(255,236,200,0.30)'); veil.addColorStop(0.3, 'rgba(255,232,196,0.10)'); veil.addColorStop(1, 'rgba(255,230,190,0)');
  ctx.save(); ctx.globalCompositeOperation = 'screen'; ctx.fillStyle = veil; ctx.fillRect(0, 0, W, H); ctx.restore();
  bloom(ctx, { thr: 0.74, str: 0.5, rad: 70 });
  await tick();
  finish(ctx, { grain: 0.028, vig: 0.2, seed: 3131, lift: 0.02, contrast: 0.05, sat: 0.9, cx: 0.45 });
  window.__done = true;
})();
</script>
