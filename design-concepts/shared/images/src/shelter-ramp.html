    return { a: scl(mixc(TIMBER2, TIMBER, 0.35), 0.82 + 0.25 * g), s: 0.03, g: 10, metal: 0, n: null, occ: 1 };
  }
  const STEEL = lin('#a9adb0'), DARKFRAME = lin('#2b2d30'), FABRIC = lin('#1d1f23'), TYRE = lin('#232323'), CHROME = lin('#c8ccd0');
  const steelMat = () => ({ a: STEEL, s: 0.55, g: 28, metal: 0.55, n: null, occ: 1 });
  const frameMat = () => ({ a: DARKFRAME, s: 0.5, g: 60, metal: 0.25, n: null, occ: 1 });
  const fabricMat = h => ({ a: scl(FABRIC, 0.9 + 0.2 * nA(h.px * 60, h.py * 60)), s: 0.12, g: 14, metal: 0, n: null, occ: 1 });
  const tyreMat = () => ({ a: TYRE, s: 0.18, g: 18, metal: 0, n: null, occ: 1 });
  const chromeMat = () => ({ a: CHROME, s: 0.9, g: 80, metal: 0.85, n: null, occ: 1 });
  const GLASSD = lin('#252a2e'), CURT = lin('#cdbfa5');

  // ---------- gravel ground ----------
  const G1 = lin('#a69d8f'), G2 = lin('#8c8173'), G3 = lin('#b9b0a2'), G4 = lin('#7a7064');
  const PEB = 0.03;
  function gravelMat(h) {
    const x = h.px, z = h.pz;
    const fp = h.t / F / Math.max(0.1, Math.abs(h.dy));
    const m1 = fbm(nA, x * 0.25, z * 0.25, 4), m2 = fbm(nB, x * 1.3 + 7, z * 1.3, 3);
    let a = mixc(G1, G2, clamp(0.25 + 0.9 * (m1 - 0.5) + 0.35 * (m2 - 0.5)));
    // compacted, slightly lighter strip leading to the ramp
    const pathD = Math.abs((z - 2.4) - (x + 4.6) * -0.18);
    const path = smooth(1.3, 0.5, pathD) * smooth(-9, -6.5, x) * smooth(0.5, -2.5, x);
    a = mixc(a, G3, 0.25 * path);
    let nx = 0, nz = 0, occ = 1;
    const wd = 1 - smooth(PEB * 0.22, PEB * 0.85, fp);
    if (wd > 0) {
      worley(x / PEB, z / PEB, 3, 0.9);
      const id = WR.id, e = WR.f2 - WR.f1;
      const crev = smooth(0.0, 0.2, e);
      const r1 = hash1(id), r2 = hash1(id + 99);
      const tint = r1 < 0.33 ? G3 : r1 < 0.66 ? G1 : r1 < 0.88 ? G2 : G4;
      a = mixc(a, scl(tint, 0.9 + 0.25 * r2), 0.55 * wd);
      const ux = x / PEB - WR.cx, uz = z / PEB - WR.cy;
      const bump = 1.3 * wd * (1 - 0.6 * path);
      nx = ux * bump; nz = uz * bump;
      occ = lerp(1, 0.5 + 0.5 * crev, wd * (1 - 0.5 * path));
    }
    // fine grit
    const wg = 1 - smooth(0.003, 0.009, fp);
    if (wg > 0) a = scl(a, 1 + 0.18 * wg * (nC(x * 160, z * 160) - 0.5));
    const l = Math.hypot(nx, 1, nz);
    return { a, s: 0.02, g: 8, metal: 0, n: [nx / l, 1 / l, nz / l], occ };
  }

  // ---------- geometry ----------
  const top = [];
  const ground = Plane([0, 0, 0], [0, 1, 0], gravelMat, { shadow: false, ao: false, tag: 'ground' });
  top.push(ground);

  const FLOOR = 0.28, WALLTOP = 2.6, DEPTH = 3.2, ULEN = 5.6;
  function unit(x0, zf, opts) {
    const kids = [];
    const x1 = x0 + ULEN, xc = (x0 + x1) / 2;
    kids.push(Box([xc, (0.1 + WALLTOP) / 2, zf - DEPTH / 2], [ULEN / 2, (WALLTOP - 0.1) / 2, DEPTH / 2], h => wallMat(h, x0)));
    kids.push(Box([xc, 0.05, zf - DEPTH / 2], [ULEN / 2 - 0.08, 0.05, DEPTH / 2 - 0.08], () => ({ a: PLINTH, s: 0, g: 1, metal: 0, n: null, occ: 0.6 })));
    // roof slab with overhang + fascia
    kids.push(Box([xc, WALLTOP + 0.07, zf - DEPTH / 2 + 0.02], [ULEN / 2 + 0.16, 0.07, DEPTH / 2 + 0.2], h => {
      const top = h.ny > 0.5; return { a: scl(ROOF, top ? 0.9 : 1.0), s: 0.15, g: 20, metal: 0.2, n: null, occ: 1 };
    }));
    // door
    const dx0 = x0 + opts.door, dw = 0.95, dh = 2.04;
    const DC = lin(opts.doorCol);
    kids.push(Box([dx0 + dw / 2, FLOOR + dh / 2, zf + 0.018], [dw / 2, dh / 2, 0.018], h => {
      // two shallow pressed panels
      const u = (h.px - dx0) / dw, v = (h.py - FLOOR) / dh;
      const inP = (u > 0.14 && u < 0.86) && ((v > 0.08 && v < 0.46) || (v > 0.54 && v < 0.92));
      const edgeU = Math.min(Math.abs(u - 0.14), Math.abs(u - 0.86)), edgeV = Math.min(Math.abs(v - 0.08), Math.abs(v - 0.46), Math.abs(v - 0.54), Math.abs(v - 0.92));
      const line = (Math.min(edgeU * dw, (edgeV * dh)) < 0.008 && u > 0.12 && u < 0.88 && ((v > 0.06 && v < 0.48) || (v > 0.52 && v < 0.94))) ? 0.78 : 1;
      return { a: scl(DC, (inP ? 0.97 : 1.0) * line * (0.95 + 0.07 * nA(h.px * 9, h.py * 2))), s: 0.2, g: 35, metal: 0, n: null, occ: 1 };
    }));
    // door frame (architrave)
    const FR = () => ({ a: lin('#e6e3dc'), s: 0.1, g: 30, metal: 0, n: null, occ: 1 });
    kids.push(Box([dx0 - 0.035, FLOOR + dh / 2 + 0.02, zf + 0.025], [0.035, dh / 2 + 0.02, 0.025], FR));
    kids.push(Box([dx0 + dw + 0.035, FLOOR + dh / 2 + 0.02, zf + 0.025], [0.035, dh / 2 + 0.02, 0.025], FR));
    kids.push(Box([dx0 + dw / 2, FLOOR + dh + 0.035, zf + 0.025], [dw / 2 + 0.07, 0.035, 0.025], FR));
    // handle
    kids.push(Cyl([dx0 + dw - 0.12, FLOOR + 1.02, zf + 0.04], [dx0 + dw - 0.12, FLOOR + 1.02, zf + 0.085], 0.012, chromeMat));
    kids.push(Cyl([dx0 + dw - 0.12, FLOOR + 1.02, zf + 0.08], [dx0 + dw - 0.24, FLOOR + 1.02, zf + 0.08], 0.011, chromeMat));
    // windows on the facade
    for (const wdw of opts.windows) {
      const [wx0, wx1, wy0, wy1] = wdw;
      const wc = [x0 + (wx0 + wx1) / 2, (wy0 + wy1) / 2, zf + 0.004];
      kids.push(Box(wc, [(wx1 - wx0) / 2, (wy1 - wy0) / 2, 0.004], h => glassMat(h, x0 + wx0, x0 + wx1, wy0, wy1)));
      const fw = 0.045;
      kids.push(Box([wc[0], wy0 - fw / 2, zf + 0.03], [(wx1 - wx0) / 2 + fw, fw / 2 + 0.005, 0.03], FR));   // sill
      kids.push(Box([wc[0], wy1 + fw / 2, zf + 0.02], [(wx1 - wx0) / 2 + fw, fw / 2, 0.02], FR));
      kids.push(Box([x0 + wx0 - fw / 2, wc[1], zf + 0.02], [fw / 2, (wy1 - wy0) / 2, 0.02], FR));
      kids.push(Box([x0 + wx1 + fw / 2, wc[1], zf + 0.02], [fw / 2, (wy1 - wy0) / 2, 0.02], FR));
      kids.push(Box([wc[0], wc[1], zf + 0.015], [0.015, (wy1 - wy0) / 2, 0.015], FR));                    // mullion
    }
    // end-wall window (left gable, facing -x)
    if (opts.endWindow) {
      const [z0, z1, y0, y1] = opts.endWindow, zc = zf + (z0 + z1) / 2;
      kids.push(Box([x0 - 0.004, (y0 + y1) / 2, zc], [0.004, (y1 - y0) / 2, (z1 - z0) / 2], h => glassMat(h, null, null, y0, y1, zf + z0, zf + z1)));
      const fw = 0.045;
      kids.push(Box([x0 - 0.03, y0 - fw / 2, zc], [0.03, fw / 2 + 0.005, (z1 - z0) / 2 + fw], FR));
      kids.push(Box([x0 - 0.02, y1 + fw / 2, zc], [0.02, fw / 2, (z1 - z0) / 2 + fw], FR));
      kids.push(Box([x0 - 0.02, (y0 + y1) / 2, zf + z0 - fw / 2], [0.02, (y1 - y0) / 2, fw / 2], FR));
      kids.push(Box([x0 - 0.02, (y0 + y1) / 2, zf + z1 + fw / 2], [0.02, (y1 - y0) / 2, fw / 2], FR));
    }
    // simple block steps for units without a ramp
    if (opts.steps) {
      const SM = () => ({ a: lin('#a7a299'), s: 0.02, g: 6, metal: 0, n: null, occ: 1 });
      kids.push(Box([dx0 + dw / 2, 0.095, zf + 0.42], [0.62, 0.095, 0.42], SM));
      kids.push(Box([dx0 + dw / 2, 0.19 + 0.045, zf + 0.21], [0.62, 0.045 + 0.002, 0.21], SM));
    }
    return Group(kids);
  }
  function glassMat(h, gx0, gx1, gy0, gy1, gz0, gz1) {
    // reflection of the sky with fresnel, curtain behind
    const dn = h.dx * h.nx + h.dy * h.ny + h.dz * h.nz;
    const rx = h.dx - 2 * dn * h.nx, ry = h.dy - 2 * dn * h.ny, rz = h.dz - 2 * dn * h.nz;
    const fres = 0.06 + 0.94 * Math.pow(1 - Math.abs(dn), 5);
    const refl = ry > 0 ? skyCol(rx, ry, rz) : scl(lin('#8a8478'), 0.9);
    let u = gx0 !== null && gx0 !== undefined ? (h.px - gx0) / (gx1 - gx0) : (h.pz - gz0) / (gz1 - gz0);
    const v = (h.py - gy0) / (gy1 - gy0);
    const curtain = (u < 0.42 || u > 0.78) ? 1 : 0;
    const folds = 0.75 + 0.25 * Math.sin(u * 60 + 2 * nA(u * 8, v));
    const inside = mixc(GLASSD, scl(CURT, 0.55 * folds), curtain * 0.85);
    const c = [inside[0] * 0.45, inside[1] * 0.45, inside[2] * 0.45];
    return { a: [0, 0, 0], s: 0, g: 1, metal: 0, n: null, occ: 1, emit: [c[0] + refl[0] * (fres * 0.7 + 0.12), c[1] + refl[1] * (fres * 0.7 + 0.12), c[2] + refl[2] * (fres * 0.7 + 0.12)] };
  }

  // main unit (with ramp) and the row receding to the right
  top.push(unit(-2.8, 0, { door: 3.225, doorCol: '#5e7c79', windows: [[0.55, 1.55, 1.25, 2.02], [4.55, 5.25, 1.25, 2.02]], endWindow: [-2.25, -1.05, 1.25, 2.02] }));
  const cols = ['#7d8a6f', '#86705f', '#6e7b8a', '#958a6c', '#7a7f78', '#8a7867'];
  for (let k = 1; k <= 7; k++) {
    const x0 = -2.8 + k * 7.0;
    top.push(unit(x0, 0, { door: k % 2 ? 1.0 : 3.6, doorCol: cols[(k - 1) % cols.length], windows: k % 2 ? [[2.4, 3.4, 1.25, 2.02]] : [[0.7, 1.7, 1.25, 2.02]], steps: true }));
  }
  // second row far behind (seen beyond the main unit on the left)
  for (let k = 0; k < 6; k++) {
    const x0 = -26 + k * 7.0;
    top.push(unit(x0, -27, { door: k % 2 ? 1.2 : 3.4, doorCol: cols[(k + 2) % cols.length], windows: [[2.4, 3.3, 1.25, 2.0]], steps: true }));
  }

  // ---------- ramp & landing ----------
  {
    const kids = [];
    const RL = 3.4, rz0 = 0.2, rz1 = 1.4, zc = (rz0 + rz1) / 2;
    const ang = Math.atan2(FLOOR, RL);
    const u = [Math.cos(ang), Math.sin(ang), 0], v = [-Math.sin(ang), Math.cos(ang), 0], w = [0, 0, 1];
    const deckY = x => FLOOR * (x + RL) / RL;
    // sloped deck as a deep box whose top face is the walking surface
    const HT = 0.35;
    const cTop = [-RL / 2, FLOOR / 2, zc];
    const c = add(cTop, mul(v, -HT));
    kids.push(Box(c, [RL / 2 + 0.02, HT, (rz1 - rz0) / 2], h => (h.ny > 0.9 ? timberMat(h, h.px + 10) : timberSide(h)), { ax: [u, v, w] }));
    // landing
    kids.push(Box([0.9, (FLOOR - 0.3) / 2, 0.75], [0.9, (FLOOR + 0.3) / 2, 0.75], h => (h.ny > 0.9 ? timberMat(h, h.px + 10) : timberSide(h))));
    // outer kerb
    const kc = add([-RL / 2, FLOOR / 2, rz1 - 0.03], mul(v, 0.03));
    kids.push(Box(kc, [RL / 2, 0.03, 0.03], timberSide, { ax: [u, v, w] }));
    // handrails: posts + top & mid rails on both sides of the ramp, around the landing
    const R = 0.021;
    const railSide = (z) => {
      const posts = [-RL + 0.08, -RL * 0.66, -RL * 0.33, -0.05];
      for (const x of posts) kids.push(Cyl([x, deckY(x) - 0.01, z], [x, deckY(x) + 0.9, z], R, steelMat));
      // top rail with horizontal extension at the bottom end
      kids.push(Cyl([-RL - 0.3, 0.9, z], [-RL + 0.02, 0.9 + 0.0, z], R, steelMat));
      kids.push(Cyl([-RL + 0.02, 0.9, z], [-0.05, FLOOR + 0.9, z], R, steelMat));
      kids.push(Sphere([-RL + 0.02, 0.9, z], R, steelMat));
      kids.push(Sphere([-RL - 0.3, 0.9, z], R * 1.05, steelMat));
      kids.push(Cyl([-RL + 0.08, 0.45, z], [-0.05, FLOOR + 0.45, z], R * 0.85, steelMat));
    };
    railSide(rz1 + 0.02);
    railSide(rz0 + 0.04);
    // landing rails: front edge and right edge
    const ly = FLOOR + 0.9;
    kids.push(Cyl([-0.05, ly, 1.47], [1.75, ly, 1.47], R, steelMat));
    kids.push(Cyl([1.75, ly, 1.47], [1.75, ly, 0.05], R, steelMat));
    kids.push(Sphere([1.75, ly, 1.47], R, steelMat));
    kids.push(Sphere([-0.05, ly, 1.42], R, steelMat));
    kids.push(Cyl([-0.05, FLOOR + 0.45, 1.47], [1.75, FLOOR + 0.45, 1.47], R * 0.85, steelMat));
    kids.push(Cyl([1.75, FLOOR + 0.45, 1.47], [1.75, FLOOR + 0.45, 0.05], R * 0.85, steelMat));
    for (const p of [[0.85, 1.47], [1.75, 1.47], [1.75, 0.75], [1.75, 0.08]]) kids.push(Cyl([p[0], FLOOR - 0.01, p[1]], [p[0], ly, p[1]], R, steelMat));
    // small concrete pad at the foot of the ramp
    kids.push(Box([-RL - 0.35, 0.012, zc], [0.4, 0.012, (rz1 - rz0) / 2 + 0.15], () => ({ a: lin('#aaa59c'), s: 0.02, g: 6, metal: 0, n: null, occ: 1 })));
    top.push(Group(kids));
  }

  // ---------- wheelchair (local frame: x forward, y up, z to its left) ----------
  {
    const O = [-4.55, 0, 2.05];
    const fwd = norm([0.76, 0, -0.65]), left = [fwd[2], 0, -fwd[0]];
    const Pw = (x, y, z) => [O[0] + fwd[0] * x + left[0] * z, y, O[2] + fwd[2] * x + left[2] * z];
    const toL = (px, py, pz) => { const qx = px - O[0], qz = pz - O[2]; return [qx * fwd[0] + qz * fwd[2], py, qx * left[0] + qz * left[2]]; };
    const AX = [fwd, [0, 1, 0], left];
    const kids = [];
    const tube = (a, b, r, m = frameMat) => kids.push(Cyl(Pw(...a), Pw(...b), r, m));
    const sdfBox = (lo, hi) => {
      const cs = []; for (let c = 0; c < 8; c++) cs.push(Pw(c & 1 ? hi[0] : lo[0], c & 2 ? hi[1] : lo[1], c & 4 ? hi[2] : lo[2]));
      return [[0, 1, 2].map(i => Math.min(...cs.map(p => p[i])) - 0.01), [0, 1, 2].map(i => Math.max(...cs.map(p => p[i])) + 0.01)];
    };
    // rear wheels
    const WR_ = 0.30;
    for (const s of [1, -1]) {
      const wz = 0.30 * s;
      const [b0, b1] = sdfBox([-0.32, -0.02, wz - 0.06], [0.32, 0.62, wz + 0.06]);
      kids.push(SDF(b0, b1, (px, py, pz) => { const q = toL(px, py, pz); return sdTorusZ(q[0], q[1] - WR_, q[2] - wz, 0.284, 0.017); }, tyreMat, { ne: 2e-4 }));
      kids.push(SDF(b0, b1, (px, py, pz) => { const q = toL(px, py, pz); return sdTorusZ(q[0], q[1] - WR_, q[2] - wz, 0.262, 0.0085); }, chromeMat, { ne: 2e-4 }));
      const pz = wz + 0.034 * s;
      kids.push(SDF(b0, b1, (px, py, pzz) => { const q = toL(px, py, pzz); return sdTorusZ(q[0], q[1] - WR_, q[2] - pz, 0.255, 0.0075); }, chromeMat, { ne: 2e-4 }));
      for (let k = 0; k < 6; k++) { const a = k * Math.PI / 3 + 0.3; tube([Math.cos(a) * 0.256, WR_ + Math.sin(a) * 0.256, wz + 0.006 * s], [Math.cos(a) * 0.256, WR_ + Math.sin(a) * 0.256, pz], 0.005, chromeMat); }
      // spokes (crossed pairs)
      for (let k = 0; k < 18; k++) {
        const a = k * 2 * Math.PI / 18, a2 = a + (k % 2 ? 0.35 : -0.35);
        tube([Math.cos(a2) * 0.03, WR_ + Math.sin(a2) * 0.03, wz - 0.022 * s * (k % 2 ? 1 : -1)], [Math.cos(a) * 0.255, WR_ + Math.sin(a) * 0.255, wz], 0.0016, chromeMat);
      }
      tube([0, WR_, wz - 0.04], [0, WR_, wz + 0.04], 0.026, chromeMat);
      // casters
      const cz = 0.215 * s;
      const [c0, c1] = sdfBox([0.36, -0.01, cz - 0.03], [0.53, 0.17, cz + 0.03]);
      kids.push(SDF(c0, c1, (px, py, pzz) => { const q = toL(px, py, pzz); return sdTorusZ(q[0] - 0.445, q[1] - 0.076, q[2] - cz, 0.06, 0.016); }, tyreMat, { ne: 2e-4 }));
      tube([0.445, 0.076, cz - 0.022], [0.445, 0.076, cz + 0.022], 0.02, frameMat);
      tube([0.445, 0.076, cz + 0.022 * s], [0.415, 0.21, cz + 0.022 * s], 0.008);
      tube([0.415, 0.21, cz], [0.415, 0.25, cz], 0.016);
      // side frame
      tube([-0.05, 0.24, cz + 0.01 * s], [0.415, 0.24, cz + 0.01 * s], 0.012);
      tube([0.415, 0.24, cz + 0.01 * s], [0.415, 0.50, cz + 0.01 * s], 0.012);
      tube([-0.05, 0.24, cz + 0.01 * s], [-0.05, 0.50, cz + 0.01 * s], 0.012);
      tube([-0.06, 0.50, 0.228 * s], [0.43, 0.50, 0.228 * s], 0.0125);                 // seat rail
      tube([-0.05, 0.48, 0.235 * s], [-0.115, 0.93, 0.235 * s], 0.0125);                // back post
      tube([-0.115, 0.93, 0.235 * s], [-0.24, 0.945, 0.235 * s], 0.0125);              // push handle
      tube([-0.17, 0.938, 0.235 * s], [-0.255, 0.948, 0.235 * s], 0.0175, tyreMat);    // grip
      tube([-0.02, 0.50, 0.25 * s], [-0.02, 0.70, 0.25 * s], 0.011);                    // arm supports
      tube([0.28, 0.50, 0.25 * s], [0.28, 0.70, 0.25 * s], 0.011);
      kids.push(Box(Pw(0.13, 0.715, 0.25 * s), [0.19, 0.022, 0.028], fabricMat, { ax: AX }));   // armrest pad
      tube([0.41, 0.46, 0.2 * s], [0.53, 0.17, 0.2 * s], 0.011);                        // footrest hanger
      kids.push(Box(Pw(0.575, 0.155, 0.115 * s), [0.075, 0.008, 0.09], frameMat, { ax: AX }));  // footplate
      tube([0.0, WR_, 0.235 * s], [0.0, WR_, 0.30 * s - 0.02 * s], 0.012);             // axle stub
      tube([-0.05, 0.30, 0.235 * s], [0.05, 0.30, 0.235 * s], 0.014);                   // axle plate
    }
    // cross brace
    tube([0.17, 0.25, 0.225], [0.17, 0.49, -0.225], 0.01);
    tube([0.17, 0.25, -0.225], [0.17, 0.49, 0.225], 0.01);
    // seat sling (slight sag) and backrest sling
    kids.push(Box(Pw(0.19, 0.495, 0), [0.22, 0.012, 0.228], fabricMat, { ax: AX }));
    {
      const ang = Math.atan2(0.065, 0.45);
      const bu = norm(add(mul(fwd, -Math.sin(ang)), [0, Math.cos(ang), 0]));   // up along the back
      const bn = cross(left, bu);
      kids.push(Box(Pw(-0.085, 0.71, 0), [0.012, 0.19, 0.232], fabricMat, { ax: [norm(bn), bu, left] }));
    }
    top.push(Group(kids));
  }

  // ---------- render ----------
  const res = await renderRT(top, cam, {
    sun: SUN, sunJit: 0.012, aoR: 0.7, aoN: 3, aoMax: 30, visR: 4, aoBlur: 7, seed: 77,
    miss,
    shade(h) {
      const m = h.L.mat(h);
      let nx = h.nx, ny = h.ny, nz = h.nz;
      if (m.n) { nx = m.n[0]; ny = m.n[1]; nz = m.n[2]; }
      const ndl = Math.max(0, nx * SUN[0] + ny * SUN[1] + nz * SUN[2]);
      const sunE = SUNI * ndl * h.vis * (m.occ < 1 ? (0.4 + 0.6 * m.occ) : 1);
      const up = 0.5 + 0.5 * ny;
      const ao = h.ao * m.occ;
      // sky dome brighter on the sun side; ground bounce warm
      const skySide = 1 + 0.35 * Math.max(0, nx * SUN[0] + nz * SUN[2]);
      const bounce = 0.30 * SUNI * SUN[1] * 0.32;
      let r = 0, g = 0, b = 0;
      const ambR = (SKYC[0] * SKYI * skySide * up + bounce * 0.95 * (1 - up)) * ao;
      const ambG = (SKYC[1] * SKYI * skySide * up + bounce * 0.88 * (1 - up)) * ao;
      const ambB = (SKYC[2] * SKYI * skySide * up + bounce * 0.78 * (1 - up)) * ao;
      const md = 1 - m.metal * 0.7;
      r = m.a[0] * (SUNC[0] * sunE + ambR) * md; g = m.a[1] * (SUNC[1] * sunE + ambG) * md; b = m.a[2] * (SUNC[2] * sunE + ambB) * md;
      if (m.s > 0) {
        // sun highlight (Blinn) + sky reflection for metals
        const hx = SUN[0] - h.dx, hy = SUN[1] - h.dy, hz = SUN[2] - h.dz, hl = Math.hypot(hx, hy, hz);
        const nh = Math.max(0, (nx * hx + ny * hy + nz * hz) / hl);
        const sp = m.s * Math.pow(nh, m.g) * (m.g + 2) / 8 * SUNI * h.vis * ndl;
        r += sp * SUNC[0]; g += sp * SUNC[1]; b += sp * SUNC[2];
        if (m.metal > 0) {
          const dn = h.dx * nx + h.dy * ny + h.dz * nz;
          const rx = h.dx - 2 * dn * nx, ry = h.dy - 2 * dn * ny, rz = h.dz - 2 * dn * nz;
          const env = ry > 0 ? skyCol(rx, ry, rz) : [0.32, 0.29, 0.25];
          const k = m.metal * 0.55 * ao;
          r += env[0] * k * m.a[0]; g += env[1] * k * m.a[1]; b += env[2] * k * m.a[2];
        }
      }
      if (m.emit) { r += m.emit[0]; g += m.emit[1]; b += m.emit[2]; }
      // aerial perspective
      const T = Math.exp(-h.t / 260);
      const hz = hazeAt(h.dx, h.dz);
      return [r * T + hz[0] * (1 - T), g * T + hz[1] * (1 - T), b * T + hz[2] * (1 - T)];
    },
  });
  putLinear(res.OUT, EXPO);

  // ---------- post ----------
  // soft veiling glare from the sun side (upper left), very gentle
  {
    const g = ctx.createRadialGradient(-300, -200, 100, -300, -200, 1900);
    g.addColorStop(0, 'rgba(255,248,232,0.30)'); g.addColorStop(0.5, 'rgba(255,246,230,0.08)'); g.addColorStop(1, 'rgba(255,246,230,0)');
    ctx.save(); ctx.globalCompositeOperation = 'screen'; ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); ctx.restore();
  }
  addBloom(ctx, { threshold: 0.86, knee: 0.1, radii: [6, 24, 70], weights: [0.35, 0.3, 0.25], strength: 0.45, tint: [255, 246, 232] });
  finish(ctx, {
    grain: 0.028, seed: 17, vignette: 0.22, vcx: 0.5, vcy: 0.55, vr0: 0.35, vr1: 1.1,
    grade: (r, g, b) => {
      const l = 0.2126 * r + 0.7152 * g + 0.0722 * b;
      const s = 0.88; r = l + (r - l) * s; g = l + (g - l) * s; b = l + (b - l) * s;
      const w = smooth(0.5, 1.0, l) * 0.02; r += w; b -= w * 0.7;
      return [r, g, b];
    },
  });
}
window.addEventListener('load', () => setTimeout(async () => {
  try { await main(); } catch (e) { console.error('render failed: ' + (e && e.stack || e)); }
  window.__done = true;
}, 30));
</script></body></html>
