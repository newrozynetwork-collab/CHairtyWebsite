<script>
/* window-silhouette — original illustration created for this proposal (documentary-illustration series).
   Self-contained and deterministic: all randomness comes from a seeded PRNG. */
"use strict";
// ---------------------------------------------------------------- kit
const W = 2400, H = 1600;
const cvs = document.getElementById('c');
const ctx = cvs.getContext('2d', { willReadFrequently: true });

// seeded PRNG (mulberry32)
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function makeRand(seed) {
  const r = mulberry32(seed);
  const f = () => r();
  f.range = (a, b) => a + (b - a) * r();
  f.int = (a, b) => Math.floor(a + (b - a + 1) * r());
  f.gauss = () => { let u = 0; while (u === 0) u = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * r()); };
  f.pick = arr => arr[Math.floor(r() * arr.length)];
  return f;
}
// 2D value noise in [0,1] and fBm
function makeNoise(seed) {
  const r = mulberry32(seed), P = new Uint16Array(512), G = new Float32Array(256);
  for (let i = 0; i < 256; i++) { P[i] = i; G[i] = r(); }
  for (let i = 255; i > 0; i--) { const j = Math.floor(r() * (i + 1)); const t = P[i]; P[i] = P[j]; P[j] = t; }
  for (let i = 0; i < 256; i++) P[i + 256] = P[i];
  return function (x, y) {
    const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
    const X = xi & 255, Y = yi & 255;
    const a = G[P[P[X] + Y]], b = G[P[P[X + 1] + Y]], c = G[P[P[X] + Y + 1]], d = G[P[P[X + 1] + Y + 1]];
    const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  };
}
function fbm(n, x, y, oct = 5, lac = 2.0, gain = 0.5) {
  let s = 0, a = 0.5, f = 1, norm = 0;
  for (let i = 0; i < oct; i++) { s += a * n(x * f + i * 17.3, y * f - i * 9.1); norm += a; a *= gain; f *= lac; }
  return s / norm;
}
const clamp = (v, a = 0, b = 1) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const hexRGB = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const rgba = (c, a = 1) => `rgba(${Math.round(c[0])},${Math.round(c[1])},${Math.round(c[2])},${a})`;
const mixc = (c1, c2, t) => [lerp(c1[0], c2[0], t), lerp(c1[1], c2[1], t), lerp(c1[2], c2[2], t)];
// vectors
const v3 = {
  add: (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]],
  sub: (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]],
  mul: (a, s) => [a[0] * s, a[1] * s, a[2] * s],
  dot: (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2],
  cross: (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]],
  len: a => Math.hypot(a[0], a[1], a[2]),
  norm: a => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; },
  lerp: (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t],
};
// linear light -> display (soft filmic shoulder + sRGB-ish gamma)
const toneMap = (x, exposure = 1) => Math.pow(1 - Math.exp(-Math.max(0, x) * exposure), 1 / 2.2);
const toneRGB = (c, exposure = 1) => [toneMap(c[0], exposure) * 255, toneMap(c[1], exposure) * 255, toneMap(c[2], exposure) * 255];
// layers
function newLayer(w = W, h = H) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function blurCopy(src, px, scale = 1) {
  // blurred copy of a canvas; scale<1 blurs at reduced resolution (fast, for big radii)
  const sw = Math.max(1, Math.round(src.width * scale)), sh = Math.max(1, Math.round(src.height * scale));
  const a = newLayer(sw, sh), ac = a.getContext('2d');
  ac.filter = `blur(${px * scale}px)`; ac.drawImage(src, 0, 0, sw, sh); ac.filter = 'none';
  if (scale === 1) return a;
  const b = newLayer(src.width, src.height), bc = b.getContext('2d');
  bc.imageSmoothingEnabled = true; bc.imageSmoothingQuality = 'high'; bc.drawImage(a, 0, 0, src.width, src.height);
  return b;
}
function convexHull(pts) {
  const p = pts.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  const cr = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
  const lo = [], up = [];
  for (const q of p) { while (lo.length >= 2 && cr(lo[lo.length - 2], lo[lo.length - 1], q) <= 0) lo.pop(); lo.push(q); }
  for (let i = p.length - 1; i >= 0; i--) { const q = p[i]; while (up.length >= 2 && cr(up[up.length - 2], up[up.length - 1], q) <= 0) up.pop(); up.push(q); }
  up.pop(); lo.pop(); return lo.concat(up);
}
function poly(c, pts) { c.beginPath(); c.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) c.lineTo(pts[i][0], pts[i][1]); c.closePath(); }
// bloom: bright-pass at quarter res, multi-radius blur, screen back
function addBloom(target, { threshold = 0.75, knee = 0.15, radii = [8, 24, 64], weights = [0.5, 0.35, 0.25], strength = 0.5, tint = [255, 240, 220] } = {}) {
  const s = 0.25, sw = W * s, sh = H * s;
  const small = newLayer(sw, sh), sc = small.getContext('2d', { willReadFrequently: true });
  sc.drawImage(target.canvas, 0, 0, sw, sh);
  const id = sc.getImageData(0, 0, sw, sh), d = id.data;
  for (let i = 0; i < d.length; i += 4) {
    const l = (0.2126 * d[i] + 0.7152 * d[i + 1] + 0.0722 * d[i + 2]) / 255;
    const k = smooth(threshold - knee, threshold + knee, l) * (l - threshold * 0.5);
    d[i] = d[i] * k * tint[0] / 255; d[i + 1] = d[i + 1] * k * tint[1] / 255; d[i + 2] = d[i + 2] * k * tint[2] / 255;
  }
  sc.putImageData(id, 0, 0);
  target.save(); target.globalCompositeOperation = 'screen'; target.imageSmoothingQuality = 'high';
  radii.forEach((r, i) => { const b = blurCopy(small, r * s); target.globalAlpha = clamp(strength * weights[i]); target.drawImage(b, 0, 0, W, H); });
  target.restore();
}
// final pass: optional grade, vignette, two-scale luminance film grain
function finish(target, { grain = 0.03, seed = 1, vignette = 0.3, vcx = 0.5, vcy = 0.5, vr0 = 0.35, vr1 = 0.95, grade = null } = {}) {
  const id = target.getImageData(0, 0, W, H), d = id.data, r = mulberry32(seed);
  // coarse grain field (half res, bilinear) for clumpy film structure
  const cw = W / 2 + 2, ch = H / 2 + 2, coarse = new Float32Array(cw * ch);
  for (let i = 0; i < coarse.length; i++) coarse[i] = (r() + r() + r() - 1.5) * 2;
  const diag = Math.hypot(W, H) / 2;
  for (let y = 0; y < H; y++) {
    const gy = y / 2, y0 = Math.floor(gy), fy = gy - y0;
    for (let x = 0; x < W; x++) {
      const i = (y * W + x) * 4;
      let R = d[i] / 255, G = d[i + 1] / 255, B = d[i + 2] / 255;
      if (grade) { const o = grade(R, G, B, x, y); R = o[0]; G = o[1]; B = o[2]; }
      if (vignette) {
        const dx = (x - vcx * W) / (W / 2), dy = (y - vcy * H) / (H / 2);
        const dd = Math.sqrt(dx * dx * 0.8 + dy * dy * 1.0) / 1.25;
        const v = 1 - vignette * smooth(vr0, vr1, dd);
        R *= v; G *= v; B *= v;
      }
      const gx = x / 2, x0 = Math.floor(gx), fx = gx - x0, j = y0 * cw + x0;
      const c = (coarse[j] * (1 - fx) + coarse[j + 1] * fx) * (1 - fy) + (coarse[j + cw] * (1 - fx) + coarse[j + cw + 1] * fx) * fy;
      const L = 0.2126 * R + 0.7152 * G + 0.0722 * B;
      const n = ((r() + r() + r() - 1.5) * 2 * 0.65 + c * 0.75) * grain * (0.45 + 2.2 * L * (1 - L));
      d[i] = clamp(R + n) * 255; d[i + 1] = clamp(G + n) * 255; d[i + 2] = clamp(B + n) * 255;
    }
  }
  target.putImageData(id, 0, 0);
}
// piecewise-linear colour ramp: stops = [[t,[r,g,b]],...]
function ramp(stops, t) {
  if (t <= stops[0][0]) return stops[0][1].slice();
  for (let i = 1; i < stops.length; i++) if (t <= stops[i][0]) {
    const a = stops[i - 1], b = stops[i], u = (t - a[0]) / (b[0] - a[0]);
    return mixc(a[1], b[1], u);
  }
  return stops[stops.length - 1][1].slice();
}
const v2norm = a => { const l = Math.hypot(a[0], a[1]) || 1; return [a[0] / l, a[1] / l]; };
// ---------------------------------------------------------------- scene
// ===================== WINDOW SILHOUETTE =====================
// A woman in profile (facing the light, head bowed, hair falling forward so no face is visible) stands at a
// tall window with a sheer curtain, holding a small picture frame to her chest. Backlit; calm dark wall on the left.
const DBG = typeof DEBUG_FIG !== 'undefined';
const rand = makeRand(60613);
const nA = makeNoise(611), nB = makeNoise(612), nC = makeNoise(613), nD = makeNoise(614);

// smooth path through points (Catmull-Rom -> Bezier). A point with p[2] === 1 is a sharp corner.
function spath(c, pts, closed = true) {
  const n = pts.length, get = i => closed ? pts[(i + n) % n] : pts[Math.max(0, Math.min(n - 1, i))];
  c.moveTo(pts[0][0], pts[0][1]);
  const segs = closed ? n : n - 1;
  for (let i = 0; i < segs; i++) {
    const p0 = get(i - 1), p1 = get(i), p2 = get(i + 1), p3 = get(i + 2);
    const k1 = p1[2] === 1 ? 0 : 1 / 6, k2 = p2[2] === 1 ? 0 : 1 / 6;
    c.bezierCurveTo(p1[0] + (p2[0] - p0[0]) * k1, p1[1] + (p2[1] - p0[1]) * k1, p2[0] - (p3[0] - p1[0]) * k2, p2[1] - (p3[1] - p1[1]) * k2, p2[0], p2[1]);
  }
  if (closed) c.closePath();
}
// limb outline from a chain of [x, y, r] nodes
function limb(nodes) {
  const L = [], R = [];
  for (let i = 0; i < nodes.length; i++) {
    const a = nodes[Math.max(0, i - 1)], b = nodes[Math.min(nodes.length - 1, i + 1)];
    let dx = b[0] - a[0], dy = b[1] - a[1]; const l = Math.hypot(dx, dy) || 1; dx /= l; dy /= l;
    const p = nodes[i];
    L.push([p[0] - dy * p[2], p[1] + dx * p[2]]); R.push([p[0] + dy * p[2], p[1] - dx * p[2]]);
  }
  const e = nodes[nodes.length - 1], s = nodes[0];
  const ed = v2norm([e[0] - nodes[nodes.length - 2][0], e[1] - nodes[nodes.length - 2][1]]);
  const sd = v2norm([s[0] - nodes[1][0], s[1] - nodes[1][1]]);
  return [...L, [e[0] + ed[0] * e[2] * 0.9, e[1] + ed[1] * e[2] * 0.9], ...R.reverse(), [s[0] + sd[0] * s[2] * 0.9, s[1] + sd[1] * s[2] * 0.9]];
}

// ---------- figure geometry (head units, origin at the jugular notch, x forward = towards the light) ----------
const HU = 290, OX = 1405, OY = 742;
const T = p => [OX + p[0] * HU, OY + p[1] * HU, p[2]];
const BOW = 0.47, PIV = [-0.2, -0.56], BOWT = [0.05, 0.05];
const rotH = p => {
  const s = Math.sin(BOW), c = Math.cos(BOW), x = p[0] - PIV[0], y = p[1] - PIV[1];
  return [PIV[0] + x * c - y * s + BOWT[0], PIV[1] + x * s + y * c + BOWT[1], p[2]];
};
// skull + face mass (no features; covered by hair anyway)
const HEAD = [[-0.15, -1.47], [0.12, -1.41], [0.31, -1.22], [0.39, -0.98], [0.41, -0.78], [0.36, -0.58], [0.28, -0.42], [0.12, -0.35], [-0.08, -0.42], [-0.28, -0.50], [-0.46, -0.63], [-0.58, -0.86], [-0.59, -1.10], [-0.44, -1.37]].map(rotH);
// hair: a soft bob, close to the bowed skull, falling with gravity in front of the face (final body coords)
const HAIR = [
  [-0.31, -1.22], [-0.03, -1.41], [0.32, -1.37], [0.57, -1.15], [0.665, -0.88], [0.683, -0.60], [0.668, -0.36],
  [0.640, -0.16], [0.600, -0.035], [0.53, 0.0], [0.43, -0.01], [0.30, -0.03], [0.18, -0.06], [0.05, -0.20], [-0.12, -0.38],
  [-0.30, -0.26], [-0.40, -0.17], [-0.46, -0.16], [-0.49, -0.26], [-0.50, -0.45], [-0.48, -0.72], [-0.42, -1.00],
];
const NECK = [rotH([-0.40, -0.70]), [-0.50, -0.10], [0.03, 0.02], [0.12, -0.08], rotH([0.10, -0.38]), rotH([-0.10, -0.46])];
// slightly smaller head (elegant ~8-head proportion), scaled towards the base of the neck
const HS = 0.92, HP = [-0.18, -0.12];
const hsc = p => [HP[0] + (p[0] - HP[0]) * HS, HP[1] + (p[1] - HP[1]) * HS, p[2]];
for (const arr of [HEAD, HAIR]) for (let i = 0; i < arr.length; i++) arr[i] = hsc(arr[i]);
for (const i of [0, 4, 5]) NECK[i] = hsc(NECK[i]);
const TORSO = [
  [-0.50, -0.10], [-0.62, 0.10], [-0.71, 0.38], [-0.73, 0.70], [-0.68, 1.05], [-0.60, 1.45],
  [-0.63, 1.85], [-0.74, 2.25], [-0.77, 2.60], [-0.75, 3.40], [0.30, 3.40], [0.33, 2.60], [0.31, 2.20], [0.26, 1.80],
  [0.23, 1.45], [0.25, 1.12], [0.32, 0.92], [0.42, 0.70], [0.39, 0.48], [0.25, 0.26], [0.10, 0.10], [0.03, 0.02], [-0.20, -0.06],
];
// frame: glass side towards her, top tilted slightly away from the chest (she is looking down at it)
const FR = { bl: [0.37, 1.11], tl: [0.53, 0.19] };
{
  const d = v2norm([FR.tl[0] - FR.bl[0], FR.tl[1] - FR.bl[1]]), th = 0.10;
  FR.n = [-d[1], d[0]]; if (FR.n[0] < 0) FR.n = [-FR.n[0], -FR.n[1]];
  FR.tr = [FR.tl[0] + FR.n[0] * th, FR.tl[1] + FR.n[1] * th]; FR.br = [FR.bl[0] + FR.n[0] * th, FR.bl[1] + FR.n[1] * th];
}
const FLEN = Math.hypot(FR.tl[0] - FR.bl[0], FR.tl[1] - FR.bl[1]);
// t along the frame (0 bottom .. 1 top), off across it (0 glass face .. 0.10 back face), in head units
const along = (t, off) => [lerp(FR.bl[0], FR.tl[0], t) + FR.n[0] * off, lerp(FR.bl[1], FR.tl[1], t) + FR.n[1] * off];
const UPPER_ARM = limb([[-0.26, 0.08, 0.19], [-0.22, 0.50, 0.165], [-0.16, 1.00, 0.14], [-0.10, 1.42, 0.13]]);
const FOREARM = limb([[-0.10, 1.42, 0.13], [0.08, 1.30, 0.12], [0.22, 1.18, 0.105], [0.34, 1.075, 0.088]]);
// near hand wraps the near edge of the frame: thumb on the glass side, fingers curled over the back
const HAND = [
  [-0.03, -0.05], [0.04, -0.085], [0.14, -0.08], [0.24, -0.065], [0.31, -0.08], [0.365, -0.065], [0.40, -0.03],
  [0.42, 0.02], [0.425, 0.08], [0.41, 0.13], [0.385, 0.168], [0.35, 0.152], [0.322, 0.172], [0.285, 0.166],
  [0.255, 0.15], [0.225, 0.166], [0.19, 0.157], [0.16, 0.135], [0.13, 0.148], [0.10, 0.125], [0.06, 0.09], [0.01, 0.05],
].map(p => along(p[0], p[1]));

// easel strut, folded out from the back of the frame
const STRUT = [along(0.80, 0.10), along(0.74, 0.10), [0, 0], [0, 0]];
{
  const h = along(0.77, 0.10), dir = v2norm([FR.n[0] * 0.42 + (FR.bl[0] - FR.tl[0]) / FLEN * 0.9, FR.n[1] * 0.42 + (FR.bl[1] - FR.tl[1]) / FLEN * 0.9]);

  const e = [h[0] + dir[0] * L, h[1] + dir[1] * L];

const FAR_FINGERS = [
  [0.50, 0.07], [0.525, 0.135], [0.555, 0.152], [0.585, 0.138], [0.61, 0.152], [0.64, 0.14], [0.665, 0.148], [0.69, 0.128], [0.71, 0.07],

  c.fillStyle = fills.arm; figPath(c, UPPER_ARM); c.fill();
  c.fillStyle = fills.frame; frameQuad(c); c.fill(); poly(c, STRUT.map(T)); c.fill();

  c.fillStyle = fills.arm; figPath(c, FOREARM); c.fill();

if (DBG) {
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);
  drawFigure(ctx, { body: '#222', arm: '#555', hand: '#777', frame: '#a33', hair: 'rgba(40,40,140,0.85)' });
  ctx.strokeStyle = 'rgba(0,160,0,0.6)'; ctx.lineWidth = 1;
  for (let k = -2; k <= 3; k++) { ctx.beginPath(); ctx.moveTo(0, OY + k * HU); ctx.lineTo(W, OY + k * HU); ctx.stroke(); }
  window.__done = true;
  throw new Error('debug stop');
}

// ---------- 1. what lies behind the curtain: exterior light, window members, reveal, wall ----------
const CL = 742, JAMB = 800, GLASS = 884, MULL = 1858, TRANS = 168;
const back = newLayer(), bc = back.getContext('2d');
{
  const g = bc.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#fbf8f2'); g.addColorStop(0.5, '#f7f2e8'); g.addColorStop(1, '#ebe5d7');
  bc.fillStyle = g; bc.fillRect(GLASS, 0, W - GLASS, H);
  // out-of-focus garden: soft darker masses low and to the right, a brighter sky gap upper right
  for (let k = 0; k < 60; k++) {
    const x = rand.range(1250, 2600), y = rand.range(820, 1750), r = rand.range(70, 220);
    bc.fillStyle = rgba(rand() < 0.5 ? [166, 170, 150] : [184, 182, 164], rand.range(0.06, 0.16));
    bc.beginPath(); bc.arc(x, y, r, 0, Math.PI * 2); bc.fill();
  }
  for (let k = 0; k < 18; k++) {
    const x = rand.range(2050, 2550), y = rand.range(250, 900), r = rand.range(60, 160);
    bc.fillStyle = rgba([176, 178, 160], rand.range(0.05, 0.12));
    bc.beginPath(); bc.arc(x, y, r, 0, Math.PI * 2); bc.fill();
  }
  // window members (painted timber, dark against the light)
  bc.fillStyle = '#958e83';
  bc.fillRect(GLASS - 6, 0, 62, H);                   // left stile
  bc.fillRect(MULL - 26, 0, 52, H);                   // meeting stiles
  bc.fillRect(GLASS, TRANS - 22, W - GLASS, 44);      // transom
  bc.fillRect(GLASS, 0, W - GLASS, 24);
  // reveal (lit plaster) and wall

  rg.addColorStop(0, '#a99e8f'); rg.addColorStop(1, '#dcd3c4');

// a hint of the curtain rod shadow / header at the very top

const bgCopy = newLayer(); bgCopy.getContext('2d').drawImage(cvs, 0, 0);
// sample a Catmull-Rom closed curve (same curve spath draws) as a dense polyline
function sampleCurve(pts, per = 18) {

// hair outline in pixels, with a slightly irregular edge
const hairPx = sampleCurve(HAIR.map(T), 16);
{
  const cx = hairPx.reduce((a, p) => a + p[0], 0) / hairPx.length, cy = hairPx.reduce((a, p) => a + p[1], 0) / hairPx.length;

    const k = 3.5 * (fbm(nA, i * 0.11, 3.3, 2) - 0.5) + 2.0 * (nB(i * 0.45, 9.1) - 0.5);
    p[0] += dx / l * k; p[1] += dy / l * k;

  c.fillStyle = fills.body; figPath(c, TORSO); c.fill(); figPath(c, NECK); c.fill(); figPath(c, HEAD); c.fill();
  c.fillStyle = fills.arm; figPath(c, UPPER_ARM); c.fill();
  c.fillStyle = fills.frame; frameQuad(c); c.fill(); poly(c, STRUT.map(T)); c.fill();
  c.fillStyle = fills.hand; figPath(c, FAR_FINGERS); c.fill();
  c.fillStyle = fills.arm; figPath(c, FOREARM); c.fill();

}
const mask = newLayer(), mk = mask.getContext('2d');
drawFigure2(mk, { body: '#fff', arm: '#fff', hand: '#fff', frame: '#fff', hair: '#fff' });
const hairM = newLayer(), hmk = hairM.getContext('2d'); hmk.fillStyle = '#fff'; drawHair(hmk);
const maskSoft = (() => { const m = blurCopy(mask, 1.0), c = m.getContext('2d'); c.drawImage(blurCopy(hairM, 2.6), 0, 0); return m; })();
const fig = newLayer(), fc = fig.getContext('2d');
drawFigure2(fc, { body: '#1c1815', arm: '#201b18', hand: '#231d1a', frame: '#1b1613', hair: '#16110e' });
{
  // knit texture and a faint fill from the room (camera side)

  for (let Y = 280; Y < H; Y++) for (let X = 1050; X < 1800; X++) {
