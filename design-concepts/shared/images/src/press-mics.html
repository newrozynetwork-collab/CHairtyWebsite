    for (let k = 0; k < 4; k++) disc(rand.range(60, 560), rand.range(250, 1000), rand.range(24, 34), 0.07 + 0.05 * rand(), [235, 240, 236]);
    bc.globalCompositeOperation = 'source-over';
  }
  const bgData = bgBlur.getContext('2d').getImageData(0, 0, W, H).data;
  const UNT = new Float32Array(256); for (let i = 0; i < 256; i++) { const x = Math.min(0.999, Math.pow(i / 255, 2.2)); UNT[i] = -Math.log(1 - x) / EXPO; }
  const miss = (dx, dy, dz, x, y) => { const i = (Math.min(H - 1, Math.floor(y)) * W + Math.min(W - 1, Math.floor(x))) * 4; return [UNT[bgData[i]], UNT[bgData[i + 1]], UNT[bgData[i + 2]]]; };

  // ---------- 2. microphones ----------
  const sdRoundCone = (px, py, pz, ax, ay, az, bx, by, bz, r1, r2) => {
    const bax = bx - ax, bay = by - ay, baz = bz - az, l2 = bax * bax + bay * bay + baz * baz, rr = r1 - r2, a2 = l2 - rr * rr, il2 = 1 / l2;
    const pax = px - ax, pay = py - ay, paz = pz - az;
    const y = pax * bax + pay * bay + paz * baz, z = y - l2;
    const qx = pax * l2 - bax * y, qy = pay * l2 - bay * y, qz = paz * l2 - baz * y;
    const x2 = qx * qx + qy * qy + qz * qz, y2 = y * y * l2, z2 = z * z * l2;
    const k = Math.sign(rr) * rr * rr * x2;
    if (Math.sign(z) * a2 * z2 > k) return Math.sqrt(x2 + z2) * il2 - r2;
    if (Math.sign(y) * a2 * y2 < k) return Math.sqrt(x2 + y2) * il2 - r1;
    return (Math.sqrt(x2 * a2 * il2) + y * rr) * il2 - r1;
  };
  const bboxOf = (pts, pad) => [[0, 1, 2].map(i => Math.min(...pts.map(p => p[i])) - pad), [0, 1, 2].map(i => Math.max(...pts.map(p => p[i])) + pad)];
  const top = [];
  const HB = [0.165, 1.235, 0.0];                 // clip bar on the lectern's top front edge
  const M = [-0.55, 1.65, 0.02];                  // where the speaker's mouth would be
  const ax0 = norm(sub(M, HB)), uz = [0, 0, 1], vy = norm(cross(uz, ax0));
  const paintMat = (col, s = 0.22, gl = 50) => () => ({ a: lin(col), s, g: gl, kind: 'paint' });
  const metalMat = (col, s = 0.7, gl = 80) => () => ({ a: lin(col), s, g: gl, kind: 'metal' });
  function foamMat(col, scale) {
    const c = lin(col);
    return h => {
      const n1 = nA(h.px * scale + h.pz * scale * 0.7, h.py * scale), n2 = nB(h.px * scale * 2.3 - h.pz * scale, h.py * scale * 2.3 + h.pz * scale * 0.5);
      const pore = smooth(0.18, 0.05, nC(h.px * scale * 3.1 + h.py * 50, h.py * scale * 3.1 - h.pz * scale * 2.2));
      return { a: scl(c, (0.82 + 0.3 * n1 * n2 + 0.08 * (n2 - 0.5)) * (1 - 0.45 * pore)), s: 0.0, g: 1, kind: 'foam', bump: (n1 - 0.5) * 0.7 };
    };
  }
  const mics = [];
  function addMic(m) {
    const tail = add(HB, add(mul(uz, m.off[0]), mul(vy, m.off[1])));
    const dir = norm(add(sub(M, tail), [0, m.jit[1], m.jit[0]]));
    const at = d => add(tail, mul(dir, d));
    const kids = [];
    const bodyEnd = m.body;
    const b0 = at(0.0), b1 = at(bodyEnd);
    const bb = bboxOf([b0, b1], m.br + 0.01);
    kids.push(SDF(bb[0], bb[1], (x, y, z) => sdRoundCone(x, y, z, b0[0], b0[1], b0[2], b1[0], b1[1], b1[2], m.br * 0.72, m.br), paintMat(m.bodyCol || '#1c1d1f'), { ne: 2e-4 }));
    if (m.band) kids.push(Cyl(at(bodyEnd * 0.42), at(bodyEnd * 0.42 + 0.012), m.br * 0.88 + 0.0022, m.band === true ? metalMat('#8b8e91') : paintMat(m.band, 0.2)));
    if (m.type === 'ball' || m.type === 'grille') {
      const r = m.r, c = at(bodyEnd + r * 0.72);
      kids.push(Cyl(at(bodyEnd - 0.014), at(bodyEnd + 0.006), m.br + 0.0032, metalMat('#4e5154', 0.6, 70)));
      if (m.type === 'ball') kids.push(Sphere(c, r, foamMat(m.col, 380)));
      else kids.push(Sphere(c, r, h => {
        const q = sub([h.px, h.py, h.pz], c), u = Math.atan2(q[1], q[2]) * 28, v = Math.acos(clamp(dot(q, dir) / r, -1, 1)) * 28;
        const hole = Math.abs(Math.sin(u + Math.sin(v) * 0.6) * Math.sin(v));
        return { a: scl(lin('#a9adb0'), 0.22 + 0.78 * smooth(0.2, 0.7, 1 - hole)), s: 0.7, g: 50, kind: 'metal' };
      }));
      m.headC = c; m.headR = r;
    } else if (m.type === 'egg') {
      const r = m.r, a = at(bodyEnd + r * 0.6), b = at(bodyEnd + r * 1.55);
      kids.push(Cyl(at(bodyEnd - 0.014), at(bodyEnd + 0.006), m.br + 0.0032, metalMat('#4e5154', 0.6, 70)));
      const bb2 = bboxOf([a, b], r + 0.01);
      kids.push(SDF(bb2[0], bb2[1], (x, y, z) => sdRoundCone(x, y, z, a[0], a[1], a[2], b[0], b[1], b[2], r, r * 0.82), foamMat(m.col, 380), { ne: 2e-4 }));
      m.headC = b; m.headR = r;
    } else if (m.type === 'shotgun' || m.type === 'fur') {
      const r = m.r, a = at(bodyEnd + r * 0.8), b = at(bodyEnd + m.flen - r);
      if (m.type === 'fur') {
        const bb2 = bboxOf([a, b], r + 0.02);
        kids.push(SDF(bb2[0], bb2[1], (x, y, z) => sdCapsule(x, y, z, a[0], a[1], a[2], b[0], b[1], b[2], r) - 0.004 * nC(x * 320, y * 320 + z * 320), h => {
          const n = nD(h.px * 1100 + h.pz * 500, h.py * 1100 - h.pz * 400), n2 = nA(h.px * 180, h.py * 180 + h.pz * 180);
          return { a: scl(lin(m.col), 0.42 + 0.62 * n + 0.22 * n2), s: 0, g: 1, kind: 'fur', bump: (n - 0.5) * 1.5 };
        }, { ne: 7e-4, k: 0.6, steps: 140 }));
      } else {
        kids.push(Cyl(a, b, r, foamMat(m.col, 330)));
        kids.push(Sphere(a, r, foamMat(m.col, 330)));
        kids.push(Sphere(b, r, foamMat(m.col, 330)));
      }
      m.headC = b; m.headR = r;
    }
    // clip holding the tail on the bar
    kids.push(Box(at(0.012), [0.016, 0.014, 0.014], paintMat('#141516', 0.2), { ax: [dir, norm(cross(uz, dir)), uz] }));
    m.tail = tail; m.dir = dir;
    top.push(Group(kids));
    mics.push(m);
  }
  // off: [depth (z), height across the bundle]; muted covers
  addMic({ type: 'shotgun', off: [-0.06, 0.085], jit: [0.03, 0.03], body: 0.19, r: 0.021, flen: 0.19, br: 0.0105, col: '#5d5f63', band: true });
  addMic({ type: 'ball', off: [0.04, 0.06], jit: [-0.01, 0.025], body: 0.22, r: 0.042, br: 0.0205, col: '#38393c' });
  addMic({ type: 'ball', off: [-0.03, 0.025], jit: [0.03, 0.0], body: 0.21, r: 0.04, br: 0.0195, col: '#5a3638', band: '#3f4a57' });
  addMic({ type: 'egg', off: [0.08, 0.0], jit: [-0.045, 0.0], body: 0.21, r: 0.034, br: 0.019, col: '#35455a' });
  addMic({ type: 'grille', off: [0.01, -0.03], jit: [0.0, -0.01], body: 0.2, r: 0.029, br: 0.019, bodyCol: '#242528', band: true });
  addMic({ type: 'fur', off: [-0.07, -0.025], jit: [0.045, -0.02], body: 0.14, r: 0.034, flen: 0.15, br: 0.012, col: '#867b6e' });
  addMic({ type: 'ball', off: [0.05, -0.065], jit: [-0.02, -0.035], body: 0.18, r: 0.038, br: 0.019, col: '#252628', band: '#5d4636' });
  addMic({ type: 'ball', off: [-0.035, 0.115], jit: [0.02, 0.05], body: 0.17, r: 0.036, br: 0.018, col: '#5b604f' });
  // the clip bar and its post
  {
    const kids = [], dark = paintMat('#18191b', 0.3);
    kids.push(Box([HB[0] + 0.005, HB[1] - 0.012, 0], [0.012, 0.012, 0.11], dark));
    kids.push(Cyl([HB[0] + 0.005, 1.105, 0], [HB[0] + 0.005, HB[1] - 0.02, 0], 0.009, dark));
    kids.push(Cyl([HB[0] + 0.005, 1.105, 0], [HB[0] + 0.005, 1.116, 0], 0.045, dark));
    top.push(Group(kids));
  }
  // cables: out of the tails, down onto the podium and over its front edge (right)
  {
    const cm = () => ({ a: lin('#121212'), s: 0.25, g: 40, kind: 'cable' });
    const cr = (p0, p1, p2, p3, t) => [0, 1, 2].map(i => 0.5 * ((2 * p1[i]) + (-p0[i] + p2[i]) * t + (2 * p0[i] - 5 * p1[i] + 4 * p2[i] - p3[i]) * t * t + (-p0[i] + 3 * p1[i] - 3 * p2[i] + p3[i]) * t * t * t));
    for (const [mi, ez] of [[6, 0.09]]) {
      const kids = [], a = mics[mi].tail, d = mics[mi].dir;
      const pts = [a, add(a, mul(d, -0.05)), [0.235, 1.215, ez], [0.25, 1.17, ez + 0.02], [0.255, 0.95, ez + 0.04]];
      const P = [pts[0]].concat(pts, [pts[pts.length - 1]]);
      let prev = null;
      for (let s = 1; s < P.length - 2; s++) for (let k = 0; k <= 8; k++) {
        const q = cr(P[s - 1], P[s], P[s + 1], P[s + 2], k / 8);
        if (prev) kids.push(Cyl(prev, q, 0.0042, cm));
        kids.push(Sphere(q, 0.0042, cm)); prev = q;
      }
      top.push(Group(kids));
    }
  }
  // lectern: dark walnut, sloped reading top (low on the speaker's side), side panel towards us
  const WAL = lin('#3f2c21'), WAL2 = lin('#22170f');
  const XB = -0.33, XF = 0.2, YB = 1.06, YF = 1.2, ZH = 0.3;
  const slope = Math.atan2(YF - YB, XF - XB);
  const tu = [Math.cos(slope), Math.sin(slope), 0], tv = [-Math.sin(slope), Math.cos(slope), 0];
  const woodTop = h => {
    const q = (h.px - XB) * tu[0] + (h.py - YB) * tu[1];
    const g1 = fbm(nB, h.pz * 6, q * 30, 4), g2 = nC(h.pz * 2, q * 7);
    return { a: scl(mixc(WAL, WAL2, clamp(0.35 + 0.9 * (g1 - 0.5) + 0.3 * (g2 - 0.5))), 0.95), s: 0.3, g: 40, kind: 'wood' };
  };
  const sideMat = h => {
    const g1 = fbm(nB, h.px * 22 + 3, h.py * 2.2, 4), g2 = nD(h.px * 60, h.py * 6);
    let a = scl(mixc(WAL, WAL2, clamp(0.45 + 1.0 * (g1 - 0.5) + 0.2 * (g2 - 0.5))), 0.85);
    // a slim lighter edge banding along the sloped top edge and the front edge
    const dTop = (YB + (h.px - XB) * Math.tan(slope)) - h.py, dFront = XF - h.px;
    const inset = Math.min(dTop - 0.06, dFront - 0.06, h.px - XB - 0.06, h.py - 0.06);
    if (Math.abs(h.pz) > ZH - 0.001 && Math.abs(inset) < 0.004) a = scl(a, 0.55);                 // routed groove around a raised panel
    if (Math.abs(h.pz) > ZH - 0.001 && inset > 0.004) a = scl(a, 1.06);
    return { a, s: 0.22, g: 30, kind: 'wood' };
  };
  // top board (sloped)
  const tc = [(XB + XF) / 2 + tv[0] * -0.015, (YB + YF) / 2 + tv[1] * -0.015, 0];
  top.push(Box(add(tc, mul(tu, 0.012)), [Math.hypot(XF - XB, YF - YB) / 2 + 0.03, 0.016, ZH + 0.03], woodTop, { ax: [tu, tv, [0, 0, 1]] }));
  // side panels as prisms (trapezoid in x-y, thickness in z)
  const prism = zc => (x, y, z) => {
    const dz = Math.abs(z - zc) - 0.018;
    const dTop = ((x - XB) * tv[0] + (y - YB) * tv[1]) + 0.03;          // below the sloped top
    const d2 = Math.max(XB - x, x - XF, -y, dTop);
    return Math.max(dz, d2);
  };
  for (const zc of [ZH, -ZH]) top.push(SDF([XB - 0.01, -0.01, zc - 0.03], [XF + 0.01, YF + 0.01, zc + 0.03], prism(zc), sideMat, { k: 0.95, ne: 2e-4 }));
  top.push(Box([XF - 0.012, (YF - 0.03) / 2, 0], [0.012, (YF - 0.03) / 2, ZH], sideMat));

  // ---------- 3. lighting ----------
  const KEY = norm([0.62, 0.55, 0.56]), KEYC = [1.0, 0.9, 0.78], KEYI = 2.5;      // TV lights on the audience side
  const RIM = norm([-0.8, 0.3, -0.45]), RIMC = [0.78, 0.88, 1.0], RIMI = 3.0;   // daylight windows behind the speaker
  const FILL = norm([0.0, 0.2, 1.0]), FILLC = [1.0, 0.86, 0.7], FILLI = 0.45;
  const res = await renderRT(top, cam, {
    sun: KEY, sunJit: 0.12, aoR: 0.05, aoN: 4, aoMax: 5, visR: 5, aoBlur: 6, seed: 9,
    miss,
    shade(h) {
      const m = h.L.mat(h);
      let nx = h.nx, ny = h.ny, nz = h.nz;
      if (m.bump) { nx += m.bump * 0.25; ny += m.bump * 0.18; nz -= m.bump * 0.1; const l = Math.hypot(nx, ny, nz); nx /= l; ny /= l; nz /= l; }
      const vx = -h.dx, vy = -h.dy, vz = -h.dz;
      const ndv = Math.max(0, nx * vx + ny * vy + nz * vz);
      const soft = m.kind === 'foam' || m.kind === 'fur';
      const wrap = soft ? 0.5 : 0.08;
      const lam = L => Math.max(0, (nx * L[0] + ny * L[1] + nz * L[2] + wrap) / (1 + wrap));
      const ao = h.ao;
      const k = KEYI * lam(KEY) * (0.2 + 0.8 * h.vis), rr = RIMI * lam(RIM), ff = FILLI * lam(FILL);
      const amb = 0.12 * ao;
      let r = m.a[0] * (KEYC[0] * k + RIMC[0] * rr + FILLC[0] * ff + amb * 0.95);
      let gg = m.a[1] * (KEYC[1] * k + RIMC[1] * rr + FILLC[1] * ff + amb * 0.88);
      let b = m.a[2] * (KEYC[2] * k + RIMC[2] * rr + FILLC[2] * ff + amb * 0.8);
      if (soft) {
        const sh = Math.pow(1 - ndv, 2.5) * (0.5 * RIMI * Math.max(0, nx * RIM[0] + ny * RIM[1] + nz * RIM[2] + 0.3) + 0.25 * KEYI * Math.max(0, nx * KEY[0] + ny * KEY[1] + nz * KEY[2] + 0.3));
        r += sh * 0.05 * RIMC[0] * (0.6 + m.a[0] * 4); gg += sh * 0.05 * RIMC[1] * (0.6 + m.a[1] * 4); b += sh * 0.05 * RIMC[2] * (0.6 + m.a[2] * 4);
      }
      if (m.s > 0) {
        for (const [L, C, I, vis] of [[KEY, KEYC, KEYI, h.vis], [RIM, RIMC, RIMI, 1]]) {
          const hx = L[0] + vx, hy = L[1] + vy, hz = L[2] + vz, hl = Math.hypot(hx, hy, hz);
          const nh = Math.max(0, (nx * hx + ny * hy + nz * hz) / hl);
          const sp = m.s * Math.pow(nh, m.g) * (m.g + 2) / 8 * I * vis * Math.max(0, nx * L[0] + ny * L[1] + nz * L[2]);
          r += sp * C[0]; gg += sp * C[1]; b += sp * C[2];
        }
        const dn = h.dx * nx + h.dy * ny + h.dz * nz;
        const rx = h.dx - 2 * dn * nx, ry = h.dy - 2 * dn * ny, rz = h.dz - 2 * dn * nz;
        const fres = 0.04 + 0.96 * Math.pow(1 - ndv, 5);
        const e = 0.12 + 0.2 * smooth(-0.3, 0.8, ry) + 0.25 * smooth(0.0, 0.9, -rx);
        const kk = m.kind === 'metal' ? 0.45 * m.s : 0.6 * fres * m.s;
        r += e * 1.0 * kk; gg += e * 0.93 * kk; b += e * 0.86 * kk;
      }
      return [r, gg, b];
    },
  });
  putLinear(res.OUT, EXPO);

  // ---------- 4. depth of field (focus on the heads) ----------
  {
    const zf = 1.53;
    const b1 = blurCopy(cvs, 2), b2 = blurCopy(cvs, 5), b3 = blurCopy(cvs, 11);
    const d0 = ctx.getImageData(0, 0, W, H), d = d0.data;
    const d1 = b1.getContext('2d').getImageData(0, 0, W, H).data, d2 = b2.getContext('2d').getImageData(0, 0, W, H).data, d3 = b3.getContext('2d').getImageData(0, 0, W, H).data;
    for (let i = 0; i < W * H; i++) {
      if (!res.ID[i]) continue;
      const c = Math.abs(1 / zf - 1 / res.T[i]) * 16;
      if (c < 0.35) continue;
      const j = i * 4, w1 = clamp((c - 0.35) / 1.4), w2 = clamp((c - 1.8) / 3), w3 = clamp((c - 5) / 6);
      for (let k = 0; k < 3; k++) { let v = lerp(d[j + k], d1[j + k], w1); v = lerp(v, d2[j + k], w2); d[j + k] = lerp(v, d3[j + k], w3); }
    }
    ctx.putImageData(d0, 0, 0);
  }
  addBloom(ctx, { threshold: 0.8, knee: 0.12, radii: [6, 24, 80], weights: [0.35, 0.35, 0.3], strength: 0.4, tint: [255, 232, 205] });
  finish(ctx, {
    grain: 0.03, seed: 61, vignette: 0.3, vcx: 0.5, vcy: 0.5, vr0: 0.3, vr1: 1.05,
    grade: (r, gg, b) => {
      const l = 0.2126 * r + 0.7152 * gg + 0.0722 * b;
      const s = 0.86; r = l + (r - l) * s; gg = l + (gg - l) * s; b = l + (b - l) * s;
      const c = 0.02 * (1 - smooth(0.0, 0.35, l)); b += c * 0.6; r -= c * 0.2;
      return [r, gg, b];
    },
  });
}
window.addEventListener('load', () => setTimeout(async () => {
  try { await main(); } catch (e) { console.error('render failed: ' + (e && e.stack || e)); }
  window.__done = true;
}, 30));
</script></body></html>
