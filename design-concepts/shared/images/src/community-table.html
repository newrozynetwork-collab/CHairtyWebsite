<script>
/* community-table — original illustration created for this proposal (documentary-illustration series).

"use strict";
// ---------------------------------------------------------------- kit
const W = 2400, H = 1600;
const cvs = document.getElementById('c');
const ctx = cvs.getContext('2d', { willReadFrequently: true });

// seeded PRNG (mulberry32)
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);

  f.range = (a, b) => a + (b - a) * r();
  f.int = (a, b) => Math.floor(a + (b - a + 1) * r());
  f.gauss = () => { let u = 0; while (u === 0) u = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * r()); };
  f.pick = arr => arr[Math.floor(r() * arr.length)];

}
// 2D value noise in [0,1] and fBm
function makeNoise(seed) {

  for (let i = 0; i < 256; i++) { P[i] = i; G[i] = r(); }
  for (let i = 255; i > 0; i--) { const j = Math.floor(r() * (i + 1)); const t = P[i]; P[i] = P[j]; P[j] = t; }
  for (let i = 0; i < 256; i++) P[i + 256] = P[i];

    const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
    const X = xi & 255, Y = yi & 255;
    const a = G[P[P[X] + Y]], b = G[P[P[X + 1] + Y]], c = G[P[P[X] + Y + 1]], d = G[P[P[X + 1] + Y + 1]];
    const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;

}
function fbm(n, x, y, oct = 5, lac = 2.0, gain = 0.5) {

const rgba = (c, a = 1) => `rgba(${Math.round(c[0])},${Math.round(c[1])},${Math.round(c[2])},${a})`;

const v3 = {

  mul: (a, s) => [a[0] * s, a[1] * s, a[2] * s],
  dot: (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2],

const toneMap = (x, exposure = 1) => Math.pow(1 - Math.exp(-Math.max(0, x) * exposure), 1 / 2.2);

function newLayer(w = W, h = H) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

  const a = newLayer(sw, sh), ac = a.getContext('2d');

  const cr = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);

  for (const q of p) { while (lo.length >= 2 && cr(lo[lo.length - 2], lo[lo.length - 1], q) <= 0) lo.pop(); lo.push(q); }

function addBloom(target, { threshold = 0.75, knee = 0.15, radii = [8, 24, 64], weights = [0.5, 0.35, 0.25], strength = 0.5, tint = [255, 240, 220] } = {}) {
  const s = 0.25, sw = W * s, sh = H * s;
  const small = newLayer(sw, sh), sc = small.getContext('2d', { willReadFrequently: true });
  sc.drawImage(target.canvas, 0, 0, sw, sh);
  const id = sc.getImageData(0, 0, sw, sh), d = id.data;
  for (let i = 0; i < d.length; i += 4) {
    const l = (0.2126 * d[i] + 0.7152 * d[i + 1] + 0.0722 * d[i + 2]) / 255;
    const k = smooth(threshold - knee, threshold + knee, l) * (l - threshold * 0.5);

  }
  sc.putImageData(id, 0, 0);
  target.save(); target.globalCompositeOperation = 'screen'; target.imageSmoothingQuality = 'high';
  radii.forEach((r, i) => { const b = blurCopy(small, r * s); target.globalAlpha = clamp(strength * weights[i]); target.drawImage(b, 0, 0, W, H); });
  target.restore();

// final pass: optional grade, vignette, two-scale luminance film grain
function finish(target, { grain = 0.03, seed = 1, vignette = 0.3, vcx = 0.5, vcy = 0.5, vr0 = 0.35, vr1 = 0.95, grade = null } = {}) {
  const id = target.getImageData(0, 0, W, H), d = id.data, r = mulberry32(seed);
  // coarse grain field (half res, bilinear) for clumpy film structure
  const cw = W / 2 + 2, ch = H / 2 + 2, coarse = new Float32Array(cw * ch);
  for (let i = 0; i < coarse.length; i++) coarse[i] = (r() + r() + r() - 1.5) * 2;
  const diag = Math.hypot(W, H) / 2;
  for (let y = 0; y < H; y++) {
    const gy = y / 2, y0 = Math.floor(gy), fy = gy - y0;
    for (let x = 0; x < W; x++) {
      const i = (y * W + x) * 4;
      let R = d[i] / 255, G = d[i + 1] / 255, B = d[i + 2] / 255;
      if (grade) { const o = grade(R, G, B, x, y); R = o[0]; G = o[1]; B = o[2]; }

// piecewise-linear colour ramp: stops = [[t,[r,g,b]],...]
function ramp(stops, t) {

const v2norm = a => { const l = Math.hypot(a[0], a[1]) || 1; return [a[0] / l, a[1] / l]; };
// ---------------------------------------------------------------- scene
// ===================== COMMUNITY TABLE =====================
// Early evening in a courtyard. A long table with a linen cloth runs away from the camera, set with cups and a
// teapot; string lights between timber poles; people sitting at the far end against a warm doorway.
const rand = makeRand(24680);
const nA = makeNoise(501), nB = makeNoise(502), nC = makeNoise(503), nD = makeNoise(504);
function hash1(n) { let h = Math.imul((n | 0) ^ 0x9e3779b9, 0x85ebca6b); h ^= h >>> 13; h = Math.imul(h, 0xc2b2ae35); h ^= h >>> 16; return (h >>> 0) / 4294967296; }

// ---------- camera & courtyard (metres) ----------
const F = 1750, CX = 1200, CY = 690, CAMY = 1.3;
const P = (x, y, z) => [CX + F * x / z, CY - F * (y - CAMY) / z];
const ZF = 2.35, KC = 30;
const coc = z => KC * Math.abs(1 / z - 1 / ZF);
const TX = 0.08, TW = 0.49, TY = 0.75, TZ0 = 0.9, TZ1 = 8.9;      // table centre-line x, half width, height, z range
const WL = -3.2, WR = 3.4, WH = 2.4, ZB = 13.0, BH = 3.6;          // side walls, far building
const DOOR = { x: 0.32, hw: 0.66, spring: 2.0 };
const WIN1 = { x0: -2.1, x1: -1.35, y0: 1.15, y1: 2.25 };

// ---------- lights: string lights between poles, the doorway ----------
const lights = [], strands = [];
const POLES = [3.2, 7.0, 9.3, 11.8];

  for (let k = 0; k <= 40; k++) { const t = k / 40; s.wire.push([lerp(a[0], b[0], t), lerp(a[1], b[1], t) - sag * 4 * t * (1 - t), lerp(a[2], b[2], t)]); }
  for (let k = 1; k < n; k++) {
    const t = (k + rand.range(-0.08, 0.08)) / n;
    const p = [lerp(a[0], b[0], t), lerp(a[1], b[1], t) - sag * 4 * t * (1 - t) - 0.07, lerp(a[2], b[2], t)];
    const I = 0.05 * rand.range(0.85, 1.15);

  }

}
for (const z of POLES) addStrand([-3.0, 3.25, z], [3.0, 3.2, z], 0.36);
addStrand([-3.0, 3.25, 7.0], [3.0, 3.2, 9.3], 0.42);
addStrand([-3.0, 3.25, 9.3], [3.0, 3.2, 11.8], 0.42);
for (const [dx, dy] of [[-0.35, 1.0], [0.35, 1.0], [0, 1.9]]) lights.push({ x: DOOR.x + dx, y: dy, z: ZB + 0.05, I: 0.55, col: [1.0, 0.72, 0.42], hemi: -1 });

// chairs (for shadows and drawing): [x of seat centre, z, side (-1 left, +1 right), yaw jitter, occupied]
const chairs = [];
{
  const zs = [1.7, 2.45, 3.2, 3.95, 4.7, 5.45, 6.2, 6.95, 7.7, 8.45];
  for (const side of [-1, 1]) zs.forEach((z, k) => {
    const pulled = rand.range(0.0, 0.12) + (k < 3 ? 0.06 : 0);
    chairs.push({ x: TX + side * (TW + 0.20 + pulled), z: z + rand.range(-0.06, 0.06), side, yaw: rand.range(-0.12, 0.12), occ: false });
  });
}

// ---------- 1. surfaces: per-pixel ray cast + lighting + depth ----------
function castRay(X, Y) {
  const dx = (X + 0.5 - CX) / F, dy = -(Y + 0.5 - CY) / F;
  let best = null, bz = 1e9;
  if (dy < 0) {
    const z = (TY - CAMY) / dy, x = dx * z;
    if (z >= TZ0 && z <= TZ1 && x >= TX - TW && x <= TX + TW) { bz = z; best = [0, x, TY, z]; }
    const zg = -CAMY / dy, xg = dx * zg;

  }

  { const x = dx * ZB, y = CAMY + dy * ZB; if (x >= WL && x <= WR && y >= 0 && y <= BH && ZB < bz) { bz = ZB; best = [4, x, y, ZB]; } }

const SKY = [[0.00, [62, 84, 120]], [0.30, [88, 108, 140]], [0.55, [132, 140, 160]], [0.75, [186, 170, 168]], [0.90, [224, 190, 160]], [1.0, [236, 200, 160]]];
const skyAt = Y => ramp(SKY, clamp(Y / 560));

const surf = ctx.createImageData(W, H), SD = surf.data;

  for (let X = 0; X < W; X++) {
    const i = Y * W + X, o = i * 4, h = castRay(X, Y);
    if (!h) { const c = skyAt(Y); SD[o] = c[0]; SD[o + 1] = c[1]; SD[o + 2] = c[2]; SD[o + 3] = 255; continue; }
    const [kind, x, y, z] = h;
    depth[i] = z;
    let n, alb, emit = null;

      n = [0, 1, 0];

      const d2 = lx * lx + ly * ly + lz * lz;

        if (vis && ly > 0.45) { const t = (0.45 - y) / ly; if (seatHit(x + lx * t, z + lz * t)) vis = 0.25; }
      }

// depth of field on the surfaces
const main = (() => {
  const sl = newLayer(), slc = sl.getContext('2d'); slc.putImageData(surf, 0, 0);
  const levels = [0, 1.2, 2.5, 4, 6, 8];
  const datas = levels.map(s => (s ? blurCopy(sl, s, s > 4 ? 0.5 : 1) : sl).getContext('2d').getImageData(0, 0, W, H).data);
  const out = new Uint8ClampedArray(W * H * 4);

  contactShadow(g, x, z, 0.1, 0.3);
  ell(g, c[0], c[1], rx, ry, rgba(shade(CERAMIC, x, TY, z, [0, 1, 0])));
  ell(g, c[0], c[1] + 1, rx * 0.7, ry * 0.7, rgba(shade(CERAMIC.map(v => v * 0.94), x, TY, z, [0, 1, 0])));
  if (bread) { const bc = shade([0.66, 0.44, 0.24], x, TY + 0.04, z, [0, 1, 0]); ell(g, c[0], c[1] - ry * 0.35, rx * 0.62, ry * 1.1 + 4, rgba(bc)); }
}
// place settings
{
  const zs = [1.75, 2.5, 3.25, 4.0, 4.75, 5.5, 6.25, 7.0, 7.75, 8.5];
  for (const side of [-1, 1]) zs.forEach((z, k) => {
    const rr = makeRand(k * 13 + (side > 0 ? 7 : 3));
    if (rr() < 0.1) return;
    const x = TX + side * (TW - 0.17) + rr.range(-0.03, 0.03), zz = z + rr.range(-0.08, 0.08);
    const handle = rr() < 0.6 ? (rr() < 0.5 ? 1 : -1) : 0, saucer = rr() < 0.35, empty = rr() < 0.2;
    const col = rr() < 0.25 ? [0.55, 0.62, 0.62] : rr() < 0.2 ? [0.72, 0.52, 0.38] : null;
    addObj(zz, [P(x - 0.12, TY, zz)[0], P(x, TY + 0.1, zz)[1] - 6, P(x + 0.12, TY, zz)[0], P(x, TY, zz - 0.1)[1] + 6], g => cup(g, x, zz, { handle, saucer, empty, col }));
    if (rr() < 0.3) { const px = TX + side * (TW - 0.33), pz = zz + 0.02; addObj(pz + 0.001, [P(px - 0.12, TY, pz)[0], P(px, TY + 0.08, pz)[1], P(px + 0.12, TY, pz)[0], P(px, TY, pz - 0.12)[1]], g => plate(g, px, pz, rr() < 0.4)); }
  });
  const tp = [TX + 0.02, 2.4];
  addObj(tp[1], [P(tp[0] - 0.2, TY, tp[1])[0], P(tp[0], TY + 0.24, tp[1])[1], P(tp[0] + 0.22, TY, tp[1])[0], P(tp[0], TY, tp[1] - 0.15)[1]], g => teapot(g, tp[0], tp[1]));
  const tp2 = [TX - 0.04, 5.9];
  addObj(tp2[1], [P(tp2[0] - 0.2, TY, tp2[1])[0], P(tp2[0], TY + 0.24, tp2[1])[1], P(tp2[0] + 0.22, TY, tp2[1])[0], P(tp2[0], TY, tp2[1] - 0.15)[1]], g => teapot(g, tp2[0], tp2[1]));
  addObj(3.9, [P(TX - 0.2, TY, 3.9)[0], P(TX, TY + 0.15, 3.9)[1], P(TX + 0.25, TY, 3.9)[0], P(TX, TY, 3.75)[1]], g => bowl(g, TX + 0.04, 3.9));
  addObj(4.9, [P(TX - 0.3, TY, 4.9)[0], P(TX, TY + 0.45, 4.9)[1], P(TX + 0.3, TY, 4.9)[0], P(TX, TY, 4.8)[1]], g => vase(g, TX - 0.02, 4.9));
  addObj(7.2, [P(TX - 0.2, TY, 7.2)[0], P(TX, TY + 0.1, 7.2)[1], P(TX + 0.2, TY, 7.2)[0], P(TX, TY, 7.05)[1]], g => plate(g, TX + 0.05, 7.2, true));
}

// --- poles, wires and bulbs ---
for (const z of POLES) for (const sx of [-3.0, 3.0]) {
  const a = P(sx, 0, z), b = P(sx, 3.32, z), w = Math.max(2, F * 0.07 / z);
  addObj(z, [a[0] - w, b[1], a[0] + w, a[1]], g => {
    const col = shade([0.30, 0.22, 0.15], sx, 1.5, z, [-Math.sign(sx), 0, -0.5]);
    g.fillStyle = rgba(col); g.fillRect(a[0] - w / 2, b[1], w, a[1] - b[1]);
    g.fillStyle = rgba(col.map(v => v * 1.25)); g.fillRect(a[0] - w / 2 + (sx < 0 ? w * 0.55 : 0), b[1], w * 0.45, a[1] - b[1]);
  });
}
for (const s of strands) {
  // wire as segments with their own depth
  for (let k = 0; k < s.wire.length - 1; k += 4) {
    const seg = s.wire.slice(k, Math.min(s.wire.length, k + 5)), zm = seg.reduce((a, p) => a + p[2], 0) / seg.length;
    const sp = seg.map(p => P(...p)), xs = sp.map(p => p[0]), ys = sp.map(p => p[1]);
    addObj(zm, [Math.min(...xs), Math.min(...ys) - 3, Math.max(...xs), Math.max(...ys) + 3], g => {
      g.strokeStyle = 'rgba(28,22,20,0.85)'; g.lineWidth = Math.max(1, F * 0.006 / zm); g.beginPath(); sp.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])); g.stroke();
    });
  }
  for (const bb of s.bulbs) {
    const p = P(...bb.p), r = Math.max(1.6, F * 0.028 / bb.p[2]);
    const o = { z: bb.p[2], bbox: [p[0] - r * 6, p[1] - r * 6, p[0] + r * 6, p[1] + r * 6], draw: g => {
      const gl = g.createRadialGradient(p[0], p[1], 0, p[0], p[1], r * 6);
      gl.addColorStop(0, 'rgba(255,214,150,0.5)'); gl.addColorStop(0.25, 'rgba(255,170,90,0.14)'); gl.addColorStop(1, 'rgba(255,150,70,0)');
      g.fillStyle = gl; g.beginPath(); g.arc(p[0], p[1], r * 6, 0, Math.PI * 2); g.fill();
      const gb = g.createRadialGradient(p[0], p[1] - r * 0.2, 0, p[0], p[1], r);
      gb.addColorStop(0, 'rgba(255,250,232,1)'); gb.addColorStop(0.6, 'rgba(255,214,150,1)'); gb.addColorStop(1, 'rgba(255,180,110,0.9)');
      g.fillStyle = gb; g.beginPath(); g.arc(p[0], p[1], r, 0, Math.PI * 2); g.fill();
      g.fillStyle = 'rgba(30,24,20,0.9)'; g.fillRect(p[0] - r * 0.35, p[1] - r * 1.5, r * 0.7, r * 0.6);
    }, zTest: bb.p[2], add: false };
    objs.push(o);
  }
}

// --- vegetation: tree canopy over the right wall, climbing plants, potted plants, distant trees ---
function foliage(g, cx, cy, rx, ry, seed, dark, lit, litDir) {
  const fr = makeRand(seed);
  for (let k = 0; k < 260; k++) {
    const a = fr() * Math.PI * 2, rr = Math.sqrt(fr());
    const x = cx + Math.cos(a) * rx * rr, y = cy + Math.sin(a) * ry * rr, s = fr.range(0.025, 0.06) * Math.min(rx, ry);
    const t = clamp(0.5 + 0.5 * ((y - cy) / ry) * litDir + fr.range(-0.2, 0.2));
    g.fillStyle = rgba(mixc(dark, lit, t * t), 0.9);
    g.beginPath(); g.ellipse(x, y, s * 1.6, s, fr.range(0, Math.PI), 0, Math.PI * 2); g.fill();
  }
}
{
  // big tree behind the right wall
  const c = P(5.6, 5.4, 9.0), rx = F * 3.6 / 9.0, ry = F * 2.9 / 9.0;
  addObj(9.0, [c[0] - rx * 1.1, c[1] - ry * 1.1, c[0] + rx * 1.1, c[1] + ry * 1.1], g => {
    foliage(g, c[0], c[1], rx, ry, 11, [24, 32, 30], [96, 82, 52], 1);
    foliage(g, c[0] - rx * 0.5, c[1] + ry * 0.55, rx * 0.6, ry * 0.4, 12, [30, 36, 32], [150, 112, 62], 1);
  }, 9.0);
  // distant trees beyond the far building
  for (const [x, y, r, seed] of [[-2.4, 4.6, 2.2, 21], [1.6, 4.9, 2.6, 22], [4.4, 4.2, 2.0, 23], [-5.0, 4.0, 2.4, 24]]) {
    const cc = P(x, y, 18), rr = F * r / 18;
    addObj(18, [cc[0] - rr * 1.2, cc[1] - rr, cc[0] + rr * 1.2, cc[1] + rr * 1.4], g => foliage(g, cc[0], cc[1] + rr * 0.3, rr * 1.15, rr, seed, [48, 56, 62], [84, 88, 92], -1), 18);
  }
  // climbing plant on the left wall, potted lemon trees along the right wall
  for (const [z0, z1, seed] of [[5.0, 7.4, 31], [9.6, 12.4, 32]]) {
    const a = P(WL + 0.05, 2.25, z0), b = P(WL + 0.05, 0.4, z1);
    addObj((z0 + z1) / 2, [Math.min(a[0], b[0]) - 40, a[1] - 40, Math.max(a[0], b[0]) + 40, b[1] + 40], g => {
      const fr = makeRand(seed);
      for (let k = 0; k < 420; k++) {
        const z = lerp(z0, z1, fr()), y = lerp(0.3, 2.45, Math.pow(fr(), 0.7)), p = P(WL + 0.06, y, z), s = F * 0.05 / z;
        const t = clamp(lightAt(WL + 0.06, y, z, [1, 0, 0])[0] * 8);
        g.fillStyle = rgba(mixc([26, 36, 26], [140, 120, 66], t), 0.92); g.beginPath(); g.ellipse(p[0], p[1], s * 0.9, s * 0.6, fr() * 3, 0, Math.PI * 2); g.fill();
      }
    });
  }
  for (const z of [6.1, 10.6]) {
    const x = WR - 0.45, pot = [P(x, 0, z), P(x, 0.55, z)], r = F * 0.3 / z;
    addObj(z, [pot[0][0] - r * 3, P(x, 2.0, z)[1], pot[0][0] + r * 3, pot[0][1] + 4], g => {
      const pc = shade([0.55, 0.30, 0.18], x - 0.2, 0.3, z, [-1, 0, -0.4]);
      g.fillStyle = rgba(pc); g.beginPath(); g.moveTo(pot[0][0] - r * 0.75, pot[0][1]); g.lineTo(pot[1][0] - r, pot[1][1]); g.lineTo(pot[1][0] + r, pot[1][1]); g.lineTo(pot[0][0] + r * 0.75, pot[0][1]); g.closePath(); g.fill();
      const tr = P(x, 1.25, z);
      g.strokeStyle = 'rgb(46,34,26)'; g.lineWidth = Math.max(1, F * 0.03 / z); g.beginPath(); g.moveTo(pot[1][0], pot[1][1]); g.lineTo(tr[0], tr[1]); g.stroke();
      foliage(g, tr[0], tr[1] - r * 0.8, r * 1.6, r * 1.4, Math.round(z * 10), [28, 40, 28], [120, 112, 60], 1);
      const fr = makeRand(Math.round(z * 7));
      for (let k = 0; k < 9; k++) { const a = fr() * 6.28, rr = Math.sqrt(fr()) * r * 1.3; g.fillStyle = 'rgba(214,170,60,0.9)'; g.beginPath(); g.arc(tr[0] + Math.cos(a) * rr, tr[1] - r * 0.8 + Math.sin(a) * rr * 0.9, Math.max(1, r * 0.09), 0, Math.PI * 2); g.fill(); }
    });
  }
}

// ---------- 3. composite objects far to near ----------
objs.sort((a, b) => b.z - a.z);
for (const o of objs) composite(o);
{
  const out = ctx.createImageData(W, H); out.data.set(main); ctx.putImageData(out, 0, 0);
}
// ---------- 4. atmosphere: warm glow under the lights, bloom, finish ----------
{
  const hz = newLayer(), hc = hz.getContext('2d'); hc.globalCompositeOperation = 'lighter';
  for (const L of lights) { if (L.hemi) continue; const p = P(L.x, L.y, L.z), r = F * 0.9 / L.z; const g = hc.createRadialGradient(p[0], p[1], 0, p[0], p[1], r); g.addColorStop(0, 'rgba(255,170,90,0.05)'); g.addColorStop(1, 'rgba(255,170,90,0)'); hc.fillStyle = g; hc.fillRect(p[0] - r, p[1] - r, 2 * r, 2 * r); }
  const dp = P(DOOR.x, 1.4, ZB), dr = 520; const g = hc.createRadialGradient(dp[0], dp[1], 0, dp[0], dp[1], dr); g.addColorStop(0, 'rgba(255,190,120,0.10)'); g.addColorStop(1, 'rgba(255,190,120,0)'); hc.fillStyle = g; hc.fillRect(dp[0] - dr, dp[1] - dr, 2 * dr, 2 * dr);
  ctx.save(); ctx.globalCompositeOperation = 'screen'; ctx.drawImage(blurCopy(hz, 12, 0.25), 0, 0); ctx.restore();
}
addBloom(ctx, { threshold: 0.74, knee: 0.14, radii: [4, 16, 56], weights: [0.5, 0.4, 0.3], strength: 0.7, tint: [255, 222, 184] });
finish(ctx, {
  grain: 0.032, seed: 41, vignette: 0.3, vcx: 0.5, vcy: 0.55, vr0: 0.32, vr1: 1.05,
  grade: (r, g, b) => {
    const l = 0.2126 * r + 0.7152 * g + 0.0722 * b;
    const s = 0.9; r = l + (r - l) * s; g = l + (g - l) * s; b = l + (b - l) * s;
    return [r, g, b];
  },
});
window.__done = true;
