<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Components · Human Stories (design concept 02)</title>
<link rel="stylesheet" href="../../shared/fonts.css">
<link rel="stylesheet" href="styles.css">
<style>
  body { padding: 40px; }
  body::after { display: none; }
  #components {
    display: inline-flex; align-items: center; justify-content: space-between; gap: 12px;
    width: 640px; height: 132px; padding: 0 22px; border-radius: 24px;
    background: var(--cream); box-shadow: inset 0 0 0 1.5px var(--line);
  }
  #components .btn { height: 48px; padding: 0 20px; font-size: 15px; }
  #components .btn--secondary { padding: 0 18px; }
  #components .link { font-size: 15px; white-space: nowrap; }
  #components .chip { height: 32px; background: var(--sand); }
</style>
</head>
<body>
<div id="components">
  <a class="btn btn--primary" href="#">Give monthly</a>
  <a class="btn btn--secondary" href="#">Read the report</a>
  <a class="link" href="#">Our methodology</a>
  <span class="chip">Women’s Rights</span>
</div>
</body>
</html>
