<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Components — Bold Advocacy</title>
<link rel="stylesheet" href="../../shared/fonts.css">
<link rel="stylesheet" href="styles.css">
<style>
  body { background: #fff; margin: 0; padding: 24px; }
  #components { display: inline-flex; align-items: center; gap: 16px; padding: 22px 22px; background: var(--black); color: var(--white); max-width: 640px; }
  #components .btn { height: 52px; font-size: 22px; padding: 0 18px 0 20px; }
  #components .btn svg { width: 19px; height: 19px; }
  #components .link { font-size: 14px; }
</style>
</head>
<body>
<svg class="defs" aria-hidden="true" focusable="false">
  <defs>
    <!-- Black → signal-yellow gradient map with a poster S-curve -->
    <filter id="duo-yellow" color-interpolation-filters="sRGB" x="0" y="0" width="100%" height="100%">
      <feColorMatrix type="matrix" values=".2126 .7152 .0722 0 0  .2126 .7152 .0722 0 0  .2126 .7152 .0722 0 0  0 0 0 1 0"/>
      <feComponentTransfer>
        <feFuncR type="table" tableValues="0 0 .1 .45 .85 1 1"/>
        <feFuncG type="table" tableValues="0 0 .1 .45 .85 1 1"/>
        <feFuncB type="table" tableValues="0 0 .1 .45 .85 1 1"/>
      </feComponentTransfer>
      <feComponentTransfer>
        <feFuncR type="table" tableValues="0.043 1"/>
        <feFuncG type="table" tableValues="0.043 0.882"/>
        <feFuncB type="table" tableValues="0.043 0.302"/>
      </feComponentTransfer>
    </filter>
    <!-- Black → alarm-red gradient map -->
    <filter id="duo-red" color-interpolation-filters="sRGB" x="0" y="0" width="100%" height="100%">
      <feColorMatrix type="matrix" values=".2126 .7152 .0722 0 0  .2126 .7152 .0722 0 0  .2126 .7152 .0722 0 0  0 0 0 1 0"/>
      <feComponentTransfer>
        <feFuncR type="table" tableValues="0 0 .14 .52 .9 1"/>
        <feFuncG type="table" tableValues="0 0 .14 .52 .9 1"/>
        <feFuncB type="table" tableValues="0 0 .14 .52 .9 1"/>
      </feComponentTransfer>
      <feComponentTransfer>
        <feFuncR type="table" tableValues="0.043 0.851 1"/>
        <feFuncG type="table" tableValues="0.043 0.169 0.62"/>
        <feFuncB type="table" tableValues="0.043 0.110 0.52"/>
      </feComponentTransfer>
    </filter>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M3 12h16M12.5 4.5 20 12l-7.5 7.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="square"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M6 3.5v17l14-8.5z" fill="currentColor"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10" cy="10" r="6.5" fill="none" stroke="currentColor" stroke-width="2.6"/><path d="M15 15l6 6" stroke="currentColor" stroke-width="2.8" stroke-linecap="square"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M2 5h20M2 12h20M2 19h20" stroke="currentColor" stroke-width="3"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 3v13M5.5 10 12 16.5 18.5 10M4 21h16" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="square"/></symbol>
    <symbol id="i-mark" viewBox="0 0 42 42"><path d="M7 27a14 14 0 0 1 28 0z" fill="#FFE14D"/><rect x="1" y="30" width="40" height="6" fill="#FFE14D"/></symbol>
    <symbol id="s-a" viewBox="0 0 24 24"><path d="M3 4h18v12H9l-5 4v-4H3z" fill="none" stroke="currentColor" stroke-width="2.2"/></symbol>
    <symbol id="s-b" viewBox="0 0 24 24"><rect x="2.5" y="5" width="19" height="14" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M10 9v6l5-3z" fill="currentColor"/></symbol>
    <symbol id="s-c" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2"/><circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="2.2"/><rect x="16" y="5.5" width="2.5" height="2.5" fill="currentColor"/></symbol>
    <symbol id="s-d" viewBox="0 0 24 24"><path d="M4 4h16v16H4z" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M8 16V11M12 16V8M16 16v-3" stroke="currentColor" stroke-width="2.4"/></symbol>
  </defs>
</svg>
<div id="components" class="dark">
  <a class="btn btn--yellow" href="#">Donate <svg aria-hidden="true"><use href="#i-arrow"/></svg></a>
  <a class="btn btn--red" href="#">Add your name</a>
  <a class="link" href="#">Read the report <svg aria-hidden="true"><use href="#i-arrow"/></svg></a>
  <span class="tag tag--yellow">Campaign</span>
</div>
</body>
</html>
