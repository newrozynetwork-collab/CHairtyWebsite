<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Components · Daybreak Rights Network</title>
<link rel="stylesheet" href="../../shared/fonts.css">
<link rel="stylesheet" href="styles.css">
<style>
  body { padding: 24px; }
  #components { display: inline-flex; align-items: center; gap: 16px; padding: 22px 20px; background: var(--cream); }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="i-arrow" viewBox="0 0 16 16"><path d="M1.5 8h12.2M9.2 3.6 13.6 8l-4.4 4.4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-down" viewBox="0 0 16 16"><path d="M8 1.5v9.2M3.9 6.9 8 11l4.1-4.1M2.5 14.5h11" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</svg>
<div id="components">
  <a class="btn btn--tomato" href="#">Donate</a>
  <a class="btn btn--ink" href="#">Read the feature <svg class="ico"><use href="#i-arrow"/></svg></a>
  <a class="link" href="#">All stories <svg class="ico"><use href="#i-arrow"/></svg></a>
  <span class="chip chip--tag">Feature</span>
</div>
</body>
</html>
